<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>社員別給与設定</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;margin:0;color:#111827}.w{max-width:720px;margin:auto;padding:22px 16px 48px}.c{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin-bottom:14px}h1,h2{margin:0 0 8px}.m{font-size:13px;color:#64748b;line-height:1.7}.back{display:inline-block;margin-bottom:12px;color:#2563eb;text-decoration:none;font-weight:800}label{display:block;font-size:13px;font-weight:800;margin-top:12px}input,select{width:100%;box-sizing:border-box;padding:12px;margin-top:5px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;background:#fff}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:16px;background:#0f766e;color:#fff;font-weight:800;font-size:16px}.note{background:#fff7ed;border:1px solid #fdba74;border-radius:12px;padding:12px;font-size:13px;line-height:1.7}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.locked{background:#f1f5f9;color:#475569}.hide{display:none}@media(max-width:620px){.grid2{grid-template-columns:1fr}}</style></head><body><div class="w"><a class="back" href="./payroll-calc.html">← 給与計算下書きへ戻る</a><div class="c"><h1>社員別給与設定</h1><div class="m">給与計算に使う基礎金額を社員ごとに登録します。</div></div><div class="c"><div class="note"><b>会社の給与区分</b><br>正社員＝日給月給、パート＝時給として自動判定します。正社員は日給月給の月額、パートは時給を入力してください。</div><label>社員</label><select id="employee"></select><div class="grid2"><div><label>給与区分</label><select id="wageType"><option value="">未設定</option><option value="daily_monthly">日給月給</option><option value="hourly">時給</option></select></div><div><label>交通費（月額）</label><input id="transport" type="number" min="0" placeholder="円"></div><div id="monthlyWrap"><label>日給月給（月額）</label><input id="monthly" type="number" min="0" placeholder="円"></div><div id="hourlyWrap"><label>時給</label><input id="hourly" type="number" min="0" step="1" placeholder="円"></div></div><button class="btn" id="save">この社員の給与設定を保存</button><div id="status" class="m" style="margin-top:12px"></div></div></div><script>const API='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/employee-pay-settings';let employees=[];async function post(p){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j}function setTypeFor(e){let t=e?.wage_type||'';if(e?.employment_type==='正社員')t='daily_monthly';if(e?.employment_type==='パート')t='hourly';wageType.value=t;const locked=e?.employment_type==='正社員'||e?.employment_type==='パート';wageType.disabled=locked;wageType.classList.toggle('locked',locked);monthlyWrap.classList.toggle('hide',t==='hourly');hourlyWrap.classList.toggle('hide',t==='daily_monthly');return t}function fill(){const e=employees.find(x=>String(x.id)===employee.value);if(!e){wageType.value='';wageType.disabled=false;monthly.value='';hourly.value='';transport.value='';monthlyWrap.classList.remove('hide');hourlyWrap.classList.remove('hide');return}const t=setTypeFor(e);monthly.value=e.monthly_salary??'';hourly.value=e.hourly_base??'';transport.value=e.transportation_allowance??0;status.textContent=`${e.name}：${e.employment_type||'雇用形態未設定'} / ${t==='daily_monthly'?'日給月給':t==='hourly'?'時給':'給与区分未設定'}`}async function load(){try{const current=employee.value;const j=await post({action:'list'});employees=j.data||[];employee.innerHTML='<option value="">選択してください</option>'+employees.map(e=>`<option value="${e.id}">${e.name}（${e.department||''}・${e.employment_type||'未設定'}）</option>`).join('');if(current){employee.value=current;fill()}}catch(e){status.textContent='読み込みエラー：'+e.message}}employee.onchange=fill;wageType.onchange=()=>{monthlyWrap.classList.toggle('hide',wageType.value==='hourly');hourlyWrap.classList.toggle('hide',wageType.value==='daily_monthly')};save.onclick=async()=>{if(!employee.value)return alert('社員を選んでください');const e=employees.find(x=>String(x.id)===employee.value);const t=e?.employment_type==='正社員'?'daily_monthly':e?.employment_type==='パート'?'hourly':wageType.value;if(t==='daily_monthly'&&!monthly.value)return alert('日給月給の月額を入力してください');if(t==='hourly'&&!hourly.value)return alert('時給を入力してください');try{save.disabled=true;await post({action:'save',id:Number(employee.value),wage_type:t,monthly_salary:monthly.value,hourly_base:hourly.value,transportation_allowance:transport.value});status.textContent='保存しました。';alert('社員別給与設定を保存しました');await load()}catch(e){alert('保存エラー：'+e.message)}finally{save.disabled=false}};load();</script></body></html>
