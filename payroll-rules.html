<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>給与ルール設定</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;margin:0;color:#111827}.w{max-width:680px;margin:auto;padding:24px 16px 48px}.c{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin-bottom:14px}h1,h2{margin:0 0 8px}.m{font-size:13px;color:#64748b;line-height:1.7}label{display:block;font-size:13px;font-weight:800;margin-top:12px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;margin-top:5px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;background:#fff}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:16px;background:#0f766e;color:#fff;font-weight:800;font-size:16px}.note{background:#fff7ed;border:1px solid #fdba74;border-radius:12px;padding:12px;font-size:13px;line-height:1.7}.back{display:inline-block;margin-bottom:12px;color:#2563eb;text-decoration:none;font-weight:800}</style></head><body><div class="w"><a class="back" href="./hr.html">← 勤怠・給与へ戻る</a><div class="c"><h1>給与ルール設定</h1><div class="m">会社共通の給与計算ルールを登録します。ここで保存した内容を、今後のタイムカード・欠務届・年間カレンダー照合に使います。</div></div><div class="c"><div class="note"><b>現在の前提</b><br>20日締め・月末支給。給与期間は前月21日〜当月20日です。年間カレンダー上で出勤日の土曜日を休んだ場合、その日の賃金は70％支給として扱います。</div><label>締日</label><input id="cutoff" type="number" min="1" max="31" value="20"><label>支給日</label><select id="payment"><option value="month_end">月末</option></select><label>出勤土曜日を休んだ場合の支給率（％）</label><input id="satRate" type="number" min="0" max="100" step="0.1" value="70"><h2 style="margin-top:24px">手当</h2><label>食費手当の計算方法</label><select id="mealType"><option value="per_workday">出勤日ごと</option><option value="monthly_fixed">月額固定</option></select><label>食費手当の金額</label><input id="mealAmount" type="number" min="0" placeholder="円"><label>皆勤手当（月額）</label><input id="perfectAmount" type="number" min="0" placeholder="円"><label>交通費の扱い</label><select id="transportType"><option value="employee_fixed">社員ごとに月額設定</option><option value="monthly_fixed">全員共通の月額固定</option></select><label>交通費の共通初期額</label><input id="transportDefault" type="number" min="0" placeholder="円"><div class="m">社員ごとに金額が違う場合は「社員ごとに月額設定」を使います。各社員の交通費は社員詳細側へ順次反映します。</div><label>その他の会社ルール・メモ</label><textarea id="note" rows="5" placeholder="例：有休、遅刻・早退、欠勤控除など"></textarea><button class="btn" id="save">給与ルールを保存</button><div id="status" class="m" style="margin-top:12px"></div></div></div><script>const API='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/hr-direct';async function callApi(p){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j}async function load(){try{const j=await callApi({action:'get_payroll_rules'}),d=j.data||{};cutoff.value=d.cutoff_day??20;payment.value=d.payment_timing||'month_end';satRate.value=d.saturday_absence_pay_rate??70;mealType.value=d.meal_allowance_type||'per_workday';mealAmount.value=d.meal_allowance_amount??0;perfectAmount.value=d.perfect_attendance_allowance??0;transportType.value=d.transportation_allowance_type||'employee_fixed';transportDefault.value=d.transportation_allowance_default??0;note.value=d.note||'';status.textContent='現在の設定を読み込みました。'}catch(e){status.textContent='読み込みエラー：'+e.message}}save.onclick=async()=>{try{save.disabled=true;await callApi({action:'save_payroll_rules',cutoff_day:Number(cutoff.value||20),payment_timing:payment.value,saturday_absence_pay_rate:Number(satRate.value||70),meal_allowance_type:mealType.value,meal_allowance_amount:Number(mealAmount.value||0),perfect_attendance_allowance:Number(perfectAmount.value||0),transportation_allowance_type:transportType.value,transportation_allowance_default:Number(transportDefault.value||0),note:note.value});status.textContent='給与ルールを保存しました。';alert('給与ルールを保存しました')}catch(e){alert('保存エラー：'+e.message)}finally{save.disabled=false}};load();</script></body></html>
