<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>事務アプリ</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;margin:0;color:#111827}.wrap{max-width:650px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 16px 40px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px}h1{margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.btn{border:0;border-radius:14px;padding:18px 8px;background:#111827;color:#fff;font-weight:800;font-size:16px;text-decoration:none;text-align:center}.btn.hr{background:#2563eb}.muted{color:#64748b;font-size:13px;line-height:1.6}.form{display:none;margin-top:14px;padding-top:14px;border-top:1px solid #e2e8f0}input,select{width:100%;box-sizing:border-box;padding:12px;margin:5px 0 9px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.save{width:100%;padding:14px;border:0;border-radius:12px;background:#2563eb;color:white;font-weight:800}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./standalone-auth.js"></script></head><body><div class="wrap"><div class="card"><div style="font-size:12px;font-weight:800;color:#64748b">OFFICE</div><h1>事務アプリ</h1><div class="muted">事務用品、備品・設備、経費、勤怠・給与実績を登録します。入力した数字は経営側へ集約されます。</div><div class="grid"><button class="btn" onclick="show('supply')">事務用品</button><button class="btn" onclick="show('asset')">備品・設備</button><button class="btn" onclick="show('expense')">経費</button><button class="btn" onclick="show('purchase')">購入申請</button><a class="btn hr" href="./hr.html" style="grid-column:1/-1">勤怠・給与</a></div><div id="form" class="form"></div></div></div><script>
const db=supabase.createClient('https://vnnvuxccazkdzwqjmntz.supabase.co','sb_publishable_xG-tuBgxFGntT1vlbZzuVQ_AZ2Zl8QL');
function show(t){const f=document.getElementById('form');f.style.display='block';if(t==='supply')f.innerHTML='<b>事務用品を登録</b><input id="n" placeholder="品名 例：コピー用紙"><select id="c"><option>事務用品</option><option>梱包用品</option><option>衛生用品</option><option>作業用品</option></select><input id="q" type="number" placeholder="現在庫"><input id="r" type="number" placeholder="発注点"><input id="p" type="number" placeholder="単価 円"><button class="save" onclick="saveSupply()">登録</button>';if(t==='asset')f.innerHTML='<b>備品・設備を登録</b><input id="n" placeholder="名称 例：ノートPC"><input id="c" placeholder="分類 例：PC・複合機・測定器"><input id="p" type="number" placeholder="購入価格"><input id="loc" placeholder="設置場所・使用者"><button class="save" onclick="saveAsset()">登録</button>';if(t==='expense')f.innerHTML='<b>経費を登録</b><select id="c"><option>事務用品費</option><option>修繕費</option><option>通信費</option><option>水道光熱費</option><option>外注費</option><option>その他</option></select><input id="p" type="number" placeholder="金額"><input id="n" placeholder="内容"><button class="save" onclick="saveExpense()">登録</button>';if(t==='purchase')f.innerHTML='<b>購入申請</b><input id="n" placeholder="購入したい物"><input id="q" type="number" value="1" placeholder="数量"><input id="reason" placeholder="理由"><button class="save" onclick="savePurchase()">申請</button>';}
async function saveSupply(){const {error}=await db.from('office_supplies').insert({name:n.value,category:c.value,current_stock:Number(q.value||0),reorder_point:Number(r.value||0),unit_price:Number(p.value||0)});alert(error?'エラー：'+error.message:'登録しました');}
async function saveAsset(){const {error}=await db.from('company_assets').insert({asset_name:n.value,category:c.value,purchase_price:Number(p.value||0),location:loc.value});alert(error?'エラー：'+error.message:'登録しました');}
async function saveExpense(){const {error}=await db.from('company_expenses').insert({department:'事務',category:c.value,amount:Number(p.value||0),description:n.value});alert(error?'エラー：'+error.message:'登録しました');}
async function savePurchase(){const {error}=await db.from('purchase_requests').insert({department:'事務',item_type:'備品・消耗品',item_name:n.value,quantity:Number(q.value||1),reason:reason.value});alert(error?'エラー：'+error.message:'申請しました');}
</script></body></html>
