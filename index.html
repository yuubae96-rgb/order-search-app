<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c2024"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="見積管理"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><title>見積もりノート</title><link rel="stylesheet" href="style.css?v=20260821-2325"></head><body>
<div class="auth-gate" id="authGate"><div class="auth-card"><div class="auth-mark">見</div><div class="auth-title">見積管理にログイン</div><div class="auth-sub">会社の見積データをクラウドから読み込みます</div><div class="auth-error" id="authError"></div><form id="loginForm"><div class="field"><label>メールアドレス</label><input type="email" id="loginEmail" required></div><div class="field"><label>パスワード</label><input type="password" id="loginPassword" required></div><button type="submit" class="btn btn-primary btn-block" id="loginBtn">ログイン</button></form></div></div>
<div class="topbar"><div class="topbar-inner"><div class="plate-badge">見</div><div class="topbar-titles"><div class="brand">HOTMILK QUOTE PLATE</div><div class="screen-name" id="screenTitle">見積もりノート</div></div></div></div>
<main><section class="screen active" id="screen-register" data-screen="register"><div class="card"><div class="card-title" id="formCardTitle">新規見積もりの登録</div><form id="orderForm"><div class="row2"><div class="field"><label>見積日<span class="req">必須</span></label><input type="date" id="f_orderDate" required></div><div class="field"><label>納期</label><input type="date" id="f_dueDate"></div></div><div class="field"><label>会社名<span class="req">必須</span></label><input type="text" id="f_company" required></div><div class="row2"><div class="field"><label>見積番号</label><input type="text" id="f_orderNumber"></div><div class="field"><label>担当者</label><input type="text" id="f_staff"></div></div><div class="field"><label>品名</label><input type="text" id="f_itemName"></div><div class="field"><label>見積結果</label><select id="f_result"><option value="pending">回答待ち</option><option value="won">受注</option><option value="lost">失注</option></select></div><div class="row2"><div class="field"><label>材質</label><select id="f_material"><option value="">選択してください</option><option value="アルミ">アルミ</option><option value="ステンレス">ステンレス</option><option value="真鍮">真鍮</option><option value="カラーアルマイト">カラーアルマイト</option><option value="その他">その他</option></select></div><div class="field"><label>板厚（mm）</label><input type="number" id="f_thickness" step="0.01"></div></div><div class="field" id="materialOtherField" style="display:none"><label>材質名</label><input type="text" id="f_materialOther"></div><div class="row2"><div class="field"><label>縦サイズ（mm）</label><input type="number" id="f_sizeV" step="0.1"></div><div class="field"><label>横サイズ（mm）</label><input type="number" id="f_sizeH" step="0.1"></div></div><div class="row2"><div class="field"><label>見積金額（円）</label><input type="number" id="f_amount" min="0" value="0" required></div><div class="field"><label>数量</label><input type="number" id="f_quantity"></div></div><div class="field"><label>備考</label><textarea id="f_note"></textarea></div><div class="field"><label>図面・添付ファイル</label><input type="file" id="f_drawing"><div id="drawingStatus"></div></div><div class="btn-row"><button type="submit" class="btn btn-primary btn-block" id="submitBtn">登録する</button><button type="button" class="btn btn-ghost" id="cancelEditBtn" style="display:none">キャンセル</button></div></form></div><div class="card" id="recentCard"><div class="card-title">最近登録した見積もり</div><div id="recentList"></div></div></section>
<section class="screen" id="screen-search" data-screen="search"><div class="card"><div class="card-title">期間をワンタッチで指定</div><div class="chip-row" id="periodChips"><button class="chip" data-period="thisMonth">今月</button><button class="chip" data-period="lastMonth">先月</button><button class="chip" data-period="last30">過去30日</button><button class="chip" data-period="thisYear">今年</button><button class="chip active" data-period="all">すべて</button></div><div class="card-title">見積結果で絞り込み</div><div class="chip-row" id="resultChips"><button class="chip active" data-result="">すべて</button><button class="chip" data-result="pending">回答待ちだけ</button><button class="chip" data-result="won">受注だけ</button><button class="chip" data-result="lost">失注だけ</button></div><div class="filter-grid"><div class="field"><label>会社名</label><input id="s_company"></div><div class="field"><label>見積番号</label><input id="s_orderNumber"></div><div class="field"><label>見積日（開始）</label><input type="date" id="s_startDate"></div><div class="field"><label>見積日（終了）</label><input type="date" id="s_endDate"></div><div class="field"><label>品名</label><input id="s_itemName"></div><div class="field"><label>担当者</label><input id="s_staff"></div><div class="field"><label>材質</label><select id="s_material"><option value="">すべて</option><option>アルミ</option><option>ステンレス</option><option>真鍮</option><option>カラーアルマイト</option><option>その他</option></select></div><div class="field"><label>板厚</label><input type="number" id="s_thickness"></div><div class="field"><label>縦</label><input type="number" id="s_sizeV"></div><div class="field"><label>横</label><input type="number" id="s_sizeH"></div></div><button class="btn btn-ghost btn-block" id="clearFilterBtn">条件をクリア</button></div><div class="summary-plate"><div class="summary-grid"><div class="summary-item"><div class="label">該当見積件数</div><div class="value nums" id="sumCount">0</div></div><div class="summary-item"><div class="label">見積金額合計</div><div class="value nums" id="sumTotal">0</div></div><div class="summary-item"><div class="label">平均見積金額</div><div class="value nums" id="sumAvg">0</div></div></div></div><div class="card"><select id="sortKey" class="sort-select"><option value="date_desc">見積日：新しい順</option><option value="date_asc">見積日：古い順</option><option value="amount_desc">金額：高い順</option><option value="amount_asc">金額：低い順</option><option value="company">会社名順</option></select></div><div id="searchResults"></div></section>
<section class="screen" id="screen-analysis" data-screen="analysis"><div class="stat-cards"><div class="card"><div class="stat-label">今月の見積件数</div><div class="stat-value nums" id="an_thisMonthCount">0</div></div><div class="card"><div class="stat-label">今月の見積金額合計</div><div class="stat-value nums" id="an_thisMonth">0</div></div><div class="card"><div class="stat-label">先月の見積金額合計</div><div class="stat-value nums" id="an_lastMonth">0</div></div><div class="card"><div class="stat-label">今年の見積金額合計</div><div class="stat-value nums" id="an_thisYear">0</div></div></div><div class="card"><div class="card-title">見積結果の集計（全期間）</div><div class="result-stat-grid"><div class="result-stat pending"><div class="n nums" id="an_pendingCount">0</div><div class="l">回答待ち</div></div><div class="result-stat won"><div class="n nums" id="an_wonCount">0</div><div class="l">受注</div></div><div class="result-stat lost"><div class="n nums" id="an_lostCount">0</div><div class="l">失注</div></div><div class="result-stat rate"><div class="n nums" id="an_winRate">—</div><div class="l">受注率</div></div></div><div class="amount-breakdown"><div class="box"><div class="v nums" id="an_totalAmount">0円</div></div><div class="box"><div class="v nums" id="an_wonAmount">0円</div></div><div class="box"><div class="v nums" id="an_lostAmount">0円</div></div></div></div><div class="card"><div id="rankingCountList"></div></div><div class="card"><div id="rankingAmountList"></div></div><div class="card"><div id="companyStatusList"></div></div><div class="card"><div id="materialStatsList"></div></div><div class="card"><select id="an_companySelect"><option value="">すべての会社（合計）</option></select><div id="companyDetail"></div><div id="monthlyCountTrend"></div><div id="monthlyTrend"></div></div></section>
<section class="screen" id="screen-settings" data-screen="settings"><div class="card"><div id="storageInfo"></div><div id="dataCount">0</div><button id="exportCsvBtn">CSV出力</button><input type="file" id="importCsvFile"><button id="clearAllBtn">全削除</button><button id="seedBtn">サンプル</button><button id="migrateLocalBtn">移行</button><div id="legacyLocalCount"></div></div></section></main>
<nav class="tabbar"><div class="tabbar-inner"><button class="tab-btn active" data-goto="register"><span>見積もりノート</span></button><button class="tab-btn" data-goto="search"><span>検索</span></button><button class="tab-btn" data-goto="analysis"><span>分析</span></button><button class="tab-btn" data-goto="settings"><span>設定</span></button></div></nav><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js?v=20260821-2325"></script><script src="app.js?v=20260821-2325"></script><script src="materials-inline.js?v=20260818-2358"></script><script src="quote-material-link.js?v=20260821-0255"></script><script src="estimate-notebook-v2.js?v=20260821-2325"></script><script src="estimate-followup-list.js?v=20260821-2325"></script><script src="estimate-loss-analysis.js?v=20260821-2325"></script><script src="estimate-quantity-analysis.js?v=20260821-2325"></script><script src="estimate-company-analysis.js?v=20260821-2325"></script><script>(()=>{const t=document.getElementById('screenTitle');if(!t)return;const k=()=>{if(t.textContent==='見積もり登録')t.textContent='見積もりノート'};k();new MutationObserver(k).observe(t,{childList:true,subtree:true})})();</script></body></html>
