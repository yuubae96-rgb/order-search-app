<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c2024"><title>TOP見積申請・保管庫</title><script>if(window.top===window.self){location.replace('estimate-notebook2.html?v=20260823-operator')}</script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#17212b;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dce3e8;border-radius:16px;padding:15px;margin:13px 0}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:25px;margin:7px 0}.sub,.meta{color:#667582;font-size:13px}.hidden{display:none!important}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;font-size:14px}.primary{background:#111;color:#fff}.green{background:#18794e;color:#fff}.red{background:#b42318;color:#fff}.gray{background:#e9eef2;color:#24323d}.outline{background:#fff;border:1px solid #cbd5dc}.danger{background:#fff;color:#b42318;border:2px solid #b42318}.actions,.tabs,.views{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tabs{overflow-x:auto;flex-wrap:nowrap;padding:3px 0 9px}.tab,.viewBtn{border:1px solid #d4dde4;background:#f6f8fa;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900;white-space:nowrap}.tab.active,.viewBtn.active{background:#17212b;color:#fff}.field{margin:9px 0}.field label{display:block;font-size:12px;font-weight:800;color:#5b6873;margin-bottom:4px}.field label.requiredDocsLabel{font-size:17px;color:#c6281c;font-weight:900;line-height:1.45;margin:14px 0 8px}input,textarea,select{width:100%;padding:10px;border:1px solid #cfd8df;border-radius:10px;font-size:16px;background:#fff}textarea{min-height:78px}#fields{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}#fields .full,.priceSection{grid-column:1/-1}.priceRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:6px 0}.plateFeeField{grid-column:1/-1}.plateFeeLine{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}.plateFeeChoices{display:flex;gap:12px;align-items:center;white-space:nowrap}.plateFeeChoices label{display:flex;align-items:center;gap:5px;margin:0;font-size:14px;color:#17212b}.plateFeeChoices input{width:22px;height:22px;padding:0;margin:0}.item{border-top:1px solid #e8edf0;padding:12px 0}.item:first-child{border-top:0}.name{font-size:16px;font-weight:900}.productLink{border:0;background:none;padding:0;color:#145ea8;font:inherit;font-weight:900;text-decoration:underline}.count{font-size:12px;background:#e9eef2;border-radius:999px;padding:4px 7px;font-weight:900}@media(max-width:620px){.wrap{padding:11px}#fields{gap:0 8px}.top{align-items:flex-start}.plateFeeLine{grid-template-columns:1fr auto}.plateFeeChoices{gap:8px}}
</style></head><body><div class="wrap">
<h1>TOP見積申請・保管庫</h1><div class="sub">申請 → 承認 → 客先提出 → 回答待ち → 受注／失注</div>
<div class="card"><h3>① 見積申請</h3><input id="file" type="file" accept="application/pdf,image/*"><div class="actions"><button class="btn primary" id="analyzeBtn">AIで読み取る</button><button class="btn gray hidden" id="cancelReadBtn" type="button">一旦取消</button></div><div id="progress" class="hidden" style="padding:18px;text-align:center;font-weight:900">AI読み取り中…</div><div id="error" class="hidden"></div></div>
<div id="reviewCard" class="card hidden"><div class="top"><h3 style="margin:0">② AI読取結果を確認して申請</h3><button class="btn gray" id="sourceTopBtn" type="button">原本を見る</button></div><div id="warnings"></div><div id="fields"></div><div class="actions"><button class="btn primary" id="confirmBtn">この内容で申請する</button><button class="btn gray" id="sourceBtn">原本を見る</button></div></div>
<div class="card"><div class="top"><div style="display:flex;align-items:center;gap:7px"><h3 style="margin:0">③ 見積保管庫</h3><span id="count" class="count">0件</span></div><button class="btn gray" id="refreshBtn">更新</button></div><div id="list"></div></div></div>
<script>
const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-ai';
let analyzed=null;const $=id=>document.getElementById(id);
function resetRead(){analyzed=null;$('file').value='';$('reviewCard').classList.add('hidden');$('cancelReadBtn').classList.add('hidden');$('error').textContent='';$('error').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
$('cancelReadBtn').onclick=()=>{if(!analyzed)return resetRead();if(confirm('今回のAI読み取り結果を取り消しますか？\nまだ申請されていないため、案件データは登録されません。'))resetRead()};
$('analyzeBtn').onclick=async()=>{let f=$('file').files[0];if(!f)return alert('原本を選んでください');try{$('progress').classList.remove('hidden');$('analyzeBtn').disabled=true;const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'analyze',file_name:f.name,mime_type:f.type||'application/octet-stream',base64:await new Promise((ok,ng)=>{let fr=new FileReader;fr.onload=()=>ok(String(fr.result).split(',')[1]);fr.onerror=ng;fr.readAsDataURL(f)})})});analyzed=await r.json();$('reviewCard').classList.remove('hidden');$('cancelReadBtn').classList.remove('hidden')}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden')}finally{$('progress').classList.add('hidden');$('analyzeBtn').disabled=false}};
</script></body></html>
