<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>TOP見積申請・保管庫</title></head><body>
<script>
(function(){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','estimate-notebook2-core-base.html?v=20260823-fixedsource2',false);
    x.send(null);
    if(x.status<200||x.status>=300) throw new Error('base load '+x.status);
    var t=x.responseText;
    t=t.replace("separate_drawing_kind:'別紙図面（単・継・不明）'","separate_drawing_kind:'種類（単・継・不明）'");
    var patch='<style>.ownerDeleteBtn{border:1px solid #d92d20;background:#fff;color:#b42318;border-radius:7px;padding:4px 7px;margin-left:6px;font-size:11px;font-weight:900;vertical-align:1px}</style>'+ 
      '<script>(function(){function owner(){try{var o=parent&&parent!==window&&typeof parent.getCurrentOperator==="function"?parent.getCurrentOperator():null;return !!o&&o.name==="承認(社長)";}catch(e){return false}}function addDeletes(){document.querySelectorAll(".compact").forEach(function(row){if(!owner()){row.querySelectorAll(".ownerDeleteBtn").forEach(function(z){z.remove()});return}if(row.querySelector(".ownerDeleteBtn"))return;var link=row.querySelector(".productLink");if(!link)return;var m=(link.getAttribute("onclick")||"").match(/openDetail\\((\\d+)\\)/);if(!m)return;var id=Number(m[1]);var company=(row.querySelector(".cName")?.textContent||"案件").split("/")[0].trim();var d=document.createElement("button");d.type="button";d.className="ownerDeleteBtn";d.textContent="削除";d.onclick=function(e){e.stopPropagation();if(typeof del==="function")del(id,company)};link.insertAdjacentElement("afterend",d)});}function patchTopButton(){var b=document.getElementById("sourceTopBtn");if(!b)return;b.textContent="TOPに戻る";b.onclick=function(){if(confirm("今回のAI読み取り結果を取り消してTOPに戻りますか？\\nまだ申請していないため、案件データは登録されません。")){if(typeof resetRead==="function")resetRead();}};}var oldRender=window.render;if(typeof oldRender==="function"){window.render=function(){var z=oldRender.apply(this,arguments);setTimeout(addDeletes,0);return z}}setInterval(addDeletes,700);setInterval(patchTopButton,700);addDeletes();patchTopButton();})();<\/script>';
    t=t.replace('</body>',patch+'</body>');
    document.open();
    document.write(t);
    document.close();

    function setupOuterSourceButton(){
      if(!parent || parent===window) return;
      var pd=parent.document;
      var b=pd.getElementById('globalFloatingSourceBtn');
      if(!b){
        b=pd.createElement('button');
        b.id='globalFloatingSourceBtn';
        b.type='button';
        b.textContent='原本を見る';
        b.style.cssText='position:fixed;right:12px;top:112px;z-index:999999;border:1px solid #c7d0d7;border-radius:11px;padding:11px 14px;font-weight:900;font-size:14px;background:#e9eef2;color:#24323d;box-shadow:0 3px 14px rgba(0,0,0,.18);display:none';
        pd.body.appendChild(b);
      }
      b.onclick=function(){
        try{
          if(typeof window.openAnalyzedSource==='function') window.openAnalyzedSource();
          else document.getElementById('sourceBtn')?.click();
        }catch(e){console.warn(e)}
      };
      function sync(){
        var r=document.getElementById('reviewCard');
        b.style.display=(r && !r.classList.contains('hidden'))?'block':'none';
      }
      var r=document.getElementById('reviewCard');
      if(r) new MutationObserver(sync).observe(r,{attributes:true,attributeFilter:['class']});
      setInterval(sync,500);
      sync();
      var topTab=[...pd.querySelectorAll('.nav[data-pane="app"]')][0];
      if(topTab && !topTab.dataset.aiResetBound){
        topTab.dataset.aiResetBound='1';
        topTab.addEventListener('click',function(){
          try{
            var review=document.getElementById('reviewCard');
            if(review && !review.classList.contains('hidden') && typeof window.resetRead==='function') window.resetRead();
            else window.scrollTo({top:0,behavior:'smooth'});
            b.style.display='none';
          }catch(e){console.warn(e)}
        });
      }
      window.addEventListener('beforeunload',function(){try{b.style.display='none'}catch(e){}});
    }
    setTimeout(setupOuterSourceButton,0);
  }catch(e){
    document.body.innerHTML='<div style="font-family:sans-serif;padding:20px;color:#b42318">画面の読み込みに失敗しました。再読み込みしてください。</div>';
    console.error(e);
  }
})();
</script>
</body></html>
