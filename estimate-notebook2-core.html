<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>TOP見積申請・保管庫</title></head><body>
<script>
(function(){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','estimate-notebook2-core-base.html?v=20260823-fixedsource',false);
    x.send(null);
    if(x.status<200||x.status>=300) throw new Error('base load '+x.status);
    var t=x.responseText;
    t=t.replace("separate_drawing_kind:'別紙図面（単・継・不明）'","separate_drawing_kind:'種類（単・継・不明）'");
    var patch='<style>#floatingSourceBtn{position:fixed;top:12px;right:12px;z-index:99999;border:0;border-radius:11px;padding:11px 14px;font-weight:900;font-size:14px;background:#e9eef2;color:#24323d;box-shadow:0 3px 14px rgba(0,0,0,.18)}#floatingSourceBtn.hidden{display:none!important}</style>'+
      '<button id="floatingSourceBtn" class="hidden" type="button">原本を見る</button>'+
      '<script>(function(){var b=document.getElementById("floatingSourceBtn");var r=document.getElementById("reviewCard");function sync(){if(!b)return;b.classList.toggle("hidden",!r||r.classList.contains("hidden"));}if(b)b.onclick=function(){if(typeof openAnalyzedSource==="function")openAnalyzedSource();else{var x=document.getElementById("sourceTopBtn");if(x)x.click();}};if(r)new MutationObserver(sync).observe(r,{attributes:true,attributeFilter:["class"]});sync();})();<\/script>';
    t=t.replace('</body>',patch+'</body>');
    document.open();
    document.write(t);
    document.close();
  }catch(e){
    document.body.innerHTML='<div style="font-family:sans-serif;padding:20px;color:#b42318">画面の読み込みに失敗しました。再読み込みしてください。</div>';
    console.error(e);
  }
})();
</script>
</body></html>
