<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>TOP見積申請・保管庫</title></head><body>
<script>
(function(){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','estimate-notebook2-core-base.html?v=20260823-fixedsource',false);
    x.send(null);
    if(x.status<200||x.status>=300) throw new Error('base load '+x.status);
    var t=x.responseText;
    t=t.replace("separate_drawing_kind:'別紙図面（単・継・不明）'","separate_drawing_kind:'種類（単・継・不明）'");
    var patch='<style>#floatingSourceBtn{position:fixed;top:12px;right:12px;z-index:99999;border:0;border-radius:11px;padding:11px 14px;font-weight:900;font-size:14px;background:#e9eef2;color:#24323d;box-shadow:0 3px 14px rgba(0,0,0,.18)}#floatingSourceBtn.hidden{display:none!important}.ownerDeleteBtn{border:1px solid #d92d20;background:#fff;color:#b42318;border-radius:7px;padding:4px 7px;margin-left:6px;font-size:11px;font-weight:900;vertical-align:1px}</style>'+
      '<button id="floatingSourceBtn" class="hidden" type="button">原本を見る</button>'+
      '<script>(function(){var b=document.getElementById("floatingSourceBtn");var r=document.getElementById("reviewCard");function sync(){if(!b)return;b.classList.toggle("hidden",!r||r.classList.contains("hidden"));}if(b)b.onclick=function(){if(typeof openAnalyzedSource==="function")openAnalyzedSource();else{var x=document.getElementById("sourceTopBtn");if(x)x.click();}};if(r)new MutationObserver(sync).observe(r,{attributes:true,attributeFilter:["class"]});sync();function owner(){try{var o=parent&&parent!==window&&typeof parent.getCurrentOperator==="function"?parent.getCurrentOperator():null;return !!o&&o.name==="承認(社長)";}catch(e){return false}}function addDeletes(){document.querySelectorAll(".compact").forEach(function(row){if(!owner()){row.querySelectorAll(".ownerDeleteBtn").forEach(function(z){z.remove()});return}if(row.querySelector(".ownerDeleteBtn"))return;var link=row.querySelector(".productLink");if(!link)return;var m=(link.getAttribute("onclick")||"").match(/openDetail\\((\\d+)\\)/);if(!m)return;var id=Number(m[1]);var company=(row.querySelector(".cName")?.textContent||"案件").split("/")[0].trim();var d=document.createElement("button");d.type="button";d.className="ownerDeleteBtn";d.textContent="削除";d.onclick=function(e){e.stopPropagation();if(typeof del==="function")del(id,company)};link.insertAdjacentElement("afterend",d)});}var oldRender=window.render;if(typeof oldRender==="function"){window.render=function(){var z=oldRender.apply(this,arguments);setTimeout(addDeletes,0);return z}}setInterval(addDeletes,700);addDeletes();})();<\/script>';
    t=t.replace('</body>',patch+'</body>');
    document.open();
    document.write(t);
    document.close();
  }catch(e){
    document.body.innerHTML='<div style="font-family:sans-serif;padding:20px;color:#b42318">画面の読み込みに失敗しました。再読み込みしてください。</div>';
    console.error(e);
  }
})();
</script>
</body></html>
