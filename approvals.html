<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>購入申請承認</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;margin:0;color:#111827}.w{max-width:700px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px 40px}.c{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;margin-bottom:12px}.item{padding:13px 0;border-bottom:1px solid #e2e8f0}.item:last-child{border-bottom:0}.m{font-size:13px;color:#64748b;line-height:1.6}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}button{border:0;border-radius:10px;padding:11px;font-weight:800}.ok{background:#111827;color:#fff}.ng{background:#fee2e2;color:#991b1b}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./standalone-auth.js"></script></head><body><div class="w"><div class="c"><div style="font-size:12px;font-weight:800;color:#64748b">OWNER / MANAGER</div><h1 style="margin:4px 0 8px">購入申請</h1><div class="m">事務から上がった購入申請を承認・却下します。</div><div id="list"></div></div></div><script>
const db=supabase.createClient('https://vnnvuxccazkdzwqjmntz.supabase.co','sb_publishable_xG-tuBgxFGntT1vlbZzuVQ_AZ2Zl8QL');async function load(){const {data,error}=await db.from('purchase_requests').select('*').order('created_at',{ascending:false});if(error){list.innerHTML='<div class="m">表示できません：'+error.message+'</div>';return}const rows=data||[];list.innerHTML=rows.length?rows.map(x=>`<div class="item"><b>${x.item_name}</b>　${x.quantity||1}${x.unit||''}<div class="m">${x.department||''} ／ ${x.reason||''} ／ 状態：${x.status}</div>${x.status==='申請'?`<div class="actions"><button class="ok" onclick="setStatus(${x.id},'承認')">承認</button><button class="ng" onclick="setStatus(${x.id},'却下')">却下</button></div>`:''}</div>`).join(''):'<div class="m">申請はありません。</div>'}async function setStatus(id,status){const {data:{user}}=await db.auth.getUser();const {error}=await db.from('purchase_requests').update({status,approved_by:user?.email||null,approved_at:new Date().toISOString()}).eq('id',id);alert(error?'エラー：'+error.message:status+'しました');if(!error)load()}load();
</script></body></html>
