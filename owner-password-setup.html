<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>社長パスワード設定</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;margin:0;color:#111827}.w{max-width:620px;margin:auto;padding:calc(26px + env(safe-area-inset-top)) 16px 40px}.c{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px}.badge{display:inline-block;background:#111827;color:#fff;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}h1{margin:10px 0 6px;font-size:26px}.m{font-size:13px;color:#64748b;line-height:1.7}label{display:block;font-size:13px;font-weight:800;margin-top:14px}input{width:100%;box-sizing:border-box;padding:13px;margin-top:6px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.btn{width:100%;border:0;border-radius:12px;padding:15px;margin-top:16px;background:#111827;color:#fff;font-weight:800;font-size:16px}.ok{color:#166534;margin-top:12px;font-size:14px}.err{color:#b91c1c;margin-top:12px;font-size:14px}</style></head><body><div class="w"><div class="c"><span class="badge">OWNER ONLY</span><h1>社長パスワード設定</h1><div class="m">このページは一度だけ使えます。新しい社長専用パスワードを設定してください。設定後、このリンクは無効になります。</div><label>新しいパスワード</label><input id="p1" type="password" autocomplete="new-password" placeholder="8文字以上"><label>新しいパスワード（確認）</label><input id="p2" type="password" autocomplete="new-password" placeholder="もう一度入力"><button class="btn" id="save">このパスワードに設定する</button><div id="msg"></div></div></div><script>
const token=new URLSearchParams(location.search).get('token')||'';
const msg=document.getElementById('msg');
save.onclick=async()=>{const a=p1.value,b=p2.value;if(a.length<8){msg.innerHTML='<div class="err">8文字以上にしてください。</div>';return;}if(a!==b){msg.innerHTML='<div class="err">2つのパスワードが一致していません。</div>';return;}save.disabled=true;msg.textContent='設定しています...';try{const r=await fetch('https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/owner-password-setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:a})});const j=await r.json();if(!r.ok)throw new Error(j.error||'設定に失敗しました');msg.innerHTML='<div class="ok">設定しました。これで勤怠・給与アプリにログインできます。</div>';p1.value='';p2.value='';save.style.display='none';setTimeout(()=>location.href='./hr.html',1600);}catch(e){msg.innerHTML='<div class="err">'+e.message+'</div>';save.disabled=false;}};
</script></body></html>
