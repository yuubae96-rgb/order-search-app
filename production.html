<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>製造実績</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;margin:0;color:#111827}.w{max-width:640px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 16px 40px}.c{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px}h1{margin:0 0 6px}.m{font-size:13px;color:#64748b;line-height:1.7}label{display:block;font-size:13px;font-weight:800;margin-top:12px}input,select{width:100%;box-sizing:border-box;padding:13px;margin-top:5px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px}.proc,.mins{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.mins{grid-template-columns:repeat(4,1fr)}button{border:0;border-radius:12px;padding:14px 6px;font-weight:800;font-size:15px}.pick{background:#f1f5f9;color:#111827}.pick.on{background:#111827;color:#fff}.save{width:100%;background:#2563eb;color:#fff;margin-top:16px;font-size:18px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./standalone-auth.js"></script></head><body><div class="w"><div class="c"><div style="font-size:12px;font-weight:800;color:#64748b">FACTORY</div><h1>製造実績</h1><div class="m">作業が終わったら「誰が・どの仕事を・何分したか」だけ登録します。原価計算へ自動で使います。</div><label>作業者</label><select id="emp"><option value="">選択してください</option></select><label>案件・指示番号</label><input id="job" placeholder="例：見積番号・製造指示番号"><label>工程</label><div class="proc" id="proc"></div><input id="process" type="hidden"><label>作業時間</label><div class="mins" id="mins"></div><input id="minutes" type="number" placeholder="その他の分数"><label>数量</label><input id="qty" type="number" placeholder="例：500"><button class="save" id="save">登録する</button></div></div><script>
const db=supabase.createClient('https://vnnvuxccazkdzwqjmntz.supabase.co','sb_publishable_xG-tuBgxFGntT1vlbZzuVQ_AZ2Zl8QL');
const procs=['印刷','エッチング','プレス・加工','検品','梱包','その他'];document.getElementById('proc').innerHTML=procs.map(x=>`<button type="button" class="pick" data-p="${x}">${x}</button>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{process.value=b.dataset.p;document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x===b))});document.getElementById('mins').innerHTML=[5,10,15,30].map(x=>`<button type="button" class="pick" data-m="${x}">${x}分</button>`).join('');document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{minutes.value=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b))});
(async()=>{const {data}=await db.from('employees').select('id,name,department').eq('active',true).order('name');(data||[]).filter(x=>!x.department||x.department==='製造'||x.department==='工場').forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;emp.appendChild(o)})})();
save.onclick=async()=>{if(!emp.value||!process.value||!minutes.value){alert('作業者・工程・時間を選んでください');return}const {error}=await db.from('work_logs').insert({employee_id:Number(emp.value),work_date:new Date().toISOString().slice(0,10),job_ref:job.value||null,process_name:process.value,minutes:Number(minutes.value),quantity:qty.value?Number(qty.value):null});if(error){alert('登録エラー：'+error.message);return}alert('製造実績を登録しました');job.value='';qty.value='';minutes.value='';document.querySelectorAll('.pick').forEach(x=>x.classList.remove('on'))};
</script></body></html>
