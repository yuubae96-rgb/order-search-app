<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2024">
<title>見積もりノート2</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#17212b;background:#f4f6f8}
*{box-sizing:border-box}
body{margin:0}
.wrap{max-width:820px;margin:auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:25px;margin:8px 0}
.sub{color:#647281;font-size:14px}
.card{background:#fff;border:1px solid #dce3e8;border-radius:16px;padding:16px;margin:14px 0}
.hidden{display:none!important}
.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;font-size:15px}
.primary{background:#111;color:#fff}.green{background:#18794e;color:#fff}.red{background:#b42318;color:#fff}.gray{background:#e9eef2;color:#24323d}.dangerOutline{background:#fff;color:#b42318;border:2px solid #b42318}
#fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:12px;align-items:start}
#fields .field[data-field="company_name"],#fields .field[data-field="product_name"],#fields .field[data-field="notes"]{grid-column:1/-1}
.priceSection{grid-column:1/-1;margin:8px 0 2px}
.field{margin:10px 0;position:relative;min-width:0}
.field label{display:block;font-size:12px;font-weight:800;color:#5b6873;margin-bottom:5px}
input,textarea,select{width:100%;padding:11px;border:1px solid #cfd8df;border-radius:10px;font-size:16px;background:#fff;min-width:0}
textarea{min-height:82px}
.field.needs-check label{color:#b42318}.field.needs-check input,.field.needs-check textarea{border:2px solid #d92d20;background:#fff5f4}
.review-actions{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}.mini{padding:7px 10px;border-radius:9px;border:0;font-weight:800;font-size:12px}.okbtn{background:#18794e;color:#fff}.fixbtn{background:#b42318;color:#fff}
.verified label{color:#18794e}.verified input,.verified textarea{border:2px solid #18794e;background:#f1fff7}.verified-note{font-size:12px;color:#18794e;font-weight:900;margin-top:5px}
.status{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;display:inline-block;white-space:nowrap}.wait{background:#fff4cc;color:#6d5400}.won{background:#d9f5e7;color:#11623e}.lost{background:#fde2e0;color:#9d2018}
.item{border-top:1px solid #edf1f4;padding:13px 0}.item:first-child{border-top:0}.name{font-weight:900;font-size:17px}.meta{font-size:13px;color:#667582;line-height:1.6}
.productLink{border:0;background:none;padding:0;color:#145ea8;font:inherit;font-weight:900;text-align:left;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.priceRow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin:7px 0;align-items:center}.priceRow.mainPrice{grid-template-columns:1fr 1fr 1fr}
.warn{background:#fff0ef;border:2px solid #f04438;color:#7a271a;border-radius:12px;padding:12px;font-size:13px;margin-top:10px}.loading{font-weight:900;text-align:center;padding:20px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.archiveTabs{display:flex;gap:7px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}.archiveTab{border:1px solid #d4dde4;background:#f6f8fa;color:#33424d;border-radius:999px;padding:9px 13px;font-size:13px;font-weight:900;white-space:nowrap}.archiveTab.active{background:#17212b;color:#fff;border-color:#17212b}
.resultMeta{margin-top:8px;padding:10px 11px;border-radius:10px;background:#f6f8fa;font-size:13px;line-height:1.6}.lostBox{background:#fff3f2;border:1px solid #f7c8c4}.wonBox{background:#effbf5;border:1px solid #bde8d2}.archiveTitle{display:flex;align-items:center;gap:8px}.count{font-size:12px;background:#e9eef2;color:#44525d;border-radius:999px;padding:4px 8px;font-weight:800}
.modal{position:fixed;inset:0;background:#0009;z-index:9999;overflow:auto;padding:12px}.modalBox{max-width:760px;margin:10px auto;background:#fff;border-radius:18px;padding:16px}.modalHead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-12px;background:#fff;padding:4px 0 10px;z-index:2}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.detailGrid .full{grid-column:1/-1}.removePrice{border:0;background:#fde2e0;color:#9d2018;border-radius:8px;padding:8px;font-weight:800}.sectionTitle{grid-column:1/-1;margin:16px 0 4px;border-top:1px solid #e6ebef;padding-top:14px}
@media(max-width:620px){.wrap{padding:12px}#fields{column-gap:10px}#fields .field label{font-size:11px}#fields input{padding:10px;font-size:15px}.priceRow{grid-template-columns:1fr 1fr 1fr;gap:6px}.priceRow .removePrice{grid-column:1/-1}.priceRow.mainPrice{grid-template-columns:1fr 1fr 1fr}.priceRow input{font-size:14px;padding:9px 7px}.top{align-items:flex-start}.name{font-size:16px}.detailGrid{grid-template-columns:1fr 1fr;gap:0 8px}.modal{padding:7px}.modalBox{margin:4px auto;padding:13px}}
</style>
</head>
<body>
<div class="wrap">
<h1>見積もりノート2</h1>
<div class="sub">原本 → AI整理 → 回答待ち → 受注／失注</div>
<div class="card">
<h3>① 原本を追加</h3>
<input id="file" type="file" accept="application/pdf,image/*">
<div class="actions"><button class="btn primary" id="analyzeBtn">AIで読み取る</button></div>
<div id="progress" class="hidden loading">AI読み取り中…</div>
<div id="error" class="warn hidden"></div>
</div>
<div id="reviewCard" class="card hidden">
<h3>② AI読取結果を確認</h3><div id="warnings"></div><div id="fields"></div>
<div class="actions"><button class="btn green" id="confirmBtn">確認して登録</button><button class="btn gray" id="sourceBtn">原本を見る</button></div>
</div>
<div class="card">
<div class="top"><div class="archiveTitle"><h3 style="margin:0">③ 見積保管庫</h3><span id="count" class="count">0件</span></div><button class="btn gray" id="refreshBtn">更新</button></div>
<div class="archiveTabs"><button class="archiveTab active" data-status="all">すべて</button><button class="archiveTab" data-status="回答待ち">回答待ち</button><button class="archiveTab" data-status="受注">受注一覧</button><button class="archiveTab" data-status="失注">失注一覧</button></div>
<input id="search" placeholder="会社名・製品名・担当者で検索"><div id="list"></div>
</div>
</div>
<div id="detailModal" class="modal hidden"><div class="modalBox"><div class="modalHead"><h2 style="margin:0">見積詳細・編集</h2><button class="btn gray" onclick="closeDetail()">閉じる</button></div><div id="detailBody"></div><div class="actions"><button class="btn green" id="saveDetailBtn">変更を保存</button><button class="btn gray" onclick="closeDetail()">キャンセル</button></div></div></div>
<script>
const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-ai';
const EDIT_FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-edit';
let analyzed=null,reviewState={},archiveStatus='all',archiveItems=[],editingId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const LABEL={company_name:'会社名',product_name:'図番・製品名',customer_department:'客先部署',customer_name:'客先名',material:'材質',thickness:'板厚',width:'横サイズ',height:'縦サイズ',color_text:'色',manufacturing_method:'製作方法',delivery_text:'納期',person_in_charge:'担当者',plate_fee:'原版代',notes:'備考'};
const KEYS=Object.keys(LABEL);
async function api(b){const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw Error(j.error||'処理失敗');return j}
async function editApi(b){const r=await fetch(EDIT_FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw Error(j.error||'編集処理に失敗しました');return j}
function file64(f){return new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ng;r.readAsDataURL(f)})}
$('analyzeBtn').onclick=async()=>{const f=$('file').files[0];if(!f)return alert('原本を選んでください');try{$('error').classList.add('hidden');$('progress').classList.remove('hidden');$('analyzeBtn').disabled=true;analyzed=await api({action:'analyze',file_name:f.name,mime_type:f.type||'application/octet-stream',base64:await file64(f)});fill(analyzed.parsed);$('reviewCard').classList.remove('hidden')}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden')}finally{$('progress').classList.add('hidden');$('analyzeBtn').disabled=false}};
function fieldHtml(k,p,uncertain){const bad=uncertain.includes(k),type=['width','height','plate_fee'].includes(k)?'number':'text',val=esc(p[k]??'');return '<div class="field '+(bad?'needs-check':'')+'" data-field="'+k+'"><label>'+LABEL[k]+'</label>'+(k==='notes'?'<textarea id="'+k+'">'+val+'</textarea>':'<input id="'+k+'" type="'+type+'" value="'+val+'">')+(bad?'<div class="review-actions"><button class="mini okbtn" onclick="resolveField(\''+k+'\',false)">✓ 合っている</button><button class="mini fixbtn" onclick="resolveField(\''+k+'\',true)">✎ 修正した</button></div>':'')+'</div>'}
function fill(p){reviewState={};const uncertain=[...new Set((p.uncertain_fields||[]).filter(k=>KEYS.includes(k)))];$('warnings').innerHTML=uncertain.length?'<div class="warn"><b>🔴 要チェック</b><br>赤い項目だけ確認してください。</div>':'';let html='';KEYS.forEach(k=>{if(k==='plate_fee')html+='<div class="priceSection"><h4>数量別単価</h4><div id="prices"></div><button class="btn gray" id="addPrice">＋ 数量行を追加</button></div>';html+=fieldHtml(k,p,uncertain)});$('fields').innerHTML=html;$('prices').innerHTML='';(p.prices||[]).forEach(addPriceRow);if(!(p.prices||[]).length)addPriceRow({});$('addPrice').onclick=()=>addPriceRow({})}
window.resolveField=(k,fixed)=>{const el=document.querySelector('[data-field="'+k+'"]');if(fixed){const inp=$(k);inp.focus();const done=()=>{reviewState[k]='corrected';finish(el,'✎ 修正済み');inp.removeEventListener('change',done)};inp.addEventListener('change',done);alert('内容を正しい値に直してください。入力後、この欄から離れると「修正済み」になります。')}else{reviewState[k]='confirmed';finish(el,'✓ 原本確認済み')}};
function finish(el,text){el.classList.remove('needs-check');el.classList.add('verified');el.querySelector('.review-actions')?.remove();const n=document.createElement('div');n.className='verified-note';n.textContent=text;el.appendChild(n)}
function addPriceRow(p={}){const d=document.createElement('div');d.className='priceRow mainPrice';d.innerHTML='<input class="qty" type="number" placeholder="数量" value="'+esc(p.quantity??'')+'"><input class="unit" type="number" placeholder="単価" value="'+esc(p.unit_price??'')+'"><input class="amt" type="number" placeholder="金額" value="'+esc(p.amount??'')+'">';$('prices').appendChild(d)}
function current(){const p={};KEYS.forEach(k=>p[k]=$(k).value);['width','height','plate_fee'].forEach(k=>p[k]=p[k]===''?null:Number(p[k]));p.prices=[...document.querySelectorAll('#prices .priceRow')].map(r=>({quantity:r.querySelector('.qty').value||null,unit_price:r.querySelector('.unit').value||null,amount:r.querySelector('.amt').value||null}));p.uncertain_fields=[...document.querySelectorAll('.field.needs-check')].map(el=>el.dataset.field);return p}
$('confirmBtn').onclick=async()=>{const unresolved=[...document.querySelectorAll('.field.needs-check')];if(unresolved.length){unresolved[0].scrollIntoView({behavior:'smooth',block:'center'});return alert('赤い「要チェック」がまだ残っています。')}try{$('confirmBtn').disabled=true;$('confirmBtn').textContent='登録中…';await api({action:'confirm',parsed:current(),source_file_path:analyzed.source_file_path,source_file_name:analyzed.source_file_name,ai_raw:analyzed.ai_raw});alert('回答待ちとして登録しました');$('reviewCard').classList.add('hidden');$('file').value='';analyzed=null;loadList()}catch(e){alert(e.message)}finally{$('confirmBtn').disabled=false;$('confirmBtn').textContent='確認して登録'}};
$('sourceBtn').onclick=async()=>{const j=await api({action:'source_url',path:analyzed.source_file_path});window.open(j.url,'_blank')};
function badge(x){const s=x.status||'回答待ち',c=s==='受注'?'won':s==='失注'?'lost':'wait';return '<span class="status '+c+'">'+esc(s)+'</span>'}
function resultBlock(x){if(x.status==='失注'){let body='<b>失注理由：</b>'+esc(x.lost_reason||'未記入');if(x.result_note)body+='<br><b>理由・結果メモ：</b>'+esc(x.result_note);if(x.result_date)body+='<br><b>結果日：</b>'+esc(x.result_date);return '<div class="resultMeta lostBox">'+body+'</div>'}if(x.status==='受注'){let body='<b>受注数量：</b>'+esc(x.won_quantity??'')+'　<b>受注単価：</b>@'+esc(x.won_unit_price??'');if(x.result_note)body+='<br><b>結果メモ：</b>'+esc(x.result_note);if(x.result_date)body+='<br><b>結果日：</b>'+esc(x.result_date);return '<div class="resultMeta wonBox">'+body+'</div>'}return ''}
function renderList(){const items=archiveStatus==='all'?archiveItems:archiveItems.filter(x=>(x.status||'回答待ち')===archiveStatus);$('count').textContent=items.length+'件';$('list').innerHTML=items.map(x=>'<div class="item"><div class="top"><div class="name">'+esc(x.company_name)+' / <button class="productLink" onclick="openDetail('+Number(x.id)+')">'+esc(x.product_name||'製品名なし')+'</button></div>'+badge(x)+'</div><div class="meta">'+esc(x.material)+' '+esc(x.thickness)+'　'+(x.width??'')+'×'+(x.height??'')+'　担当：'+esc(x.person_in_charge||'')+'</div>'+resultBlock(x)+'<div class="actions"><button class="btn gray" onclick="openSourceById('+Number(x.id)+')">原本</button><button class="btn green" onclick="setResult('+Number(x.id)+',\'受注\')">受注</button><button class="btn red" onclick="setResult('+Number(x.id)+',\'失注\')">失注</button><button class="btn dangerOutline" onclick="deleteCase('+Number(x.id)+')">削除</button></div></div>').join('')||'<div class="sub" style="padding:18px 0">該当する見積はありません</div>'}
async function loadList(){try{const j=await api({action:'list',q:$('search').value});archiveItems=j.items||[];renderList()}catch(e){$('list').innerHTML=esc(e.message);$('count').textContent='-'}}
window.openSourceById=async id=>{const x=archiveItems.find(v=>Number(v.id)===Number(id));if(!x?.source_file_path)return alert('原本がありません');const j=await api({action:'source_url',path:x.source_file_path});window.open(j.url,'_blank')};
window.setResult=async(id,status)=>{const b={action:'update_result',id,status};if(status==='受注'){const q=prompt('受注数量');if(q===null)return;const u=prompt('受注単価');if(u===null)return;b.won_quantity=q;b.won_unit_price=u}else{const r=prompt('失注理由');if(r===null)return;b.lost_reason=r}b.result_note=prompt('結果メモ（理由の詳細など）','')||'';await api(b);loadList()};
window.deleteCase=async id=>{const x=archiveItems.find(v=>Number(v.id)===Number(id));const label=(x?.company_name||'')+' / '+(x?.product_name||'');if(!confirm('この案件を削除しますか？\n\n'+label+'\n\n数量別単価と添付原本も削除されます。'))return;try{await api({action:'delete',id});await loadList()}catch(e){alert('削除に失敗しました\n'+e.message)}};
document.querySelectorAll('.archiveTab').forEach(btn=>btn.onclick=()=>{archiveStatus=btn.dataset.status;document.querySelectorAll('.archiveTab').forEach(b=>b.classList.toggle('active',b===btn));renderList()});
$('refreshBtn').onclick=loadList;$('search').oninput=loadList;
function dField(id,label,val,type='text',full=false){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label>'+(type==='textarea'?'<textarea id="d_'+id+'">'+esc(val??'')+'</textarea>':type==='select'?val:'<input id="d_'+id+'" type="'+type+'" value="'+esc(val??'')+'"></div>'}
window.openDetail=async id=>{try{const j=await editApi({action:'get',id});const x=j.item;editingId=id;const prices=(x.estimate_notebook2_prices||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));const statusSelect='<select id="d_status"><option '+((x.status||'回答待ち')==='回答待ち'?'selected':'')+'>回答待ち</option><option '+(x.status==='受注'?'selected':'')+'>受注</option><option '+(x.status==='失注'?'selected':'')+'>失注</option></select>';$('detailBody').innerHTML='<div class="detailGrid">'+dField('company_name','会社名',x.company_name,'text',true)+dField('product_name','図番・製品名',x.product_name,'text',true)+dField('customer_department','客先部署',x.customer_department)+dField('customer_name','客先名',x.customer_name)+dField('material','材質',x.material)+dField('thickness','板厚',x.thickness)+dField('width','横サイズ',x.width,'number')+dField('height','縦サイズ',x.height,'number')+dField('color_text','色',x.color_text)+dField('manufacturing_method','製作方法',x.manufacturing_method)+dField('delivery_text','納期',x.delivery_text)+dField('person_in_charge','担当者',x.person_in_charge)+'<h3 class="sectionTitle">数量別単価</h3><div class="full"><div id="detailPrices"></div><button class="btn gray" onclick="addDetailPrice()">＋ 数量行を追加</button></div>'+dField('plate_fee','原版代',x.plate_fee,'number')+dField('notes','備考',x.notes,'textarea',true)+'<h3 class="sectionTitle">受注・失注結果</h3><div class="field"><label>結果</label>'+statusSelect+'</div>'+dField('result_date','結果日',x.result_date||'','date')+dField('won_quantity','受注数量',x.won_quantity,'number')+dField('won_unit_price','受注単価',x.won_unit_price,'number')+dField('lost_reason','失注理由',x.lost_reason,'text',true)+dField('result_note','理由・結果メモ',x.result_note,'textarea',true)+'</div>';$('detailPrices').innerHTML='';prices.forEach(p=>addDetailPrice(p));if(!prices.length)addDetailPrice({});$('detailModal').classList.remove('hidden');document.body.style.overflow='hidden'}catch(e){alert(e.message)}};
window.addDetailPrice=(p={})=>{const d=document.createElement('div');d.className='priceRow';d.innerHTML='<input class="dqty" type="number" placeholder="数量" value="'+esc(p.quantity??'')+'"><input class="dunit" type="number" placeholder="単価" value="'+esc(p.unit_price??'')+'"><input class="damt" type="number" placeholder="金額" value="'+esc(p.amount??'')+'"><button class="removePrice" onclick="this.parentElement.remove()">行削除</button>';$('detailPrices').appendChild(d)};
window.closeDetail=()=>{$('detailModal').classList.add('hidden');editingId=null;document.body.style.overflow=''};
$('saveDetailBtn').onclick=async()=>{if(!editingId)return;const get=id=>$('d_'+id)?.value??'';const item={company_name:get('company_name'),product_name:get('product_name'),customer_department:get('customer_department'),customer_name:get('customer_name'),material:get('material'),thickness:get('thickness'),width:get('width'),height:get('height'),color_text:get('color_text'),manufacturing_method:get('manufacturing_method'),delivery_text:get('delivery_text'),person_in_charge:get('person_in_charge'),plate_fee:get('plate_fee'),notes:get('notes'),status:$('d_status').value,result_date:get('result_date'),won_quantity:get('won_quantity'),won_unit_price:get('won_unit_price'),lost_reason:get('lost_reason'),result_note:get('result_note'),prices:[...document.querySelectorAll('#detailPrices .priceRow')].map(r=>({quantity:r.querySelector('.dqty').value||null,unit_price:r.querySelector('.dunit').value||null,amount:r.querySelector('.damt').value||null}))};try{$('saveDetailBtn').disabled=true;$('saveDetailBtn').textContent='保存中…';await editApi({action:'update',id:editingId,item});closeDetail();await loadList();alert('変更を保存しました')}catch(e){alert(e.message)}finally{$('saveDetailBtn').disabled=false;$('saveDetailBtn').textContent='変更を保存'}};
loadList();
</script>
</body>
</html>
