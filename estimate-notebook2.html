<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c2024"><title>見積もりノート2</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#17212b;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dce3e8;border-radius:16px;padding:15px;margin:13px 0}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:25px;margin:7px 0}.sub,.meta{color:#667582;font-size:13px}.hidden{display:none!important}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;font-size:14px}.primary{background:#111;color:#fff}.green{background:#18794e;color:#fff}.red{background:#b42318;color:#fff}.blue{background:#145ea8;color:#fff}.gray{background:#e9eef2;color:#24323d}.outline{background:#fff;border:1px solid #cbd5dc}.danger{background:#fff;color:#b42318;border:2px solid #b42318}.actions,.tabs,.views{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tabs{overflow-x:auto;flex-wrap:nowrap;padding:3px 0 9px}.tab,.viewBtn{border:1px solid #d4dde4;background:#f6f8fa;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900;white-space:nowrap}.tab.active,.viewBtn.active{background:#17212b;color:#fff}.field{margin:9px 0}.field label{display:block;font-size:12px;font-weight:800;color:#5b6873;margin-bottom:4px}input,textarea,select{width:100%;padding:10px;border:1px solid #cfd8df;border-radius:10px;font-size:16px;background:#fff}textarea{min-height:78px}#fields{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}#fields .full,.priceSection{grid-column:1/-1}.priceRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:6px 0}.item{border-top:1px solid #e8edf0;padding:12px 0}.item:first-child{border-top:0}.name{font-size:16px;font-weight:900}.productLink{border:0;background:none;padding:0;color:#145ea8;font:inherit;font-weight:900;text-decoration:underline}.badge{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}.bApply{background:#e9e2ff;color:#5433a8}.bReturn{background:#fde2e0;color:#9d2018}.bApproved{background:#e0efff;color:#125a9c}.bWait{background:#fff1c2;color:#725900}.bWon{background:#d9f5e7;color:#11623e}.bLost{background:#fde2e0;color:#9d2018}.resultBox{margin-top:7px;padding:9px;border-radius:10px;font-size:13px;line-height:1.55}.wonBox{background:#effbf5}.lostBox{background:#fff3f2}.sales{font-size:16px;font-weight:900;color:#11623e}.age{font-size:12px;font-weight:800;margin-top:4px;color:#5d6973}.days{padding:2px 6px;border-radius:999px;background:#eef2f5}.days.warn{background:#fff1c2;color:#725900}.days.over{background:#fde2e0;color:#9d2018}.compact{display:grid;grid-template-columns:72px minmax(0,1fr) 94px;gap:7px;align-items:center;border-top:1px solid #e8edf0;padding:8px 0}.compact:first-child{border-top:0}.cDate,.cSub{font-size:11px;color:#65727c}.cName{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cRight{text-align:right;font-size:11px;font-weight:900}.count{font-size:12px;background:#e9eef2;border-radius:999px;padding:4px 7px;font-weight:900}.warnBox{background:#fff0ef;border:2px solid #f04438;padding:10px;border-radius:10px;font-size:13px}.okBox{background:#effbf5;border:1px solid #bde8d2;padding:10px;border-radius:10px;font-size:13px}.approvalBox{grid-column:1/-1;background:#f7f9fb;border:1px solid #d8e0e6;border-radius:12px;padding:12px;margin-top:12px}.approvalBox h4{margin:0 0 10px}.fileNote{font-size:12px;color:#687681;line-height:1.5;margin-top:5px}.selectedFiles{font-size:12px;line-height:1.6;margin-top:7px}.due{font-size:11px;color:#8a4d00;font-weight:900;margin-top:3px}.miniQuoted{display:block;margin:5px 0 0 auto;border:0;border-radius:8px;padding:6px 8px;background:#145ea8;color:#fff;font-size:10px;font-weight:900}@media(max-width:620px){.wrap{padding:11px}#fields{gap:0 8px}.top{align-items:flex-start}}
</style></head><body><div class="wrap">
<h1>見積もりノート2</h1><div class="sub">申請 → 承認 → 客先提出 → 回答待ち → 受注／失注</div>
<div class="card"><h3>① 見積申請</h3><input id="file" type="file" accept="application/pdf,image/*"><div class="actions"><button class="btn primary" id="analyzeBtn">AIで読み取る</button></div><div id="progress" class="hidden" style="padding:18px;text-align:center;font-weight:900">AI読み取り中…</div><div id="error" class="warnBox hidden"></div></div>
<div id="reviewCard" class="card hidden"><h3>② AI読取結果を確認して申請</h3><div id="warnings"></div><div id="fields"></div><div class="approvalBox"><h4>承認に必要な資料</h4><div class="field"><label>承認希望期限</label><input id="approvalDueDate" type="date"></div><div class="field"><label>添付ファイル（複数可）</label><input id="supportFiles" type="file" multiple accept="application/pdf,image/*,.eml,.msg,.doc,.docx,.xls,.xlsx,.txt"><div class="fileNote">図面・客先からの要求メール・仕様書など、決裁者が判断するための資料を添付してください。1ファイル8MBまで。</div><div id="selectedFiles" class="selectedFiles"></div></div></div><div class="actions"><button class="btn blue" id="confirmBtn">この内容で申請する</button><button class="btn gray" id="sourceBtn">原本を見る</button></div></div>
<div class="card"><div class="top"><div style="display:flex;align-items:center;gap:7px"><h3 style="margin:0">③ 見積保管庫</h3><span id="count" class="count">0件</span></div><button class="btn gray" id="refreshBtn">更新</button></div>
<div class="tabs"><button class="tab active" data-filter="all">すべて</button><button class="tab" data-filter="申請中">申請中</button><button class="tab" data-filter="承認済み">承認済み</button><button class="tab" data-filter="回答待ち">回答待ち</button><button class="tab" data-filter="受注">受注</button><button class="tab" data-filter="失注">失注</button></div>
<div class="views"><button class="viewBtn active" data-view="compact">一覧</button><button class="viewBtn" data-view="detail">詳細</button></div><input id="search" placeholder="会社名・製品名・担当者で検索"><div id="list"></div></div></div>
<script>
const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-ai';
const AFN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-approval';
let analyzed=null,items=[],filter='all',view='compact';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const LABEL={company_name:'会社名',product_name:'図番・製品名',customer_department:'客先部署',customer_name:'客先名',material:'材質',thickness:'板厚',width:'横サイズ',height:'縦サイズ',color_text:'色',manufacturing_method:'製作方法',delivery_text:'納期',person_in_charge:'担当者',plate_fee:'原版代',notes:'備考'},KEYS=Object.keys(LABEL);
async function api(url,b){let r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),t=await r.text(),j;try{j=JSON.parse(t)}catch{throw Error('サーバーの返答を読み取れませんでした')}if(!r.ok)throw Error(j.error||'処理失敗');return j}
function file64(f){return new Promise((ok,ng)=>{let r=new FileReader;r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ng;r.readAsDataURL(f)})}
$('supportFiles').onchange=()=>{$('selectedFiles').innerHTML=[...$('supportFiles').files].map(f=>'・'+esc(f.name)+'（'+Math.ceil(f.size/1024)+'KB）').join('<br>')};
$('analyzeBtn').onclick=async()=>{let f=$('file').files[0];if(!f)return alert('原本を選んでください');try{$('error').classList.add('hidden');$('progress').classList.remove('hidden');$('analyzeBtn').disabled=true;analyzed=await api(FN,{action:'analyze',file_name:f.name,mime_type:f.type||'application/octet-stream',base64:await file64(f)});fill(analyzed.parsed);$('reviewCard').classList.remove('hidden')}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden')}finally{$('progress').classList.add('hidden');$('analyzeBtn').disabled=false}};
function field(k,p,bad){let d=document.createElement('div');d.className='field'+(['company_name','product_name','notes'].includes(k)?' full':'');d.dataset.field=k;let l=document.createElement('label');l.textContent=LABEL[k];d.appendChild(l);let el=k==='notes'?document.createElement('textarea'):document.createElement('input');if(el.tagName==='INPUT')el.type=['width','height','plate_fee'].includes(k)?'number':'text';el.id=k;el.value=p[k]??'';d.appendChild(el);if(bad){d.style.background='#fff5f4';d.style.padding='6px';d.style.borderRadius='9px';let b=document.createElement('button');b.className='btn gray';b.type='button';b.textContent='確認済みにする';b.onclick=()=>{d.dataset.checked='1';d.style.background='';b.remove()};d.appendChild(b)}return d}
function addPriceRow(p={}){let d=document.createElement('div');d.className='priceRow';d.innerHTML='<input class="qty" type="number" placeholder="数量" value="'+esc(p.quantity??'')+'"><input class="unit" type="number" placeholder="単価" value="'+esc(p.unit_price??'')+'"><input class="amt" type="number" placeholder="金額" value="'+esc(p.amount??'')+'">';$('prices').appendChild(d)}
function fill(p){let bad=[...new Set((p.uncertain_fields||[]).filter(k=>KEYS.includes(k)))];$('warnings').innerHTML=bad.length?'<div class="warnBox">赤い項目を原本で確認してください。</div>':'';$('fields').innerHTML='';KEYS.forEach(k=>{if(k==='plate_fee'){let s=document.createElement('div');s.className='priceSection';s.innerHTML='<h4>数量別単価</h4><div id="prices"></div><button class="btn gray" id="addPrice">＋ 数量行を追加</button>';$('fields').appendChild(s)}$('fields').appendChild(field(k,p,bad.includes(k)))});(p.prices||[]).forEach(addPriceRow);if(!(p.prices||[]).length)addPriceRow({});$('addPrice').onclick=()=>addPriceRow({})}
function current(){let p={};KEYS.forEach(k=>p[k]=$(k).value);['width','height','plate_fee'].forEach(k=>p[k]=p[k]===''?null:Number(p[k]));p.prices=[...document.querySelectorAll('.priceRow')].map(r=>({quantity:r.querySelector('.qty').value||null,unit_price:r.querySelector('.unit').value||null,amount:r.querySelector('.amt').value||null}));return p}
async function uploadSupports(id){let fs=[...$('supportFiles').files];if(!fs.length)throw Error('承認に必要な添付ファイルを1つ以上追加してください');for(let i=0;i<fs.length;i++){let f=fs[i];if(f.size>8*1024*1024)throw Error(f.name+' は8MBを超えています');$('confirmBtn').textContent='資料アップロード '+(i+1)+'/'+fs.length+'…';await api(AFN,{action:'upload_attachment',id,file_name:f.name,mime_type:f.type||'application/octet-stream',file_kind:'承認資料',base64:await file64(f)})}}
$('confirmBtn').onclick=async()=>{let unchecked=[...document.querySelectorAll('[data-field]')].filter(d=>d.style.background&&!d.dataset.checked);if(unchecked.length)return alert('赤い要チェック項目を確認してください');let due=$('approvalDueDate').value;if(!due)return alert('承認希望期限を入力してください');if(!$('supportFiles').files.length)return alert('図面・要求メールなど承認に必要な資料を1つ以上添付してください');try{$('confirmBtn').disabled=true;$('confirmBtn').textContent='申請データ登録中…';let j=await api(FN,{action:'confirm',parsed:current(),source_file_path:analyzed.source_file_path,source_file_name:analyzed.source_file_name,ai_raw:analyzed.ai_raw});await uploadSupports(j.id);$('confirmBtn').textContent='申請中…';await api(AFN,{action:'submit_snapshot',id:j.id,approval_due_date:due});alert('見積を申請しました');$('reviewCard').classList.add('hidden');$('file').value='';$('supportFiles').value='';$('approvalDueDate').value='';$('selectedFiles').innerHTML='';analyzed=null;load()}catch(e){alert(e.message)}finally{$('confirmBtn').disabled=false;$('confirmBtn').textContent='この内容で申請する'}};
$('sourceBtn').onclick=async()=>{let j=await api(FN,{action:'source_url',path:analyzed.source_file_path});window.open(j.url,'_blank')};
function money(v){let n=Number(v||0);return Number.isFinite(n)?n.toLocaleString('ja-JP'):String(v||'')}function sales(x){return Number(x.won_quantity||0)*Number(x.won_unit_price||0)+Number(x.plate_fee||0)}function date(v){if(!v)return'';return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit'}).format(new Date(v))}function days(x){if(!x.created_at)return 0;let a=new Date(x.created_at),b=new Date();return Math.max(0,Math.floor((b-a)/86400000))}
function stage(x){if(x.workflow_status==='申請中')return['申請中','bApply'];if(x.workflow_status==='差戻し')return['差戻し','bReturn'];if(x.workflow_status==='承認済み')return['承認済み','bApproved'];if(x.status==='受注')return['受注','bWon'];if(x.status==='失注')return['失注','bLost'];return['回答待ち','bWait']}
function match(x){if(filter==='all')return true;if(filter==='申請中')return x.workflow_status==='申請中'||x.workflow_status==='差戻し';if(filter==='承認済み')return x.workflow_status==='承認済み';if(['回答待ち','受注','失注'].includes(filter))return x.workflow_status==='提出済み'&&(x.status||'回答待ち')===filter;return true}
function dueText(x){return x.approval_due_date?'<div class="due">承認希望：'+esc(x.approval_due_date)+'</div>':''}
function compact(x){let st=stage(x),d=days(x),right='<span class="badge '+st[1]+'">'+st[0]+'</span>';if(st[0]==='回答待ち')right+='<div class="compactWait '+(d>=7?'over':'')+'">'+d+'日</div>';if(st[0]==='受注')right+='<div style="color:#11623e;margin-top:3px">¥'+money(sales(x))+'</div>';if(st[0]==='承認済み')right+='<button class="miniQuoted" onclick="event.stopPropagation();quoted('+x.id+')">客先提出</button>';return '<div class="compact"><div class="cDate">'+date(x.created_at)+'</div><div><div class="cName">'+esc(x.company_name)+' / <button class="productLink" onclick="openDetail('+x.id+')">'+esc(x.product_name||'製品名なし')+'</button></div><div class="cSub">'+esc(x.person_in_charge||'')+'</div>'+((st[0]==='申請中'||st[0]==='承認済み')?dueText(x):'')+'</div><div class="cRight">'+right+'</div></div>'}
function detailed(x){let st=stage(x),d=days(x),extra='';if(st[0]==='回答待ち')extra='<div class="age">登録日：'+date(x.created_at)+' <span class="days '+(d>=7?'over':d>=3?'warn':'')+'">'+d+'日経過</span></div>';else extra='<div class="age">登録日：'+date(x.created_at)+'</div>';if(st[0]==='申請中'||st[0]==='承認済み')extra+=dueText(x);if(x.status==='受注'&&x.workflow_status==='提出済み')extra+='<div class="resultBox wonBox">受注数量：'+money(x.won_quantity)+'　@'+money(x.won_unit_price)+'円<br>原版代：'+money(x.plate_fee)+'円<div class="sales">売上：'+money(sales(x))+'円</div></div>';if(x.status==='失注'&&x.workflow_status==='提出済み')extra+='<div class="resultBox lostBox">失注理由：'+esc(x.lost_reason||'未記入')+(x.result_note?'<br>メモ：'+esc(x.result_note):'')+'</div>';let act='<button class="btn gray" onclick="source(\''+esc(x.source_file_path||'')+'\')">原本</button>';if(x.workflow_status==='承認済み')act+='<button class="btn blue" onclick="quoted('+x.id+')">客先へ提出した</button>';if(x.workflow_status==='提出済み'&&(x.status||'回答待ち')==='回答待ち')act+='<button class="btn green" onclick="result('+x.id+',\'受注\')">受注</button><button class="btn red" onclick="result('+x.id+',\'失注\')">失注</button>';act+='<button class="btn danger" onclick="del('+x.id+',\''+esc(x.company_name||'')+'\')">削除</button>';return '<div class="item"><div class="top"><div class="name">'+esc(x.company_name)+' / <button class="productLink" onclick="openDetail('+x.id+')">'+esc(x.product_name||'製品名なし')+'</button></div><span class="badge '+st[1]+'">'+st[0]+'</span></div><div class="meta">'+esc(x.material)+' '+esc(x.thickness)+'　'+(x.width??'')+'×'+(x.height??'')+'　担当：'+esc(x.person_in_charge||'')+'</div>'+extra+'<div class="actions">'+act+'</div></div>'}
function render(){let a=items.filter(match);$('count').textContent=a.length+'件';$('list').innerHTML=a.map(x=>view==='compact'?compact(x):detailed(x)).join('')||'<div class="sub" style="padding:16px 0">該当する見積はありません</div>'}
async function load(){try{let j=await api(FN,{action:'list',q:$('search').value});items=j.items||[];render()}catch(e){$('list').textContent=e.message}}
window.openDetail=id=>location.href='estimate-notebook2-detail.html?id='+id+'&v=6';window.source=async p=>{let j=await api(FN,{action:'source_url',path:p});window.open(j.url,'_blank')};window.quoted=async id=>{if(!confirm('実際に客先へ見積書を提出しましたか？\n「OK」で回答待ちへ移します。'))return;try{await api(AFN,{action:'mark_quoted',id});alert('回答待ちへ移しました');load()}catch(e){alert(e.message)}};window.result=async(id,s)=>{let b={action:'update_result',id,status:s};if(s==='受注'){let q=prompt('受注数量');if(q===null)return;let u=prompt('受注単価');if(u===null)return;b.won_quantity=q;b.won_unit_price=u}else{let r=prompt('失注理由');if(r===null)return;b.lost_reason=r}b.result_note=prompt('結果メモ','')||'';await api(FN,b);load()};window.del=async(id,n)=>{if(!confirm(n+' を削除しますか？'))return;await api(FN,{action:'delete',id});load()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('.viewBtn').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.viewBtn').forEach(x=>x.classList.toggle('active',x===b));render()});$('refreshBtn').onclick=load;$('search').oninput=load;load();
</script></body></html>
