<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2024">
<title>見積もりノート2</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#17212b;background:#f4f6f8}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:25px;margin:8px 0}.sub{color:#647281;font-size:14px}.card{background:#fff;border:1px solid #dce3e8;border-radius:16px;padding:16px;margin:14px 0}.hidden{display:none!important}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;font-size:15px}.primary{background:#111;color:#fff}.green{background:#18794e;color:#fff}.red{background:#b42318;color:#fff}.gray{background:#e9eef2;color:#24323d}.dangerOutline{background:#fff;color:#b42318;border:2px solid #b42318}.editBtn{background:#fff;color:#245b9b;border:2px solid #245b9b}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}#fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:12px;align-items:start}#fields .field[data-field="company_name"],#fields .field[data-field="product_name"],#fields .field[data-field="notes"]{grid-column:1/-1}.priceSection{grid-column:1/-1;margin:8px 0 2px}.field{margin:10px 0;position:relative;min-width:0}.field label{display:block;font-size:12px;font-weight:800;color:#5b6873;margin-bottom:5px}input,textarea,select{width:100%;padding:11px;border:1px solid #cfd8df;border-radius:10px;font-size:16px;background:#fff;min-width:0}textarea{min-height:82px}.field.needs-check label{color:#b42318}.field.needs-check input,.field.needs-check textarea{border:2px solid #d92d20;background:#fff5f4}.review-actions{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}.mini{padding:7px 10px;border-radius:9px;border:0;font-weight:800;font-size:12px}.okbtn{background:#18794e;color:#fff}.fixbtn{background:#b42318;color:#fff}.verified label{color:#18794e}.verified input,.verified textarea{border:2px solid #18794e;background:#f1fff7}.verified-note{font-size:12px;color:#18794e;font-weight:900;margin-top:5px}.status{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;display:inline-block}.wait{background:#fff4cc}.won{background:#d9f5e7;color:#11623e}.lost{background:#fde2e0;color:#9d2018}.item{border-top:1px solid #edf1f4;padding:13px 0}.item:first-child{border-top:0}.name{font-weight:900;font-size:17px}.meta{font-size:13px;color:#667582;line-height:1.6}.resultMeta{margin-top:7px;padding:9px 10px;border-radius:10px;background:#f6f8fa;font-size:13px;line-height:1.55}.priceRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:7px 0}.warn{background:#fff0ef;border:2px solid #f04438;color:#7a271a;border-radius:12px;padding:12px;font-size:13px;margin-top:10px}.loading{font-weight:900;text-align:center;padding:20px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.modal{position:fixed;inset:0;background:#0008;z-index:1000;overflow:auto;padding:18px}.modalBox{max-width:760px;margin:20px auto;background:#fff;border-radius:18px;padding:16px}.modalHead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:#fff;padding-bottom:8px;z-index:3}.editGrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.editGrid .full{grid-column:1/-1}.closeBtn{border:0;background:#e9eef2;border-radius:10px;padding:9px 12px;font-weight:800}.editPrices .priceRow{position:relative}.removePrice{border:0;background:#fde2e0;color:#9d2018;border-radius:8px;padding:7px 8px;font-weight:800;margin-top:3px}
@media(max-width:620px){.row{grid-template-columns:1fr}.wrap{padding:12px}#fields{column-gap:10px}#fields .field label{font-size:11px}#fields input{padding:10px;font-size:15px}.priceRow{grid-template-columns:1fr 1fr 1fr;gap:6px}.priceRow input{font-size:14px;padding:9px 7px}.editGrid{grid-template-columns:1fr 1fr;gap:0 8px}.modal{padding:8px}.modalBox{margin:8px auto}}
</style>
</head>
<body>
<div class="wrap">
<h1>見積もりノート2</h1><div class="sub">原本 → AI整理 → 回答待ち → 受注／失注</div>
<div class="card"><h3>① 原本を追加</h3><input id="file" type="file" accept="application/pdf,image/*"><div class="actions"><button class="btn primary" id="analyzeBtn">AIで読み取る</button></div><div id="progress" class="hidden loading">AI読み取り中…</div><div id="error" class="warn hidden"></div></div>
<div id="reviewCard" class="card hidden"><h3>② AI読取結果を確認</h3><div id="warnings"></div><div id="fields"></div><div class="actions"><button class="btn green" id="confirmBtn">確認して登録</button><button class="btn gray" id="sourceBtn">原本を見る</button></div></div>
<div class="card"><div class="top"><h3>③ 案件一覧</h3><button class="btn gray" id="refreshBtn">更新</button></div><input id="search" placeholder="会社名・製品名・担当者で検索"><div id="list"></div></div>
</div>
<div id="editModal" class="modal hidden"><div class="modalBox"><div class="modalHead"><h2>案件を編集</h2><button class="closeBtn" onclick="closeEdit()">閉じる</button></div><div id="editBody"></div><div class="actions"><button class="btn green" id="saveEditBtn">変更を保存</button><button class="btn gray" onclick="closeEdit()">キャンセル</button></div></div></div>
<script>
const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-ai';
const EDIT_FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-edit';
let analyzed=null,reviewState={},editingId=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const LABEL={company_name:'会社名',product_name:'図番・製品名',customer_department:'客先部署',customer_name:'客先名',material:'材質',thickness:'板厚',width:'横サイズ',height:'縦サイズ',color_text:'色',manufacturing_method:'製作方法',delivery_text:'納期',person_in_charge:'担当者',plate_fee:'原版代',notes:'備考'};
const KEYS=Object.keys(LABEL);
async function api(b){const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.error||'処理失敗');return j}
async function editApi(b){const r=await fetch(EDIT_FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.error||'編集処理に失敗しました');return j}
function file64(f){return new Promise((ok,ng)=>{let r=new FileReader;r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ng;r.readAsDataURL(f)})}
$('analyzeBtn').onclick=async()=>{let f=$('file').files[0];if(!f)return alert('原本を選んでください');try{$('progress').classList.remove('hidden');$('analyzeBtn').disabled=true;analyzed=await api({action:'analyze',file_name:f.name,mime_type:f.type||'application/octet-stream',base64:await file64(f)});fill(analyzed.parsed);$('reviewCard').classList.remove('hidden')}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden')}finally{$('progress').classList.add('hidden');$('analyzeBtn').disabled=false}};
function fieldHtml(k,p,uncertain){let bad=uncertain.includes(k),type=['width','height','plate_fee'].includes(k)?'number':'text',val=esc(p[k]??'');return '<div class="field '+(bad?'needs-check':'')+'" data-field="'+k+'"><label>'+LABEL[k]+'</label>'+(k==='notes'?'<textarea id="'+k+'">'+val+'</textarea>':'<input id="'+k+'" type="'+type+'" value="'+val+'">')+(bad?'<div class="review-actions"><button class="mini okbtn" onclick="resolveField(\''+k+'\',false)">✓ 合っている</button><button class="mini fixbtn" onclick="resolveField(\''+k+'\',true)">✎ 修正した</button></div>':'')+'</div>'}
function fill(p){reviewState={};let uncertain=[...new Set((p.uncertain_fields||[]).filter(k=>KEYS.includes(k)))];p.uncertain_fields=uncertain;$('warnings').innerHTML=uncertain.length?'<div class="warn"><b>🔴 要チェック</b><br>赤い項目だけ確認してください。</div>':'';let html='';KEYS.forEach(k=>{if(k==='plate_fee')html+='<div class="priceSection"><h4>数量別単価</h4><div id="prices"></div><button class="btn gray" id="addPrice">＋ 数量行を追加</button></div>';html+=fieldHtml(k,p,uncertain)});$('fields').innerHTML=html;$('prices').innerHTML='';(p.prices||[]).forEach(addPriceRow);if(!(p.prices||[]).length)addPriceRow({});$('addPrice').onclick=()=>addPriceRow({})}
window.resolveField=(k,fixed)=>{let el=document.querySelector('[data-field="'+k+'"]');if(fixed){let inp=$(k);inp.focus();let done=()=>{reviewState[k]='corrected';finish(el,'✎ 修正済み');inp.removeEventListener('change',done)};inp.addEventListener('change',done);alert('内容を正しい値に直してください。入力後、この欄から離れると「修正済み」になります。')}else{reviewState[k]='confirmed';finish(el,'✓ 原本確認済み')}};
function finish(el,text){el.classList.remove('needs-check');el.classList.add('verified');el.querySelector('.review-actions')?.remove();let old=el.querySelector('.verified-note');if(old)old.remove();let n=document.createElement('div');n.className='verified-note';n.textContent=text;el.appendChild(n)}
function addPriceRow(p={}){let d=document.createElement('div');d.className='priceRow';d.innerHTML='<input class="qty" type="number" placeholder="数量" value="'+esc(p.quantity??'')+'"><input class="unit" type="number" placeholder="単価" value="'+esc(p.unit_price??'')+'"><input class="amt" type="number" placeholder="金額" value="'+esc(p.amount??'')+'">';$('prices').appendChild(d)}
function current(){let p={};KEYS.forEach(k=>p[k]=$(k).value);['width','height','plate_fee'].forEach(k=>p[k]=p[k]===''?null:Number(p[k]));p.prices=[...document.querySelectorAll('#prices .priceRow')].map(r=>({quantity:r.querySelector('.qty').value||null,unit_price:r.querySelector('.unit').value||null,amount:r.querySelector('.amt').value||null}));p.uncertain_fields=[...document.querySelectorAll('.field.needs-check')].map(el=>el.dataset.field);return p}
$('confirmBtn').onclick=async()=>{let unresolved=[...document.querySelectorAll('.field.needs-check')];if(unresolved.length){unresolved[0].scrollIntoView({behavior:'smooth',block:'center'});return alert('赤い「要チェック」がまだ残っています。')}try{$('confirmBtn').disabled=true;$('confirmBtn').textContent='登録中…';await api({action:'confirm',parsed:current(),source_file_path:analyzed.source_file_path,source_file_name:analyzed.source_file_name,ai_raw:analyzed.ai_raw});alert('回答待ちとして登録しました');$('reviewCard').classList.add('hidden');$('file').value='';analyzed=null;loadList()}catch(e){alert(e.message)}finally{$('confirmBtn').disabled=false;$('confirmBtn').textContent='確認して登録'}};
$('sourceBtn').onclick=async()=>{let j=await api({action:'source_url',path:analyzed.source_file_path});window.open(j.url,'_blank')};
function statusBadge(x){const cls=x.status==='受注'?'won':x.status==='失注'?'lost':'wait';return '<span class="status '+cls+'">'+esc(x.status||'回答待ち')+'</span>'}
function resultBlock(x){if(x.status==='失注')return '<div class="resultMeta"><b>失注理由：</b>'+esc(x.lost_reason||'')+(x.result_note?'<br><b>結果メモ：</b>'+esc(x.result_note):'')+(x.result_date?'<br><b>結果日：</b>'+esc(x.result_date):'')+'</div>';if(x.status==='受注')return '<div class="resultMeta"><b>受注：</b>'+esc(x.won_quantity??'')+'枚　@'+esc(x.won_unit_price??'')+(x.result_note?'<br><b>結果メモ：</b>'+esc(x.result_note):'')+(x.result_date?'<br><b>結果日：</b>'+esc(x.result_date):'')+'</div>';return ''}
async function loadList(){try{let j=await api({action:'list',q:$('search').value});$('list').innerHTML=(j.items||[]).map(x=>'<div class="item"><div class="top"><div class="name">'+esc(x.company_name)+' / '+esc(x.product_name)+'</div>'+statusBadge(x)+'</div><div class="meta">'+esc(x.material)+' '+esc(x.thickness)+'　'+(x.width??'')+'×'+(x.height??'')+'　担当：'+esc(x.person_in_charge||'')+'</div>'+resultBlock(x)+'<div class="actions"><button class="btn gray" onclick="openSource(\''+esc(x.source_file_path||'')+'\')">原本</button><button class="btn green" onclick="setResult('+x.id+',\'受注\')">受注</button><button class="btn red" onclick="setResult('+x.id+',\'失注\')">失注</button><button class="btn editBtn" onclick="editCase('+x.id+')">編集</button><button class="btn dangerOutline" onclick="deleteCase('+x.id+',\''+esc(x.company_name||'')+' / '+esc(x.product_name||'')+'\')">削除</button></div></div>').join('')||'<div class="sub">まだ登録がありません</div>'}catch(e){$('list').innerHTML=esc(e.message)}}
window.openSource=async p=>{let j=await api({action:'source_url',path:p});window.open(j.url,'_blank')};
window.setResult=async(id,status)=>{let b={action:'update_result',id,status};if(status==='受注'){let q=prompt('受注数量');if(q===null)return;let u=prompt('受注単価');if(u===null)return;b.won_quantity=q;b.won_unit_price=u}else{let r=prompt('失注理由');if(r===null)return;b.lost_reason=r}b.result_note=prompt('結果メモ','')||'';await api(b);loadList()};
window.deleteCase=async(id,label)=>{if(!confirm('この案件を削除しますか？\n\n'+label+'\n\n数量別単価と添付原本も削除されます。'))return;try{await api({action:'delete',id});await loadList()}catch(e){alert('削除に失敗しました\n'+e.message)}};
function eField(id,label,val,type='text',full=false){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label>'+(type==='textarea'?'<textarea id="e_'+id+'">'+esc(val??'')+'</textarea>':'<input id="e_'+id+'" type="'+type+'" value="'+esc(val??'')+'"></div>'}
window.editCase=async id=>{try{const j=await editApi({action:'get',id}),x=j.item;editingId=id;let prices=(x.estimate_notebook2_prices||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));$('editBody').innerHTML='<div class="editGrid">'+eField('company_name','会社名',x.company_name,'text',true)+eField('product_name','図番・製品名',x.product_name,'text',true)+eField('customer_department','客先部署',x.customer_department)+eField('customer_name','客先名',x.customer_name)+eField('material','材質',x.material)+eField('thickness','板厚',x.thickness)+eField('width','横サイズ',x.width,'number')+eField('height','縦サイズ',x.height,'number')+eField('color_text','色',x.color_text)+eField('manufacturing_method','製作方法',x.manufacturing_method)+eField('delivery_text','納期',x.delivery_text)+eField('person_in_charge','担当者',x.person_in_charge)+'<div class="full"><h3>数量別単価</h3><div id="editPrices" class="editPrices"></div><button class="btn gray" onclick="addEditPrice()">＋ 数量行を追加</button></div>'+eField('plate_fee','原版代',x.plate_fee,'number')+eField('notes','備考',x.notes,'textarea',true)+'<div class="field"><label>結果</label><select id="e_status"><option '+(x.status==='回答待ち'?'selected':'')+'>回答待ち</option><option '+(x.status==='受注'?'selected':'')+'>受注</option><option '+(x.status==='失注'?'selected':'')+'>失注</option></select></div>'+eField('result_date','結果日',x.result_date||'','date')+eField('won_quantity','受注数量',x.won_quantity,'number')+eField('won_unit_price','受注単価',x.won_unit_price,'number')+eField('lost_reason','失注理由',x.lost_reason,'text',true)+eField('result_note','結果メモ',x.result_note,'textarea',true)+'</div>';$('editPrices').innerHTML='';prices.forEach(p=>addEditPrice(p));if(!prices.length)addEditPrice({});$('editModal').classList.remove('hidden')}catch(e){alert(e.message)}};
window.addEditPrice=(p={})=>{let d=document.createElement('div');d.className='priceRow';d.innerHTML='<input class="eqty" type="number" placeholder="数量" value="'+esc(p.quantity??'')+'"><input class="eunit" type="number" placeholder="単価" value="'+esc(p.unit_price??'')+'"><input class="eamt" type="number" placeholder="金額" value="'+esc(p.amount??'')+'"><button class="removePrice" onclick="this.parentElement.remove()">この行を削除</button>';$('editPrices').appendChild(d)};
window.closeEdit=()=>{$('editModal').classList.add('hidden');editingId=null};
$('saveEditBtn').onclick=async()=>{if(!editingId)return;const get=id=>$('e_'+id)?.value??'';const item={company_name:get('company_name'),product_name:get('product_name'),customer_department:get('customer_department'),customer_name:get('customer_name'),material:get('material'),thickness:get('thickness'),width:get('width'),height:get('height'),color_text:get('color_text'),manufacturing_method:get('manufacturing_method'),delivery_text:get('delivery_text'),person_in_charge:get('person_in_charge'),plate_fee:get('plate_fee'),notes:get('notes'),status:$('e_status').value,result_date:get('result_date'),won_quantity:get('won_quantity'),won_unit_price:get('won_unit_price'),lost_reason:get('lost_reason'),result_note:get('result_note'),prices:[...document.querySelectorAll('#editPrices .priceRow')].map(r=>({quantity:r.querySelector('.eqty').value||null,unit_price:r.querySelector('.eunit').value||null,amount:r.querySelector('.eamt').value||null}))};try{$('saveEditBtn').disabled=true;$('saveEditBtn').textContent='保存中…';await editApi({action:'update',id:editingId,item});closeEdit();await loadList();alert('変更を保存しました')}catch(e){alert(e.message)}finally{$('saveEditBtn').disabled=false;$('saveEditBtn').textContent='変更を保存'}};
$('refreshBtn').onclick=loadList;$('search').oninput=loadList;loadList();
</script>
</body></html>
