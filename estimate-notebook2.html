<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<title>見積申請・承認</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#eef2f5;color:#17212b}.bar{min-height:58px;background:#17212b;color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;position:sticky;top:0;z-index:20;flex-wrap:wrap}.title{font-weight:900;margin-right:auto}.who{background:#fff;color:#17212b;border:0;border-radius:10px;padding:9px 11px;font-weight:900}.end{border:1px solid #ffb4ae;background:#7a271f;color:#fff;border-radius:9px;padding:8px 10px;font-weight:900}.nav{border:1px solid #6f7c86;background:#27333d;color:#fff;border-radius:9px;padding:8px 10px;font-weight:800}.nav.active{background:#fff;color:#17212b}.nav.locked{opacity:.38}.topBack{border:1px solid #8ea0ad;background:#e9eef2;color:#17212b;border-radius:9px;padding:8px 10px;font-weight:900}.pane{display:none;height:calc(100vh - 58px)}.pane.active{display:block}iframe{border:0;width:100%;height:100%;background:#fff}.wrap{max-width:850px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d7e0e6;border-radius:15px;padding:15px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select{padding:10px;border:1px solid #cbd5dc;border-radius:9px;font-size:15px}.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:900}.blue{background:#145ea8;color:#fff}.red{background:#b42318;color:#fff}.gray{background:#e9eef2}.person{display:flex;align-items:center;gap:8px;border-top:1px solid #edf1f4;padding:10px 0}.person:first-child{border-top:0}.grow{flex:1}.role{font-size:12px;color:#687681}.inactive{opacity:.5}.log{border-top:1px solid #edf1f4;padding:9px 0}.log:first-child{border-top:0}.time{font-size:11px;color:#6b7780}.action{font-weight:900}.target{font-size:13px}.overlay{position:fixed;inset:0;background:rgba(10,20,30,.68);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:#fff;border-radius:18px;padding:18px;width:min(620px,100%);max-height:85vh;overflow:auto}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.choice{border:2px solid #d3dde4;background:#fff;border-radius:13px;padding:16px 8px;font-weight:900;font-size:16px;min-height:92px}.choice small{display:block;color:#667582;margin-top:4px}.choice.owner-choice{background:#eceff1;border-color:#c4cdd3}.hidden{display:none!important}.empty{color:#697680;padding:16px 0}@media(max-width:620px){.title{width:100%;margin-right:0}.pane{height:calc(100vh - 104px)}.modal{padding:16px;width:100%}.choices{grid-template-columns:1fr 1fr;gap:8px}.choice{min-height:86px;padding:12px 5px;font-size:15px}}
</style>
</head>
<body>
<div class="bar"><div class="title">見積申請・承認</div><button class="who" id="whoBtn" type="button">利用者を選択</button><button class="end" id="endBtn" type="button">操作終了</button><button class="nav active" data-pane="app" type="button">TOP見積・保管</button><button class="nav" data-pane="batch" type="button">一括申請</button><button class="nav" data-pane="settings" id="settingsNav" type="button">利用者設定</button><button class="nav" data-pane="history" type="button">操作履歴</button><button class="topBack hidden" id="topBackBtn" type="button">TOP保管庫へ戻る</button></div>
<section id="app" class="pane active"><iframe id="appFrame" src="estimate-notebook2-core.html?v=20260823-archive1"></iframe></section><section id="batch" class="pane"><iframe id="batchFrame" src="estimate-notebook2-batch.html?v=20260823-archive1"></iframe></section><section id="settings" class="pane"><div class="wrap"><div class="card"><h2>利用者設定</h2><div class="row"><input id="newName" placeholder="氏名（例：Aさん）"><select id="newRole"><option>事務</option><option>承認者</option><option>営業</option><option>管理者</option></select><button class="btn blue" id="addBtn" type="button">追加</button></div></div><div class="card" id="people"></div></div></section><section id="history" class="pane"><div class="wrap"><div class="card"><div class="row"><h2 style="margin-right:auto">操作履歴</h2><button class="btn gray" id="reloadLogs" type="button">更新</button></div><div id="logs"></div></div></div></section>
<div id="chooser" class="overlay hidden"><div class="modal"><h2 style="margin-top:0">今日は誰が操作しますか？</h2><div style="color:#65727c;font-size:13px">選んだ名前で申請・編集・承認・客先提出・受注/失注の履歴を残します。</div><div id="choices" class="choices"></div></div></div>
<script>
'use strict';
const OFN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-operators';
const SFN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-customer-supply';
let operators=[],current=null;window.getCurrentOperator=()=>current;const $=id=>document.getElementById(id),esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const isOwner=p=>p?.name==='承認(社長)';const canManageUsers=()=>isOwner(current);
function updatePermissions(){$('settingsNav').classList.toggle('locked',!canManageUsers())}
function refreshEstimateList(){try{const w=$('appFrame')?.contentWindow;if(w&&typeof w.load==='function')w.load();}catch(e){console.warn('estimate refresh skipped',e)}}
function requireUserAdmin(){if(canManageUsers())return true;alert('利用者設定は「承認(社長)」のみ操作できます。');return false}
async function op(body){const r=await fetch(OFN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||'処理失敗');return j}
async function supply(body){const r=await fetch(SFN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||'処理失敗');return j}
async function saveSupply(id,p){if(!id||!p)return;try{await supply({id,customer_material_supplied:!!p.customer_material_supplied,customer_material_note:p.customer_material_note||'',customer_data_supplied:!!p.customer_data_supplied,customer_data_note:p.customer_data_note||''})}catch(e){console.warn('customer supply save failed',e)}}
function saveCurrent(p){current=p;$('whoBtn').textContent=p.name+'（'+p.role+'）';$('chooser').classList.add('hidden');updatePermissions();setTimeout(refreshEstimateList,0)}
function sortedOperators(){return [...operators].sort((a,b)=>{if(isOwner(a)!==isOwner(b))return isOwner(a)?1:-1;return (Number(a.sort_order)||0)-(Number(b.sort_order)||0)||String(a.name).localeCompare(String(b.name),'ja')})}
function renderChoices(){const active=sortedOperators().filter(x=>x.is_active);$('choices').innerHTML=active.length?active.map(p=>`<button class="choice ${isOwner(p)?'owner-choice':''}" type="button" data-choose="${p.id}">${esc(p.name)}<small>${esc(p.role)}</small></button>`).join(''):'<div class="empty" style="grid-column:1/-1">まだ利用者が登録されていません。</div>';document.querySelectorAll('[data-choose]').forEach(btn=>btn.addEventListener('click',()=>{const p=operators.find(x=>x.id===Number(btn.dataset.choose));if(p)saveCurrent(p)}))}
function renderPeople(){const a=sortedOperators();$('people').innerHTML=a.length?a.map(p=>`<div class="person ${p.is_active?'':'inactive'}"><div class="grow"><b>${esc(p.name)}</b><div class="role">${esc(p.role)}${p.is_active?'':'・無効'}</div></div><button class="btn gray" type="button" data-edit="${p.id}">変更</button><button class="btn ${p.is_active?'red':'blue'}" type="button" data-toggle="${p.id}" data-next="${p.is_active?'0':'1'}">${p.is_active?'無効化':'有効に戻す'}</button></div>`).join(''):'<div class="empty">利用者を追加してください。</div>';document.querySelectorAll('[data-edit]').forEach(btn=>btn.addEventListener('click',()=>editPerson(Number(btn.dataset.edit))));document.querySelectorAll('[data-toggle]').forEach(btn=>btn.addEventListener('click',()=>togglePerson(Number(btn.dataset.toggle),btn.dataset.next==='1')))}
async function loadOperators(){try{const j=await op({action:'list_operators'});operators=j.items||[];renderPeople();renderChoices();updatePermissions();if(!current)$('chooser').classList.remove('hidden')}catch(e){console.error(e);alert('利用者一覧を読み込めませんでした：'+e.message)}}
function showPane(name){if(name==='settings'&&!requireUserAdmin())return;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.pane===name));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===name));$('topBackBtn').classList.toggle('hidden',name==='app');if(name==='history')loadLogs();if(name==='app')setTimeout(refreshEstimateList,0)}
function goTop(){showPane('app');$('appFrame').src='estimate-notebook2-core.html?v=20260823-archive1'}
async function editPerson(id){if(!requireUserAdmin())return;const p=operators.find(x=>x.id===id);if(!p)return;const name=prompt('名前',p.name);if(name===null)return;const role=prompt('役割（事務／承認者／営業／管理者など）',p.role);if(role===null)return;try{await op({action:'update_operator',id,name,role});await loadOperators()}catch(e){alert(e.message)}}
async function togglePerson(id,v){if(!requireUserAdmin())return;try{await op({action:'update_operator',id,is_active:v});if(current?.id===id&&!v){current=null;$('whoBtn').textContent='利用者を選択';updatePermissions()}await loadOperators()}catch(e){alert(e.message)}}
function jpTime(v){try{return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return v}}
async function loadLogs(){try{const j=await op({action:'list_logs',limit:300}),a=j.items||[];$('logs').innerHTML=a.length?a.map(x=>{const e=x.estimate_notebook2||{},target=[e.company_name,e.product_name].filter(Boolean).join(' / ');return `<div class="log"><div class="time">${jpTime(x.created_at)}　${esc(x.operator_name)}</div><div class="action">${esc(x.action)}</div>${target?`<div class="target">${esc(target)}</div>`:''}${x.details?`<div class="role">${esc(x.details)}</div>`:''}</div>`}).join(''):'<div class="empty">まだ履歴はありません。</div>'}catch(e){$('logs').textContent=e.message}}
function actionLabel(url,b){if(url.includes('estimate-notebook2-approval')){const labels={submit_snapshot:'申請',approve:'承認','return':'差戻し',resubmit:'再申請',mark_quoted:'客先提出',upload_attachment:'必要資料を追加',delete_attachment:'必要資料を削除'};return labels[b.action]||''}if(url.includes('estimate-notebook2-ai')){if(b.action==='update')return'見積内容を編集';if(b.action==='update_result')return b.status==='受注'?'受注登録':b.status==='失注'?'失注登録':'結果更新';if(b.action==='delete')return'案件削除'}return''}
function details(b){if(b.action==='update_result'&&b.status==='受注')return'数量 '+(b.won_quantity??'')+' / 単価 '+(b.won_unit_price??'');if(b.action==='update_result'&&b.status==='失注')return'理由：'+(b.lost_reason||'');return''}
function injectSupplyFields(w,p={}){try{const d=w.document,fields=d.getElementById('fields');if(!fields)return;let box=d.getElementById('customerSupplyFields');if(box)box.remove();const product=fields.querySelector('[data-field="product_name"]');if(!product)return;box=d.createElement('div');box.id='customerSupplyFields';box.style.cssText='grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:3px 0 8px';box.innerHTML=`<div class="field" style="margin:0"><label>客先から支給材</label><select id="customerMaterialSupplied"><option value="0">無</option><option value="1">有</option></select><input id="customerMaterialNote" maxlength="60" placeholder="一言メモ" style="margin-top:6px;display:none"></div><div class="field" style="margin:0"><label>客先からデータ</label><select id="customerDataSupplied"><option value="0">無</option><option value="1">有</option></select><input id="customerDataNote" maxlength="60" placeholder="一言メモ" style="margin-top:6px;display:none"></div>`;product.insertAdjacentElement('afterend',box);const ms=d.getElementById('customerMaterialSupplied'),mn=d.getElementById('customerMaterialNote'),ds=d.getElementById('customerDataSupplied'),dn=d.getElementById('customerDataNote');ms.value=p.customer_material_supplied?'1':'0';mn.value=p.customer_material_note||'';ds.value=p.customer_data_supplied?'1':'0';dn.value=p.customer_data_note||'';const toggle=()=>{mn.style.display=ms.value==='1'?'block':'none';dn.style.display=ds.value==='1'?'block':'none'};ms.onchange=toggle;ds.onchange=toggle;toggle()}catch(e){console.warn('supply fields inject failed',e)}}
function patchSupplyForm(frame){let w;try{w=frame?.contentWindow}catch{return}if(!w||w.__supplyFormPatched)return;try{w.__supplyFormPatched=true;if(typeof w.fill==='function'){const originalFill=w.fill.bind(w);w.fill=function(p){const r=originalFill(p);injectSupplyFields(w,p||{});return r}}if(typeof w.current==='function'){const originalCurrent=w.current.bind(w);w.current=function(){const p=originalCurrent();const d=w.document,ms=d.getElementById('customerMaterialSupplied'),mn=d.getElementById('customerMaterialNote'),ds=d.getElementById('customerDataSupplied'),dn=d.getElementById('customerDataNote');p.customer_material_supplied=ms?.value==='1';p.customer_material_note=p.customer_material_supplied?(mn?.value||'').trim():'';p.customer_data_supplied=ds?.value==='1';p.customer_data_note=p.customer_data_supplied?(dn?.value||'').trim():'';return p}}}catch(e){console.warn('supply form patch skipped',e)}}
async function patchDetailFields(frame){let w;try{w=frame?.contentWindow}catch{return}if(!w)return;let href='';try{href=w.location.href}catch{return}if(!href.includes('estimate-notebook2-detail.html'))return;const d=w.document;let tries=0;const timer=setInterval(async()=>{tries++;const product=d.getElementById('f_product_name');if(!product){if(tries>40)clearInterval(timer);return}clearInterval(timer);const thick=d.getElementById('f_thickness');if(thick?.previousElementSibling)thick.previousElementSibling.textContent='厚み';if(d.getElementById('detailSupplyFields'))return;const eid=Number(new URL(href).searchParams.get('id'));let p={};try{const j=await supply({action:'get',id:eid});p=j.item||{}}catch(e){console.warn(e)}const box=d.createElement('div');box.id='detailSupplyFields';box.className='full';box.style.cssText='grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:4px 0 8px';box.innerHTML=`<div class="field"><label>客先から支給材</label><select id="detailCustomerMaterial"><option value="0">無</option><option value="1">有</option></select><input id="detailCustomerMaterialNote" maxlength="60" placeholder="一言メモ" style="margin-top:6px;display:none"></div><div class="field"><label>客先からデータ</label><select id="detailCustomerData"><option value="0">無</option><option value="1">有</option></select><input id="detailCustomerDataNote" maxlength="60" placeholder="一言メモ" style="margin-top:6px;display:none"></div>`;product.parentElement.insertAdjacentElement('afterend',box);const ms=d.getElementById('detailCustomerMaterial'),mn=d.getElementById('detailCustomerMaterialNote'),ds=d.getElementById('detailCustomerData'),dn=d.getElementById('detailCustomerDataNote');ms.value=p.customer_material_supplied?'1':'0';mn.value=p.customer_material_note||'';ds.value=p.customer_data_supplied?'1':'0';dn.value=p.customer_data_note||'';const toggle=()=>{mn.style.display=ms.value==='1'?'block':'none';dn.style.display=ds.value==='1'?'block':'none'};const save=()=>saveSupply(eid,{customer_material_supplied:ms.value==='1',customer_material_note:mn.value,customer_data_supplied:ds.value==='1',customer_data_note:dn.value});ms.onchange=()=>{toggle();save()};ds.onchange=()=>{toggle();save()};mn.onchange=save;dn.onchange=save;toggle()},100)}
function patchOneFrame(frame){if(!frame)return;let w;try{w=frame.contentWindow}catch{return}if(!w)return;patchSupplyForm(frame);patchDetailFields(frame);if(w.__operatorPatched)return;try{w.__operatorPatched=true;const original=w.fetch.bind(w);w.fetch=async function(input,init){const url=typeof input==='string'?input:(input?.url||'');let body=null;try{body=init?.body?JSON.parse(init.body):null}catch{}const r=await original(input,init);try{if(r.ok&&body?.action==='list'&&url.includes('estimate-notebook2-ai')&&current&&!isOwner(current)){const data=await r.clone().json();if(Array.isArray(data.items)){data.items=data.items.filter(x=>String(x.person_in_charge||'').trim()===String(current.name||'').trim());return new Response(JSON.stringify(data),{status:r.status,statusText:r.statusText,headers:{'content-type':'application/json'}})}}}catch(e){console.warn('operator filter skipped',e)}try{if(r.ok&&url.includes('estimate-notebook2-ai')&&body?.action==='confirm'&&body.parsed){const j=await r.clone().json();if(j?.id)saveSupply(j.id,body.parsed)}if(r.ok&&url.includes('estimate-notebook2-ai')&&body?.action==='update'&&body.item&&body.id)saveSupply(body.id,body.item)}catch(e){console.warn('customer supply persistence skipped',e)}try{const label=body?actionLabel(url,body):'';if(r.ok&&label&&current){op({action:'log',operator_id:current.id,operator_name:current.name,event:label,estimate_id:Number(body.id)||null,details:details(body)}).catch(()=>{})}}catch{}return r}}catch(e){console.warn('frame patch skipped',e)}}
function patchFrames(){patchOneFrame($('appFrame'));patchOneFrame($('batchFrame'))}
$('whoBtn').addEventListener('click',()=>$('chooser').classList.remove('hidden'));$('endBtn').addEventListener('click',()=>{if(current&&!confirm(current.name+'さんの操作を終了しますか？'))return;current=null;$('whoBtn').textContent='利用者を選択';updatePermissions();$('chooser').classList.remove('hidden')});$('topBackBtn').addEventListener('click',goTop);$('addBtn').addEventListener('click',async()=>{if(!requireUserAdmin())return;const name=$('newName').value.trim();if(!name)return alert('名前を入力してください');try{await op({action:'add_operator',name,role:$('newRole').value});$('newName').value='';await loadOperators()}catch(e){alert(e.message)}});$('reloadLogs').addEventListener('click',loadLogs);document.querySelectorAll('.nav').forEach(btn=>btn.addEventListener('click',()=>showPane(btn.dataset.pane)));$('appFrame').addEventListener('load',()=>setTimeout(()=>{patchFrames();refreshEstimateList()},80));$('batchFrame').addEventListener('load',()=>setTimeout(patchFrames,80));updatePermissions();loadOperators().then(()=>setTimeout(()=>{patchFrames();refreshEstimateList()},300));
</script></body></html>
