<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17212b"><title>見積申請・承認</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#eef2f5;color:#17212b}.bar{height:58px;background:#17212b;color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;position:sticky;top:0;z-index:20}.title{font-weight:900;margin-right:auto}.who{background:#fff;color:#17212b;border:0;border-radius:10px;padding:9px 11px;font-weight:900}.end{border:1px solid #ffb4ae;background:#7a271f;color:#fff;border-radius:9px;padding:8px 10px;font-weight:900}.nav{border:1px solid #6f7c86;background:#27333d;color:#fff;border-radius:9px;padding:8px 10px;font-weight:800}.nav.active{background:#fff;color:#17212b}.pane{display:none;height:calc(100vh - 58px)}.pane.active{display:block}iframe{border:0;width:100%;height:100%;background:#fff}.wrap{max-width:850px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d7e0e6;border-radius:15px;padding:15px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select{padding:10px;border:1px solid #cbd5dc;border-radius:9px;font-size:15px}.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:900}.blue{background:#145ea8;color:#fff}.red{background:#b42318;color:#fff}.gray{background:#e9eef2}.person{display:flex;align-items:center;gap:8px;border-top:1px solid #edf1f4;padding:10px 0}.person:first-child{border-top:0}.grow{flex:1}.role{font-size:12px;color:#687681}.inactive{opacity:.5}.log{border-top:1px solid #edf1f4;padding:9px 0}.log:first-child{border-top:0}.time{font-size:11px;color:#6b7780}.action{font-weight:900}.target{font-size:13px}.overlay{position:fixed;inset:0;background:rgba(10,20,30,.68);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:#fff;border-radius:18px;padding:18px;width:min(520px,100%);max-height:85vh;overflow:auto}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.choice{border:2px solid #d3dde4;background:#fff;border-radius:13px;padding:16px 10px;font-weight:900;font-size:16px}.choice small{display:block;color:#667582;margin-top:4px}.hidden{display:none!important}.empty{color:#697680;padding:16px 0}@media(max-width:620px){.bar{height:auto;min-height:58px;flex-wrap:wrap}.title{width:100%}.pane{height:calc(100vh - 104px)}.choices{grid-template-columns:1fr}}</style></head><body><div class="bar"><div class="title">見積申請・承認</div><button class="who" id="whoBtn">利用者を選択</button><button class="end" id="endBtn">操作終了</button><button class="nav active" data-pane="app">見積</button><button class="nav" data-pane="settings">利用者設定</button><button class="nav" data-pane="history">操作履歴</button></div><section id="app" class="pane active"><iframe id="appFrame" src="estimate-notebook2-core.html?v=1"></iframe></section><section id="settings" class="pane"><div class="wrap"><div class="card"><h2>利用者設定</h2><div class="row"><input id="newName" placeholder="氏名（例：Aさん）"><select id="newRole"><option>事務</option><option>承認者</option><option>営業</option><option>管理者</option></select><button class="btn blue" id="addBtn">追加</button></div></div><div class="card" id="people"></div></div></section><section id="history" class="pane"><div class="wrap"><div class="card"><div class="row"><h2 style="margin-right:auto">操作履歴</h2><button class="btn gray" id="reloadLogs">更新</button></div><div id="logs"></div></div></div></section><div id="chooser" class="overlay hidden"><div class="modal"><h2 style="margin-top:0">今日は誰が操作しますか？</h2><div style="color:#65727c;font-size:13px">選んだ名前で申請・編集・承認・客先提出・受注/失注の履歴を残します。</div><div id="choices" class="choices"></div></div></div><script>const OFN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-operators';let operators=[],current=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');async function op(b){let r=await fetch(OFN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.error||'処理失敗');return j}function saveCurrent(p){current=p;$('whoBtn').textContent=p.name+'（'+p.role+'）';$('chooser').classList.add('hidden')}async function loadOperators(){let j=await op({action:'list_operators'});operators=j.items||[];renderPeople();renderChoices();if(!current)$('chooser').classList.remove('hidden')}function openSettings(){$('chooser').classList.add('hidden');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.pane==='settings'));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id==='settings'))}function renderChoices(){let a=operators.filter(x=>x.is_active);$('choices').innerHTML=a.length?a.map(p=>'<button class="choice" onclick="choose('+p.id+')">'+esc(p.name)+'<small>'+esc(p.role)+'</small></button>').join(''):'<div class="empty" style="grid-column:1/-1">まだ利用者が登録されていません。<br><br><button class="btn blue" onclick="openSettings()">利用者設定を開く</button></div>'}window.openSettings=openSettings;window.choose=id=>{let p=operators.find(x=>x.id===id);if(p)saveCurrent(p)};$('whoBtn').onclick=()=>{$('chooser').classList.remove('hidden')};$('endBtn').onclick=()=>{if(current&&!confirm(current.name+'さんの操作を終了しますか？'))return;current=null;$('whoBtn').textContent='利用者を選択';$('chooser').classList.remove('hidden')};function renderPeople(){$('people').innerHTML=operators.length?operators.map(p=>'<div class="person '+(p.is_active?'':'inactive')+'"><div class="grow"><b>'+esc(p.name)+'</b><div class="role">'+esc(p.role)+(p.is_active?'':'・無効')+'</div></div><button class="btn gray" onclick="editPerson('+p.id+')">変更</button><button class="btn '+(p.is_active?'red':'blue')+'" onclick="togglePerson('+p.id+','+(!p.is_active)+')">'+(p.is_active?'無効化':'有効に戻す')+'</button></div>').join(''):'<div class="empty">利用者を追加してください。</div>'}$('addBtn').onclick=async()=>{let name=$('newName').value.trim();if(!name)return alert('名前を入力してください');try{await op({action:'add_operator',name,role:$('newRole').value});$('newName').value='';await loadOperators()}catch(e){alert(e.message)}};window.editPerson=async id=>{let p=operators.find(x=>x.id===id),name=prompt('名前',p.name);if(name===null)return;let role=prompt('役割（事務／承認者／営業／管理者など）',p.role);if(role===null)return;try{await op({action:'update_operator',id,name,role});await loadOperators()}catch(e){alert(e.message)}};window.togglePerson=async(id,v)=>{try{await op({action:'update_operator',id,is_active:v});if(current?.id===id&&!v){current=null;$('whoBtn').textContent='利用者を選択'}await loadOperators()}catch(e){alert(e.message)}};function jpTime(v){try{return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return v}}async function loadLogs(){try{let j=await op({action:'list_logs',limit:300}),a=j.items||[];$('logs').innerHTML=a.length?a.map(x=>{let e=x.estimate_notebook2||{},target=[e.company_name,e.product_name].filter(Boolean).join(' / ');return '<div class="log"><div class="time">'+jpTime(x.created_at)+'　'+esc(x.operator_name)+'</div><div class="action">'+esc(x.action)+'</div>'+(target?'<div class="target">'+esc(target)+'</div>':'')+(x.details?'<div class="role">'+esc(x.details)+'</div>':'')+'</div>'}).join(''):'<div class="empty">まだ履歴はありません。</div>'}catch(e){$('logs').textContent=e.message}}$('reloadLogs').onclick=loadLogs;document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===b.dataset.pane));if(b.dataset.pane==='history')loadLogs()});function actionLabel(url,b){if(url.includes('estimate-notebook2-approval')){return({submit_snapshot:'申請',approve:'承認',return:'差戻し',resubmit:'再申請',mark_quoted:'客先提出',upload_attachment:'必要資料を追加',delete_attachment:'必要資料を削除'})[b.action]||''}if(url.includes('estimate-notebook2-ai')){if(b.action==='update')return'見積内容を編集';if(b.action==='update_result')return b.status==='受注'?'受注登録':b.status==='失注'?'失注登録':'結果更新';if(b.action==='delete')return'案件削除'}return''}function details(b){if(b.action==='update_result'&&b.status==='受注')return'数量 '+(b.won_quantity??'')+' / 単価 '+(b.won_unit_price??'');if(b.action==='update_result'&&b.status==='失注')return'理由：'+(b.lost_reason||'');return''}function patchFrame(){let w=$('appFrame').contentWindow;if(!w||w.__operatorPatched)return;w.__operatorPatched=true;let original=w.fetch.bind(w);w.fetch=async function(input,init){let url=typeof input==='string'?input:(input?.url||''),body=null;try{body=init?.body?JSON.parse(init.body):null}catch{}let r=await original(input,init);try{let label=body?actionLabel(url,body):'';if(r.ok&&label&&current){op({action:'log',operator_id:current.id,operator_name:current.name,event:label,estimate_id:Number(body.id)||null,details:details(body)}).catch(()=>{})}}catch{}return r}}$('appFrame').addEventListener('load',()=>setTimeout(patchFrame,50));loadOperators().then(()=>setTimeout(patchFrame,300));</script></body></html>
