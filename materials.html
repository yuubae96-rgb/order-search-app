<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2024">
<title>材料・在庫管理</title>
<link rel="stylesheet" href="style.css">
<style>
.material-wrap{max-width:920px;margin:0 auto;padding:18px 14px 90px}.material-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.material-head h1{font-size:22px;margin:0}.material-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.material-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.material-actions{display:flex;gap:8px;flex-wrap:wrap}.material-list-item{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.09)}.material-list-item:last-child{border-bottom:0}.material-top{display:flex;justify-content:space-between;gap:10px}.material-name{font-weight:900;font-size:16px}.material-meta{font-size:12px;opacity:.7;line-height:1.6;margin-top:4px}.material-stock{font-weight:900;font-size:19px;white-space:nowrap}.material-alert{color:#ff8b8b}.material-price{font-weight:800;margin-top:5px}.material-note{font-size:12px;opacity:.7}.section-spacer{height:12px}.material-tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px;margin-bottom:12px}.material-tab{white-space:nowrap;border:1px solid rgba(255,255,255,.14);background:#262b31;color:#fff;border-radius:999px;padding:9px 13px;font-weight:700}.material-tab.active{background:#fff;color:#16191d}.material-panel{display:none}.material-panel.active{display:block}.mini-badge{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:3px 7px;background:#383f47}.mini-badge.alert{background:#6b2525;color:#ffd4d4}.history-row{display:grid;grid-template-columns:90px 65px 1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}.summary-materials{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.summary-materials .card{padding:14px}.summary-materials .n{font-size:24px;font-weight:900}.summary-materials .l{font-size:11px;opacity:.65}.auth-inline{padding:24px;text-align:center}.backlink{color:#fff;text-decoration:none;font-weight:700}.price-history{font-size:12px;line-height:1.7}
@media(max-width:700px){.material-grid,.material-grid3{grid-template-columns:1fr}.summary-materials{grid-template-columns:1fr 1fr}.summary-materials .card:last-child{grid-column:1/-1}.history-row{grid-template-columns:78px 55px 1fr}.history-row .hr-qty{grid-column:3}}
</style>
</head>
<body>
<div class="material-wrap">
  <div class="material-head"><div><h1>材料・在庫管理</h1><div class="card-sub">見積原価と共通の材料マスター</div></div><a class="backlink" href="index.html">← 見積管理</a></div>
  <div id="materialAuth" class="card auth-inline">ログイン確認中...</div>
  <div id="materialApp" style="display:none">
    <div class="summary-materials">
      <div class="card"><div class="l">登録材料</div><div class="n" id="mSumCount">0</div></div>
      <div class="card"><div class="l">発注アラート</div><div class="n" id="mSumAlert">0</div></div>
      <div class="card"><div class="l">概算在庫金額</div><div class="n" id="mSumValue">0円</div></div>
    </div>
    <div class="material-tabs">
      <button class="material-tab active" data-tab="list">在庫一覧</button>
      <button class="material-tab" data-tab="master">材料登録</button>
      <button class="material-tab" data-tab="move">入庫・出庫</button>
      <button class="material-tab" data-tab="history">履歴</button>
    </div>

    <section class="material-panel active" id="mp-list">
      <div class="card"><div class="field"><label>材料検索</label><input id="mSearch" placeholder="材料名・規格・仕入先"></div><div id="mList"></div></div>
    </section>

    <section class="material-panel" id="mp-master">
      <div class="card"><div class="card-title">材料マスター登録</div>
        <div class="material-grid">
          <div class="field"><label>材料名 必須</label><input id="mm_name" placeholder="例：SUS304 0.8"></div>
          <div class="field"><label>分類</label><input id="mm_category" placeholder="ステンレス / アルミ / 溶剤 / シール材"></div>
          <div class="field"><label>規格・グレード</label><input id="mm_spec" placeholder="SUS304 / A1050 / ユポFGS"></div>
          <div class="field"><label>厚み mm</label><input type="number" step="any" id="mm_thickness"></div>
          <div class="field"><label>幅 mm</label><input type="number" step="any" id="mm_width" placeholder="1000"></div>
          <div class="field"><label>長さ</label><input type="number" step="any" id="mm_length" placeholder="2000 または 100"></div>
          <div class="field"><label>長さ単位</label><select id="mm_length_unit"><option value="mm">mm</option><option value="m">m</option></select></div>
          <div class="field"><label>購入形態</label><input id="mm_purchase_form" placeholder="1000×2000板 / 16kg缶 / 100m巻"></div>
          <div class="field"><label>在庫単位 必須</label><input id="mm_stock_unit" placeholder="枚 / 缶 / 巻 / kg"></div>
          <div class="field"><label>1単位重量 kg</label><input type="number" step="any" id="mm_weight"></div>
          <div class="field"><label>主な仕入先</label><input id="mm_supplier"></div>
          <div class="field"><label>発注点</label><input type="number" step="any" id="mm_reorder" placeholder="5"></div>
          <div class="field"><label>保管場所</label><input id="mm_location"></div>
          <div class="field"><label>現在庫（初期登録）</label><input type="number" step="any" id="mm_initial" placeholder="18"></div>
          <div class="field"><label>現在の仕入価格</label><input type="number" step="any" id="mm_price" placeholder="12800"></div>
          <div class="field"><label>価格基準</label><select id="mm_price_basis"><option value="stock_unit">1在庫単位あたり</option><option value="kg">1kgあたり</option><option value="purchase_unit">1購入単位あたり</option></select></div>
          <div class="field"><label>価格適用日</label><input type="date" id="mm_price_date"></div>
        </div>
        <div class="field"><label>備考</label><textarea id="mm_notes"></textarea></div>
        <div class="material-actions"><button class="btn btn-primary" id="mm_save">材料を登録</button><button class="btn btn-ghost" id="mm_clear">クリア</button></div>
      </div>
    </section>

    <section class="material-panel" id="mp-move">
      <div class="card"><div class="card-title">入庫・出庫</div>
        <div class="material-grid">
          <div class="field"><label>材料</label><select id="mv_material"></select></div>
          <div class="field"><label>区分</label><select id="mv_type"><option value="in">入庫</option><option value="out">出庫</option><option value="adjust">棚卸調整</option></select></div>
          <div class="field"><label>数量</label><input type="number" step="any" id="mv_qty"></div>
          <div class="field"><label>日付</label><input type="date" id="mv_date"></div>
          <div class="field"><label>仕入先・払出先</label><input id="mv_destination" placeholder="第一工場 / ○○商事"></div>
          <div class="field"><label>今回単価（任意）</label><input type="number" step="any" id="mv_price"></div>
        </div>
        <div class="field"><label>メモ</label><textarea id="mv_memo"></textarea></div>
        <button class="btn btn-primary" id="mv_save">登録する</button>
      </div>
    </section>

    <section class="material-panel" id="mp-history"><div class="card"><div class="card-title">入出庫履歴</div><div id="mHistory"></div></div></section>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="materials.js"></script>
</body>
</html>
