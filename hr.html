<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>勤怠・給与</title><style>
:root{--ink:#111827;--muted:#64748b;--line:#e2e8f0;--bg:#f5f7fa;--blue:#2563eb;--green:#0f766e}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);margin:0;color:var(--ink)}.w{max-width:900px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px 50px}.c{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}h1,h2,h3{margin:0 0 8px}.m{font-size:13px;color:var(--muted);line-height:1.7}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:12px 8px;font-weight:800;font-size:14px}.tab.active{background:var(--ink);color:#fff}.panel{display:none}.panel.active{display:block}label{display:block;font-size:13px;font-weight:800;margin-top:10px}input,select{width:100%;padding:12px;margin-top:5px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;background:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:14px;background:var(--ink);color:#fff;font-weight:800;font-size:16px}.blue{background:var(--blue)}.green{background:var(--green)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}.stat b{display:block;font-size:24px;margin-top:4px}.skill-grid{display:grid;grid-template-columns:1fr 92px;gap:8px 10px;align-items:center;margin-top:10px}.skill-grid label{margin:0}.emp{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;display:none}.emp.show{display:block}.emp-name{font-size:25px;font-weight:900}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:800;margin-right:4px}.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.skill-chip{appearance:none;width:100%;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 7px;font-size:13px;text-align:center;color:var(--ink);cursor:pointer}.skill-chip b{font-size:20px;display:block;margin-top:2px}.skill-chip.high{background:#ecfdf5;border-color:#86efac}.skill-chip:active{transform:scale(.98)}.skill-hint{margin-top:10px;padding:9px 10px;background:#eff6ff;border-radius:10px;color:#1d4ed8;font-size:12px;font-weight:700}.edit-wrap{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.matrix-wrap{display:none;margin-top:12px}.matrix-wrap.open{display:block}.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:#fff}.matrix{border-collapse:separate;border-spacing:0;min-width:1700px;width:100%;font-size:12px}.matrix th,.matrix td{padding:9px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}.matrix th{background:#f8fafc;font-weight:900}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:#fff;text-align:left;font-weight:900}.score-high{background:#dcfce7;font-weight:900;color:#166534}.score-mid{background:#fef9c3;font-weight:800;color:#854d0e}.score-low{background:#fee2e2;color:#991b1b}.list-toggle{background:#334155}.name-link{border:0;background:none;padding:0;color:#2563eb;font:inherit;font-weight:900;text-decoration:underline}.age-display{padding:12px;margin-top:5px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc;font-size:16px}.calendar-rule{background:#fff7ed;border:1px solid #fdba74;border-radius:14px;padding:14px;line-height:1.7;font-size:14px}.cal-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.cal-summary div{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.cal-summary b{font-size:22px;display:block}.months{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.month{border:1px solid var(--line);border-radius:14px;padding:10px}.month h3{text-align:center;margin-bottom:8px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{font-size:10px;text-align:center;color:var(--muted);font-weight:800}.day{border:1px solid var(--line);border-radius:7px;background:#fff;min-height:36px;padding:3px;font-size:11px;font-weight:800}.day.work{background:#ecfdf5;color:#166534}.day.holiday{background:#fee2e2;color:#991b1b}.day.uncertain{outline:3px solid #f59e0b}.day.blank{visibility:hidden}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:10px}.status{margin-top:10px;padding:10px;border-radius:10px;background:#f8fafc;font-size:13px;white-space:pre-wrap}@media(max-width:650px){.grid2{grid-template-columns:1fr}.months{grid-template-columns:1fr}.tab{font-size:12px;padding:11px 4px}.stats,.cal-summary{grid-template-columns:1fr 1fr}.stats .stat:last-child,.cal-summary div:last-child{grid-column:1/-1}}
</style></head><body><div class="w"><div class="c"><div class="m">OFFICE / HR</div><h1>勤怠・給与</h1><div class="m">勤怠、給与、社員情報、作業能力、会社カレンダーを管理します。</div></div><div class="tabs"><button class="tab active" data-panel="work">勤怠・給与</button><button class="tab" data-panel="people">社員一覧・能力</button><button class="tab" data-panel="calendar">会社カレンダー</button></div>
<section id="work" class="panel active"><div class="c"><h2>勤怠実績</h2><label>従業員</label><select id="aemp"></select><label>日付</label><input id="date" type="date"><div class="grid2"><div><label>出勤</label><input id="cin" type="time" value="08:30"></div><div><label>退勤</label><input id="cout" type="time" value="17:00"></div></div><label>休憩（分）</label><input id="br" type="number" value="45"><button class="btn" id="addAtt">勤怠を登録</button></div><div class="c"><h2>月次給与実績</h2><label>従業員</label><select id="pemp"></select><label>対象月</label><input id="month" type="month"><label>総支給額</label><input id="gross" type="number"><label>会社負担社会保険等</label><input id="social" type="number"><label>その他会社負担</label><input id="other" type="number"><button class="btn blue" id="savePay">給与実績を労務原価へ反映</button></div></section>
<section id="people" class="panel"><div class="stats"><div class="stat"><span>社員数</span><b id="statCount">0</b><small>人</small></div><div class="stat"><span>平均年齢</span><b id="statAge">-</b><small>歳</small></div><div class="stat"><span>男女比</span><b id="statGender">-</b><small id="statGenderDetail">未入力</small></div></div><div class="c" style="margin-top:14px"><button class="btn list-toggle" id="matrixToggle">登録した社員の一覧を見る</button><div id="matrixWrap" class="matrix-wrap"><h3>社員・仕事能力一覧</h3><div class="m">名前を押すと、その社員だけの詳細・編集画面が表示されます。</div><div class="table-scroll"><table class="matrix"><thead><tr id="matrixHead"></tr></thead><tbody id="matrixBody"></tbody></table></div></div></div><div class="c" id="employeeDetailSection" style="display:none"><h2>社員詳細・編集</h2><div id="employeeList"></div></div><div class="c"><h2>社員を登録</h2><div class="grid2"><div><label>氏名</label><input id="ename"></div><div><label>部署</label><select id="dept"><option>製造</option><option>事務</option><option>営業</option><option>管理</option></select></div><div><label>性別</label><select id="gender"><option value="">未入力</option><option>男性</option><option>女性</option></select></div><div><label>誕生日</label><input id="birthDate" type="date"></div><div><label>現在の年齢</label><div id="ageDisplay" class="age-display">誕生日を入力してください</div></div><div><label>雇用形態</label><select id="employment"><option value="">未入力</option><option>正社員</option><option>パート</option><option>その他</option></select></div></div><h3 style="margin-top:18px">作業能力 1〜10</h3><div id="newSkills" class="skill-grid"></div><button class="btn green" id="addEmp">社員を登録</button></div></section>
<section id="calendar" class="panel"><div class="c"><h2>会社年間カレンダー</h2><div class="calendar-rule"><b>読み取りルール</b><br>日付に <b>○が付いている日＝休み</b>。土曜日も○あり＝休み、○なし＝出勤です。</div><div class="grid2"><div><label>対象年</label><input id="calYear" type="number"></div><div><label>年間カレンダー（写真・PDF）</label><input id="calFile" type="file" accept="image/*,application/pdf"></div></div><button class="btn blue" id="analyzeCal">AIで読み取る</button><div id="calStatus" class="status">まだ読み取っていません。</div><div class="cal-summary"><div>出勤日<b id="workCount">-</b></div><div>休日<b id="holidayCount">-</b></div><div>要確認<b id="uncertainCount">-</b></div></div><div id="calendarMonths" class="months"></div><button class="btn green" id="saveCalendar" style="display:none">この内容で年間カレンダーを確定</button></div></section></div>
<script>
const API='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/hr-direct',CAL_API='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/calendar-ai';const SKILLS=[['silk','シルク印刷'],['offset','オフセット印刷'],['label','ラベル印刷'],['press','プレス'],['anodize','アルマイト'],['bake','焼付'],['paint','塗装'],['artwork','原稿'],['new_fullcolor','新フルカラー'],['namer','ネーマ'],['etching','エッチング'],['plate_polish','板磨き'],['office','事務']];let employees=[],calendarDays=[];const now=new Date(),today=now.toISOString().slice(0,10);date.value=today;month.value=today.slice(0,7);calYear.value=now.getFullYear();function calcAge(b){if(!b)return null;const d=new Date(b+'T00:00:00');let a=now.getFullYear()-d.getFullYear(),m=now.getMonth()-d.getMonth();if(m<0||(m===0&&now.getDate()<d.getDate()))a--;return a}function displayAgeFor(e){return calcAge(e.birth_date)??e.age??null}birthDate.onchange=()=>{const a=calcAge(birthDate.value);ageDisplay.textContent=a==null?'誕生日を入力してください':a+'歳'};async function post(url,p){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||'HTTP '+r.status);return j}const callApi=p=>post(API,p);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function scoreSelect(id,val=''){let h=`<select id="${id}"><option value="">未評価</option>`;for(let i=1;i<=10;i++)h+=`<option value="${i}" ${String(val)===String(i)?'selected':''}>${i}</option>`;return h+'</select>'}function renderSkillInputs(c,p,r={}){c.innerHTML=SKILLS.map(([k,n])=>`<label>${n}</label>${scoreSelect(p+k,r[k]??'')}`).join('')}function collectSkills(p){const x={};for(const[k]of SKILLS){const v=document.getElementById(p+k)?.value;if(v)x[k]=Number(v)}return x}renderSkillInputs(newSkills,'n_');function updateStats(){statCount.textContent=employees.length;const ages=employees.map(displayAgeFor).filter(a=>a!=null);statAge.textContent=ages.length?(ages.reduce((a,b)=>a+b,0)/ages.length).toFixed(1):'-';const men=employees.filter(e=>e.gender==='男性').length,women=employees.filter(e=>e.gender==='女性').length;if(men+women){const mp=Math.round(men/(men+women)*100);statGender.textContent=`${mp}:${100-mp}`;statGenderDetail.textContent=`男性 ${men}人 / 女性 ${women}人`}else{statGender.textContent='-';statGenderDetail.textContent='未入力'}}function scoreClass(v){v=Number(v);if(!v)return'';if(v>=8)return'score-high';if(v>=4)return'score-mid';return'score-low'}function renderMatrix(){matrixHead.innerHTML='<th>氏名</th><th>性別</th><th>誕生日</th><th>年齢</th><th>部署</th><th>雇用形態</th>'+SKILLS.map(([,n])=>`<th>${n}</th>`).join('');matrixBody.innerHTML=employees.map(e=>{const r=e.skill_ratings||{},a=displayAgeFor(e);return `<tr><td><button class="name-link" onclick="openEmployeeFromMatrix(${e.id})">${esc(e.name)}</button></td><td>${esc(e.gender||'-')}</td><td>${esc(e.birth_date||'-')}</td><td>${a??'-'}</td><td>${esc(e.department||'-')}</td><td>${esc(e.employment_type||'-')}</td>${SKILLS.map(([k])=>`<td class="${scoreClass(r[k])}">${r[k]||'-'}</td>`).join('')}</tr>`}).join('')}
function renderList(){employeeDetailSection.style.display='none';employeeList.innerHTML=employees.map(e=>{const r=e.skill_ratings||{},a=displayAgeFor(e),chips=SKILLS.map(([k,n])=>`<button type="button" class="skill-chip ${r[k]>=8?'high':''}" onclick="editSkill(${e.id},'${k}')"><span>${n}</span><b>${r[k]||'-'}</b></button>`).join('');return `<div class="emp" id="emp_${e.id}"><div class="emp-name">${esc(e.name)}</div><div><span class="badge">${esc(e.department||'未設定')}</span><span class="badge">${esc(e.employment_type||'雇用形態未設定')}</span></div><div class="m">${esc(e.gender||'性別未設定')} ・ ${a!=null?a+'歳':'年齢未設定'}</div><div class="skills">${chips}</div><div class="skill-hint">作業能力の枠を押すと、その場で「未評価・1〜10」を選んで変更できます。</div><div class="edit-wrap"><div class="grid2"><div><label>氏名</label><input id="e_name_${e.id}" value="${esc(e.name)}"></div><div><label>部署</label><select id="e_dept_${e.id}">${['製造','事務','営業','管理'].map(x=>`<option ${e.department===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>性別</label><select id="e_gender_${e.id}"><option value="">未入力</option><option ${e.gender==='男性'?'selected':''}>男性</option><option ${e.gender==='女性'?'selected':''}>女性</option></select></div><div><label>誕生日</label><input id="e_birth_${e.id}" type="date" value="${e.birth_date||''}"></div><div><label>雇用形態</label><select id="e_emp_${e.id}"><option value="">未入力</option><option ${e.employment_type==='正社員'?'selected':''}>正社員</option><option ${e.employment_type==='パート'?'selected':''}>パート</option><option ${e.employment_type==='その他'?'selected':''}>その他</option></select></div></div><button class="btn green" onclick="saveEmployee(${e.id})">基本情報の変更を保存</button></div></div>`}).join('')}
window.editSkill=async(id,key)=>{const e=employees.find(x=>x.id===id);if(!e)return;const name=SKILLS.find(x=>x[0]===key)?.[1]||key,current=e.skill_ratings?.[key]??'';const v=prompt(`${name} の作業能力\n未評価は0、1〜10で入力してください。`,current||'');if(v===null)return;const n=Number(v);if(v!==''&&v!=='0'&&(!Number.isInteger(n)||n<1||n>10))return alert('0（未評価）または1〜10を入力してください');const ratings={...(e.skill_ratings||{})};if(v===''||v==='0')delete ratings[key];else ratings[key]=n;try{await callApi({action:'update_employee',id:e.id,name:e.name,department:e.department,gender:e.gender||'',birth_date:e.birth_date||'',age:displayAgeFor(e),employment_type:e.employment_type||'',skill_ratings:ratings});e.skill_ratings=ratings;renderMatrix();renderList();employeeDetailSection.style.display='block';document.getElementById('emp_'+id)?.classList.add('show');alert(`${name}を${v===''||v==='0'?'未評価':n+'段階'}に変更しました`)}catch(err){alert('エラー：'+err.message)}};window.openEmployeeFromMatrix=id=>{document.querySelectorAll('.emp').forEach(x=>x.classList.remove('show'));employeeDetailSection.style.display='block';document.getElementById('emp_'+id)?.classList.add('show');employeeDetailSection.scrollIntoView({behavior:'smooth'})};window.saveEmployee=async id=>{try{const b=document.getElementById('e_birth_'+id).value,e=employees.find(x=>x.id===id);await callApi({action:'update_employee',id,name:document.getElementById('e_name_'+id).value,department:document.getElementById('e_dept_'+id).value,gender:document.getElementById('e_gender_'+id).value,birth_date:b,age:calcAge(b),employment_type:document.getElementById('e_emp_'+id).value,skill_ratings:e.skill_ratings||{}});alert('社員情報を更新しました');await load()}catch(e){alert('エラー：'+e.message)}};async function load(){const j=await callApi({action:'list_employees'});employees=j.data||[];[aemp,pemp].forEach(s=>{s.innerHTML='<option value="">選択してください</option>';employees.forEach(e=>s.insertAdjacentHTML('beforeend',`<option value="${e.id}">${esc(e.name)}（${esc(e.department||'')}）</option>`))});updateStats();renderMatrix();renderList()}load();document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.panel).classList.add('active');if(b.dataset.panel==='calendar')loadSavedCalendar()});matrixToggle.onclick=()=>{const o=matrixWrap.classList.toggle('open');matrixToggle.textContent=o?'社員一覧を閉じる':'登録した社員の一覧を見る'};addEmp.onclick=async()=>{if(!ename.value.trim())return alert('氏名を入力してください');const b=birthDate.value;await callApi({action:'add_employee',name:ename.value,department:dept.value,gender:gender.value,birth_date:b,age:calcAge(b),employment_type:employment.value,skill_ratings:collectSkills('n_')});alert('社員を登録しました');await load()};addAtt.onclick=async()=>{if(!aemp.value)return alert('従業員を選んでください');await callApi({action:'add_attendance',employee_id:Number(aemp.value),work_date:date.value,clock_in:cin.value,clock_out:cout.value,break_minutes:Number(br.value||45)});alert('勤怠を登録しました')};savePay.onclick=async()=>{await callApi({action:'save_payroll',employee_id:Number(pemp.value),month:month.value,gross_pay:Number(gross.value||0),employer_social_cost:Number(social.value||0),employer_other_cost:Number(other.value||0)});alert('給与実績を反映しました')};
const DOW=['日','月','火','水','木','金','土'];function renderCalendar(){calendarMonths.innerHTML='';if(!calendarDays.length){workCount.textContent=holidayCount.textContent=uncertainCount.textContent='-';saveCalendar.style.display='none';return}workCount.textContent=calendarDays.filter(x=>x.day_type==='work').length;holidayCount.textContent=calendarDays.filter(x=>x.day_type==='holiday').length;uncertainCount.textContent=calendarDays.filter(x=>x.uncertain).length;const y=Number(calYear.value);for(let m=0;m<12;m++){const box=document.createElement('div');box.className='month';box.innerHTML=`<h3>${m+1}月</h3><div class="days">${DOW.map(x=>`<div class="dow">${x}</div>`).join('')}</div>`;const grid=box.querySelector('.days'),first=new Date(y,m,1).getDay();for(let i=0;i<first;i++)grid.insertAdjacentHTML('beforeend','<button class="day blank"></button>');for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,item=calendarDays.find(x=>x.date===ds),b=document.createElement('button');b.className=`day ${item?.day_type||'work'} ${item?.uncertain?'uncertain':''}`;b.innerHTML=`${d}<br><small>${item?.day_type==='holiday'?'休':'出'}</small>`;b.onclick=()=>{if(item){item.day_type=item.day_type==='holiday'?'work':'holiday';item.uncertain=false;renderCalendar()}};grid.appendChild(b)}calendarMonths.appendChild(box)}saveCalendar.style.display='block'}async function loadSavedCalendar(){try{const y=Number(calYear.value),j=await post(CAL_API,{action:'list_calendar',year:y});calendarDays=(j.data||[]).map(x=>({date:x.calendar_date,day_type:x.day_type,uncertain:false,note:x.note||''}));calStatus.textContent=calendarDays.length?`${y}年の確定済みカレンダーを読み込みました。`:'この年のカレンダーはまだありません。';renderCalendar()}catch(e){calStatus.textContent='取得エラー：'+e.message}}calYear.onchange=loadSavedCalendar;analyzeCal.onclick=async()=>{const f=calFile.files[0],y=Number(calYear.value);if(!f)return alert('ファイルを選んでください');analyzeCal.disabled=true;try{const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)}),j=await post(CAL_API,{action:'analyze',year:y,file_name:f.name,mime_type:f.type||'application/octet-stream',base64});calendarDays=j.days||[];calStatus.textContent='AI読み取り完了。違う日があれば日付を押して修正してください。';renderCalendar()}catch(e){alert(e.message)}finally{analyzeCal.disabled=false}};saveCalendar.onclick=async()=>{await post(CAL_API,{action:'save_days',year:Number(calYear.value),days:calendarDays});alert('会社年間カレンダーを保存しました')};
</script></body></html>
