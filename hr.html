<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>社長専用 勤怠・給与</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;margin:0;color:#111827}.w{max-width:650px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px 40px}.c{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin-bottom:12px}h1,h2{margin:0 0 8px}.m{font-size:13px;color:#64748b;line-height:1.7}label{display:block;font-size:13px;font-weight:800;margin-top:10px}input,select{width:100%;box-sizing:border-box;padding:12px;margin-top:5px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:14px;background:#111827;color:#fff;font-weight:800;font-size:16px}.blue{background:#2563eb}.blocked{display:none}.deny{text-align:center;padding:30px 18px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="w"><div id="gate" class="c deny">権限確認中...</div><div id="hrApp" class="blocked"><div class="c"><div style="font-size:12px;font-weight:800;color:#64748b">OWNER ONLY</div><h1>勤怠・給与</h1><div class="m">社長専用です。タイムカード確定後の勤怠と、給与確定後の会社負担額を登録し、労務原価へ反映します。</div></div><div class="c"><h2>従業員</h2><input id="ename" placeholder="氏名"><select id="dept"><option>製造</option><option>事務</option><option>営業</option><option>管理</option></select><button class="btn" id="addEmp">従業員を登録</button></div><div class="c"><h2>勤怠実績</h2><select id="aemp"></select><input id="date" type="date"><input id="cin" type="time" value="08:30"><input id="cout" type="time" value="17:00"><input id="br" type="number" value="60" placeholder="休憩分"><button class="btn" id="addAtt">勤怠を登録</button></div><div class="c"><h2>月次給与実績</h2><div class="m">給与ソフト等で確定した金額を入れます。税計算をこの画面で勝手に行いません。</div><select id="pemp"></select><input id="month" type="month"><input id="gross" type="number" placeholder="総支給額"><input id="social" type="number" placeholder="会社負担社会保険等"><input id="other" type="number" placeholder="その他会社負担"><button class="btn blue" id="savePay">給与実績を原価へ反映</button></div></div></div><script>
const db=supabase.createClient('https://vnnvuxccazkdzwqjmntz.supabase.co','sb_publishable_xG-tuBgxFGntT1vlbZzuVQ_AZ2Zl8QL');
(async()=>{const {data:{user}}=await db.auth.getUser();if(!user){gate.innerHTML='ログインが必要です。<br><br><a href="./index.html">会社アプリでログイン</a>';return;}const {data:p}=await db.from('app_users').select('role,active').eq('user_id',user.id).maybeSingle();if(p?.role!=='owner'||p?.active===false){gate.textContent='この画面は社長専用です。';return;}gate.style.display='none';hrApp.classList.remove('blocked');init();})();
function init(){const today=new Date().toISOString().slice(0,10);date.value=today;month.value=today.slice(0,7);load();}
async function load(){const {data}=await db.from('employees').select('id,name,department').eq('active',true).order('name');[aemp,pemp].forEach(s=>{s.innerHTML='<option value="">選択してください</option>';(data||[]).forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.name+'（'+(e.department||'')+'）';s.appendChild(o)})})}
addEmp.onclick=async()=>{if(!ename.value)return;const {error}=await db.from('employees').insert({name:ename.value,department:dept.value,active:true});alert(error?'エラー：'+error.message:'登録しました');ename.value='';load()};
addAtt.onclick=async()=>{if(!aemp.value||!date.value||!cin.value||!cout.value)return alert('従業員・日付・時刻を入れてください');const min=t=>{const [h,m]=t.split(':').map(Number);return h*60+m},total=Math.max(0,min(cout.value)-min(cin.value)-Number(br.value||0)),reg=Math.min(total,480),ot=Math.max(0,total-480);const {error}=await db.from('attendance_records').upsert({employee_id:Number(aemp.value),work_date:date.value,clock_in:cin.value,clock_out:cout.value,break_minutes:Number(br.value||0),regular_minutes:reg,overtime_minutes:ot,source:'owner',confirmed:true},{onConflict:'employee_id,work_date'});alert(error?'エラー：'+error.message:'勤怠を登録しました')};
savePay.onclick=async()=>{if(!pemp.value||!month.value)return alert('従業員と月を選んでください');const s=month.value+'-01',e=new Date(Number(month.value.slice(0,4)),Number(month.value.slice(5,7)),0).toISOString().slice(0,10);const {data:a}=await db.from('attendance_records').select('regular_minutes,overtime_minutes').eq('employee_id',Number(pemp.value)).gte('work_date',s).lte('work_date',e).eq('confirmed',true);const mins=(a||[]).reduce((x,y)=>x+Number(y.regular_minutes||0)+Number(y.overtime_minutes||0),0),g=Number(gross.value||0),so=Number(social.value||0),o=Number(other.value||0),tot=g+so+o,h=mins/60;const {error}=await db.from('payroll_monthly').upsert({employee_id:Number(pemp.value),payroll_month:s,regular_minutes:(a||[]).reduce((x,y)=>x+Number(y.regular_minutes||0),0),overtime_minutes:(a||[]).reduce((x,y)=>x+Number(y.overtime_minutes||0),0),gross_pay:g,employer_social_cost:so,employer_other_cost:o,total_company_cost:tot,effective_hourly_cost:h?tot/h:0,calculated_at:new Date().toISOString()},{onConflict:'employee_id,payroll_month'});alert(error?'エラー：'+error.message:'給与実績を労務原価へ反映しました')};
</script></body></html>
