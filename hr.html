<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>勤怠・給与</title><style>
:root{--ink:#111827;--muted:#64748b;--line:#e2e8f0;--bg:#f5f7fa;--blue:#2563eb;--green:#0f766e;--gold:#b7791f}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);margin:0;color:var(--ink)}.w{max-width:820px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px 50px}.c{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}h1,h2,h3{margin:0 0 8px}.m{font-size:13px;color:var(--muted);line-height:1.7}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:12px;font-weight:800;font-size:15px}.tab.active{background:var(--ink);color:#fff}.panel{display:none}.panel.active{display:block}label{display:block;font-size:13px;font-weight:800;margin-top:10px}input,select{width:100%;padding:12px;margin-top:5px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;background:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:14px;background:var(--ink);color:#fff;font-weight:800;font-size:16px}.blue{background:var(--blue)}.green{background:var(--green)}.ghost{background:#fff;color:var(--ink);border:1px solid #cbd5e1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}.stat b{display:block;font-size:24px;margin-top:4px}.skill-grid{display:grid;grid-template-columns:1fr 92px;gap:8px 10px;align-items:center;margin-top:10px}.skill-grid label{margin:0}.emp{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}.emp-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.emp-name{font-size:19px;font-weight:900}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:800;margin-right:4px}.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.skill-chip{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:7px;font-size:11px;text-align:center}.skill-chip b{font-size:16px;display:block}.skill-chip.high{background:#ecfdf5;border-color:#a7f3d0}.empty{text-align:center;color:var(--muted);padding:24px}.section-title{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.08em}.edit-wrap{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:none}.edit-wrap.open{display:block}.matrix-wrap{display:none;margin-top:12px}.matrix-wrap.open{display:block}.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:#fff}.matrix{border-collapse:separate;border-spacing:0;min-width:1500px;width:100%;font-size:12px}.matrix th,.matrix td{padding:9px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}.matrix th{background:#f8fafc;font-weight:900;position:sticky;top:0;z-index:2}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;z-index:1;background:#fff;text-align:left;font-weight:900}.matrix th:first-child{background:#f8fafc;z-index:3}.score-high{background:#dcfce7;font-weight:900;color:#166534}.score-mid{background:#fef9c3;font-weight:800;color:#854d0e}.score-low{background:#fee2e2;color:#991b1b}.matrix-note{font-size:12px;color:var(--muted);margin-top:8px}.list-toggle{background:#334155}.list-toggle.open{background:#64748b}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.grid2{grid-template-columns:1fr}.skills{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="w">
<div class="c"><div class="section-title">OFFICE / HR</div><h1>勤怠・給与</h1><div class="m">勤怠、給与、社員情報、作業能力を一つの画面で管理します。</div></div>
<div class="tabs"><button class="tab active" data-panel="work">勤怠・給与</button><button class="tab" data-panel="people">社員一覧・能力</button></div>
<section id="work" class="panel active">
<div class="c"><h2>勤怠実績</h2><label>従業員</label><select id="aemp"></select><label>日付</label><input id="date" type="date"><div class="grid2"><div><label>出勤</label><input id="cin" type="time" value="08:30"></div><div><label>退勤</label><input id="cout" type="time" value="17:00"></div></div><label>休憩（分）</label><input id="br" type="number" value="60"><button class="btn" id="addAtt">勤怠を登録</button></div>
<div class="c"><h2>月次給与実績</h2><div class="m">給与ソフト等で確定した金額を入力します。</div><label>従業員</label><select id="pemp"></select><label>対象月</label><input id="month" type="month"><label>総支給額</label><input id="gross" type="number" placeholder="円"><label>会社負担社会保険等</label><input id="social" type="number" placeholder="円"><label>その他会社負担</label><input id="other" type="number" placeholder="円"><button class="btn blue" id="savePay">給与実績を労務原価へ反映</button></div>
</section>
<section id="people" class="panel">
<div class="stats"><div class="stat"><span>社員数</span><b id="statCount">0</b><small>人</small></div><div class="stat"><span>平均年齢</span><b id="statAge">-</b><small>歳</small></div><div class="stat"><span>男女比</span><b id="statGender">-</b><small id="statGenderDetail">未入力</small></div></div>
<div class="c" style="margin-top:14px"><button class="btn list-toggle" id="matrixToggle">登録した社員の一覧を見る</button><div id="matrixWrap" class="matrix-wrap"><h3>社員・仕事能力一覧</h3><div class="m">横にスクロールすると全作業が見られます。10が熟練です。</div><div class="table-scroll"><table class="matrix"><thead><tr id="matrixHead"></tr></thead><tbody id="matrixBody"></tbody></table></div><div class="matrix-note">能力：1〜3＝薄赤、4〜7＝黄、8〜10＝緑で表示します。</div></div></div>
<div class="c"><h2>社員を登録</h2><div class="grid2"><div><label>氏名</label><input id="ename" placeholder="例）藤山"></div><div><label>部署</label><select id="dept"><option>製造</option><option>事務</option><option>営業</option><option>管理</option></select></div><div><label>性別</label><select id="gender"><option value="">未入力</option><option>男性</option><option>女性</option></select></div><div><label>年齢</label><input id="age" type="number" min="15" max="100" placeholder="例）38"></div><div><label>雇用形態</label><select id="employment"><option value="">未入力</option><option>正社員</option><option>パート</option><option>その他</option></select></div></div><h3 style="margin-top:18px">作業能力 1〜10</h3><div class="m">1＝初心者、10＝熟練。未評価は空欄のままでOKです。</div><div id="newSkills" class="skill-grid"></div><button class="btn green" id="addEmp">社員を登録</button></div>
<div class="c"><h2>社員詳細・編集</h2><div id="employeeList"></div></div>
</section>
</div><script>
const API='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/hr-direct';
const SKILLS=[['silk','シルク印刷'],['offset','オフセット印刷'],['label','ラベル印刷'],['press','プレス'],['anodize','アルマイト'],['bake','焼付'],['paint','塗装'],['artwork','原稿'],['new_fullcolor','新フルカラー'],['namer','ネーマ'],['etching','エッチング'],['plate_polish','板磨き']];
let employees=[];const today=new Date().toISOString().slice(0,10);date.value=today;month.value=today.slice(0,7);
async function callApi(payload){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j;}
function scoreSelect(id,val=''){let h=`<select id="${id}"><option value="">未評価</option>`;for(let i=1;i<=10;i++)h+=`<option value="${i}" ${String(val)===String(i)?'selected':''}>${i}</option>`;return h+'</select>'}
function renderSkillInputs(container,prefix,ratings={}){container.innerHTML=SKILLS.map(([k,n])=>`<label>${n}</label>${scoreSelect(prefix+k,ratings[k]??'')}`).join('')}
renderSkillInputs(document.getElementById('newSkills'),'n_');
function collectSkills(prefix){const x={};for(const [k] of SKILLS){const v=document.getElementById(prefix+k)?.value;if(v)x[k]=Number(v)}return x}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function updateStats(){statCount.textContent=employees.length;const ages=employees.map(e=>Number(e.age)).filter(a=>a>0);statAge.textContent=ages.length?(ages.reduce((a,b)=>a+b,0)/ages.length).toFixed(1):'-';const men=employees.filter(e=>e.gender==='男性').length,women=employees.filter(e=>e.gender==='女性').length;if(men+women){const mp=Math.round(men/(men+women)*100),wp=100-mp;statGender.textContent=`${mp}:${wp}`;statGenderDetail.textContent=`男性 ${men}人 / 女性 ${women}人`}else{statGender.textContent='-';statGenderDetail.textContent='未入力'}}
function scoreClass(v){v=Number(v);if(!v)return'';if(v>=8)return'score-high';if(v>=4)return'score-mid';return'score-low'}
function renderMatrix(){matrixHead.innerHTML='<th>氏名</th><th>性別</th><th>年齢</th><th>部署</th><th>雇用形態</th>'+SKILLS.map(([,n])=>`<th>${n}</th>`).join('');matrixBody.innerHTML=employees.length?employees.map(e=>{const r=e.skill_ratings||{};return `<tr><td>${esc(e.name)}</td><td>${esc(e.gender||'-')}</td><td>${e.age?e.age:'-'}</td><td>${esc(e.department||'-')}</td><td>${esc(e.employment_type||'-')}</td>${SKILLS.map(([k])=>`<td class="${scoreClass(r[k])}">${r[k]||'-'}</td>`).join('')}</tr>`}).join(''):'<tr><td colspan="17">まだ社員がいません</td></tr>'}
function renderList(){if(!employees.length){employeeList.innerHTML='<div class="empty">まだ社員がいません</div>';return}employeeList.innerHTML=employees.map(e=>{const r=e.skill_ratings||{};const chips=SKILLS.map(([k,n])=>{const v=r[k];return `<div class="skill-chip ${v>=8?'high':''}"><span>${n}</span><b>${v||'-'}</b></div>`}).join('');return `<div class="emp"><div class="emp-head"><div><div class="emp-name">${esc(e.name)}</div><div style="margin-top:5px"><span class="badge">${esc(e.department||'未設定')}</span><span class="badge">${esc(e.employment_type||'雇用形態未設定')}</span></div><div class="m">${esc(e.gender||'性別未設定')} ・ ${e.age?e.age+'歳':'年齢未設定'}</div></div><button class="tab" onclick="toggleEdit(${e.id})">編集</button></div><div class="skills">${chips}</div><div id="edit_${e.id}" class="edit-wrap"><div class="grid2"><div><label>氏名</label><input id="e_name_${e.id}" value="${esc(e.name)}"></div><div><label>部署</label><select id="e_dept_${e.id}">${['製造','事務','営業','管理'].map(x=>`<option ${e.department===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>性別</label><select id="e_gender_${e.id}"><option value="">未入力</option><option ${e.gender==='男性'?'selected':''}>男性</option><option ${e.gender==='女性'?'selected':''}>女性</option></select></div><div><label>年齢</label><input id="e_age_${e.id}" type="number" min="15" max="100" value="${e.age??''}"></div><div><label>雇用形態</label><select id="e_emp_${e.id}"><option value="">未入力</option><option ${e.employment_type==='正社員'?'selected':''}>正社員</option><option ${e.employment_type==='パート'?'selected':''}>パート</option><option ${e.employment_type==='その他'?'selected':''}>その他</option></select></div></div><h3 style="margin-top:14px">作業能力</h3><div id="e_skills_${e.id}" class="skill-grid"></div><button class="btn green" onclick="saveEmployee(${e.id})">変更を保存</button></div></div>`}).join('');for(const e of employees)renderSkillInputs(document.getElementById('e_skills_'+e.id),'e'+e.id+'_',e.skill_ratings||{})}
window.toggleEdit=id=>document.getElementById('edit_'+id).classList.toggle('open');
window.saveEmployee=async id=>{try{await callApi({action:'update_employee',id,name:document.getElementById('e_name_'+id).value,department:document.getElementById('e_dept_'+id).value,gender:document.getElementById('e_gender_'+id).value,age:document.getElementById('e_age_'+id).value,employment_type:document.getElementById('e_emp_'+id).value,skill_ratings:collectSkills('e'+id+'_')});alert('社員情報を更新しました');await load()}catch(e){alert('エラー：'+e.message)}};
async function load(){try{const j=await callApi({action:'list_employees'});employees=j.data||[];[aemp,pemp].forEach(s=>{s.innerHTML='<option value="">選択してください</option>';employees.forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.name+'（'+(e.department||'')+'）';s.appendChild(o)})});updateStats();renderMatrix();renderList()}catch(e){alert('社員一覧の取得エラー：'+e.message)}}load();
document.querySelectorAll('.tab[data-panel]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab[data-panel]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.panel).classList.add('active')});
matrixToggle.onclick=()=>{const open=matrixWrap.classList.toggle('open');matrixToggle.classList.toggle('open',open);matrixToggle.textContent=open?'社員一覧を閉じる':'登録した社員の一覧を見る'};
addEmp.onclick=async()=>{if(!ename.value.trim())return alert('氏名を入力してください');try{await callApi({action:'add_employee',name:ename.value,department:dept.value,gender:gender.value,age:age.value,employment_type:employment.value,skill_ratings:collectSkills('n_')});alert('社員を登録しました');ename.value='';age.value='';gender.value='';employment.value='';renderSkillInputs(document.getElementById('newSkills'),'n_');await load()}catch(e){alert('エラー：'+e.message)}};
addAtt.onclick=async()=>{if(!aemp.value||!date.value||!cin.value||!cout.value)return alert('従業員・日付・時刻を入れてください');try{await callApi({action:'add_attendance',employee_id:Number(aemp.value),work_date:date.value,clock_in:cin.value,clock_out:cout.value,break_minutes:Number(br.value||0)});alert('勤怠を登録しました')}catch(e){alert('エラー：'+e.message)}};
savePay.onclick=async()=>{if(!pemp.value||!month.value)return alert('従業員と月を選んでください');try{await callApi({action:'save_payroll',employee_id:Number(pemp.value),month:month.value,gross_pay:Number(gross.value||0),employer_social_cost:Number(social.value||0),employer_other_cost:Number(other.value||0)});alert('給与実績を労務原価へ反映しました')}catch(e){alert('エラー：'+e.message)}};
</script></body></html>
