<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>勤怠・給与</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;margin:0;color:#111827}.w{max-width:650px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px 40px}.c{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin-bottom:12px}h1,h2{margin:0 0 8px}.m{font-size:13px;color:#64748b;line-height:1.7}label{display:block;font-size:13px;font-weight:800;margin-top:10px}input,select{width:100%;box-sizing:border-box;padding:12px;margin-top:5px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:14px;background:#111827;color:#fff;font-weight:800;font-size:16px}.blue{background:#2563eb}</style></head><body><div class="w"><div class="c"><div style="font-size:12px;font-weight:800;color:#64748b">OFFICE / HR</div><h1>勤怠・給与</h1><div class="m">タイムカード確定後の勤怠と、給与確定後の会社負担額を登録します。労務原価へ自動反映されます。</div></div><div class="c"><h2>従業員</h2><input id="ename" placeholder="氏名"><select id="dept"><option>製造</option><option>事務</option><option>営業</option><option>管理</option></select><button class="btn" id="addEmp">従業員を登録</button></div><div class="c"><h2>勤怠実績</h2><select id="aemp"></select><input id="date" type="date"><input id="cin" type="time" value="08:30"><input id="cout" type="time" value="17:00"><input id="br" type="number" value="60" placeholder="休憩分"><button class="btn" id="addAtt">勤怠を登録</button></div><div class="c"><h2>月次給与実績</h2><div class="m">給与ソフト等で確定した金額を入れます。税計算をこの画面で勝手に行いません。</div><select id="pemp"></select><input id="month" type="month"><input id="gross" type="number" placeholder="総支給額"><input id="social" type="number" placeholder="会社負担社会保険等"><input id="other" type="number" placeholder="その他会社負担"><button class="btn blue" id="savePay">給与実績を原価へ反映</button></div></div><script>
const API='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/hr-direct';
const today=new Date().toISOString().slice(0,10);date.value=today;month.value=today.slice(0,7);
async function callApi(payload){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j;}
async function load(){try{const j=await callApi({action:'list_employees'});[aemp,pemp].forEach(s=>{s.innerHTML='<option value="">選択してください</option>';(j.data||[]).forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.name+'（'+(e.department||'')+'）';s.appendChild(o)})})}catch(e){alert('従業員一覧の取得エラー：'+e.message)}}load();
addEmp.onclick=async()=>{if(!ename.value)return;try{await callApi({action:'add_employee',name:ename.value,department:dept.value});alert('登録しました');ename.value='';load()}catch(e){alert('エラー：'+e.message)}};
addAtt.onclick=async()=>{if(!aemp.value||!date.value||!cin.value||!cout.value)return alert('従業員・日付・時刻を入れてください');try{await callApi({action:'add_attendance',employee_id:Number(aemp.value),work_date:date.value,clock_in:cin.value,clock_out:cout.value,break_minutes:Number(br.value||0)});alert('勤怠を登録しました')}catch(e){alert('エラー：'+e.message)}};
savePay.onclick=async()=>{if(!pemp.value||!month.value)return alert('従業員と月を選んでください');try{await callApi({action:'save_payroll',employee_id:Number(pemp.value),month:month.value,gross_pay:Number(gross.value||0),employer_social_cost:Number(social.value||0),employer_other_cost:Number(other.value||0)});alert('給与実績を労務原価へ反映しました')}catch(e){alert('エラー：'+e.message)}};
</script></body></html>
