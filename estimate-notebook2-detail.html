<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c2024"><title>見積詳細</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#17212b;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dce3e8;border-radius:16px;padding:16px;margin:12px 0}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;font-size:15px}.green{background:#18794e;color:#fff}.gray{background:#e9eef2;color:#24323d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.field{margin:9px 0;min-width:0}.field.full,.section{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:800;color:#5b6873;margin-bottom:5px}input,textarea,select{width:100%;padding:11px;border:1px solid #cfd8df;border-radius:10px;font-size:16px;background:#fff}textarea{min-height:80px}.section{font-weight:900;margin:16px 0 4px;padding-top:12px;border-top:1px solid #e5eaee}.priceRow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px;margin:7px 0}.remove{border:0;border-radius:8px;background:#fde2e0;color:#9d2018;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.loading{padding:30px;text-align:center;font-weight:900}.error{background:#fff0ef;border:1px solid #f0b9b4;padding:12px;border-radius:10px;color:#8a241b}@media(max-width:620px){.wrap{padding:10px}.grid{grid-template-columns:1fr 1fr;gap:0 8px}.priceRow{grid-template-columns:1fr 1fr 1fr}.priceRow .remove{grid-column:1/-1;padding:8px}}</style></head><body><div class="wrap"><div class="top"><h1 style="font-size:23px;margin:6px 0">見積詳細・編集</h1><button class="btn gray" onclick="history.back()">保管庫へ戻る</button></div><div id="loading" class="card loading">読み込み中…</div><div id="error" class="card error" style="display:none"></div><div id="card" class="card" style="display:none"><div id="body"></div><div class="actions"><button id="saveBtn" class="btn green">変更を保存</button><button class="btn gray" onclick="history.back()">キャンセル</button></div></div></div><script>const EDIT_FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-edit';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));let id=Number(new URLSearchParams(location.search).get('id'));async function api(b){const r=await fetch(EDIT_FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw Error(j.error||'処理に失敗しました');return j}function f(k,label,v,type='text',full=false){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label>'+(type==='textarea'?'<textarea id="f_'+k+'">'+esc(v??'')+'</textarea>':'<input id="f_'+k+'" type="'+type+'" value="'+esc(v??'')+'"></div>'}function addPrice(p={}){const d=document.createElement('div');d.className='priceRow';d.innerHTML='<input class="q" type="number" placeholder="数量" value="'+esc(p.quantity??'')+'"><input class="u" type="number" placeholder="単価" value="'+esc(p.unit_price??'')+'"><input class="a" type="number" placeholder="金額" value="'+esc(p.amount??'')+'"><button class="remove" onclick="this.parentElement.remove()">行削除</button>';$('prices').appendChild(d)}async function load(){try{if(!id)throw Error('案件IDがありません');const j=await api({action:'get',id}),x=j.item,prices=(x.estimate_notebook2_prices||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));$('body').innerHTML='<div class="grid">'+f('company_name','会社名',x.company_name,'text',true)+f('product_name','図番・製品名',x.product_name,'text',true)+f('customer_department','客先部署',x.customer_department)+f('customer_name','客先名',x.customer_name)+f('material','材質',x.material)+f('thickness','板厚',x.thickness)+f('width','横サイズ',x.width,'number')+f('height','縦サイズ',x.height,'number')+f('color_text','色',x.color_text)+f('manufacturing_method','製作方法',x.manufacturing_method)+f('delivery_text','納期',x.delivery_text)+f('person_in_charge','担当者',x.person_in_charge)+'<div class="section">数量別単価</div><div class="field full"><div id="prices"></div><button class="btn gray" onclick="addPrice()">＋ 数量行を追加</button></div>'+f('plate_fee','原版代',x.plate_fee,'number')+f('notes','備考',x.notes,'textarea',true)+'<div class="section">受注・失注結果</div><div class="field"><label>結果</label><select id="status"><option '+((x.status||'回答待ち')==='回答待ち'?'selected':'')+'>回答待ち</option><option '+(x.status==='受注'?'selected':'')+'>受注</option><option '+(x.status==='失注'?'selected':'')+'>失注</option></select></div>'+f('result_date','結果日',x.result_date||'','date')+f('won_quantity','受注数量',x.won_quantity,'number')+f('won_unit_price','受注単価',x.won_unit_price,'number')+f('lost_reason','失注理由',x.lost_reason,'text',true)+f('result_note','理由・結果メモ',x.result_note,'textarea',true)+'</div>';prices.forEach(addPrice);if(!prices.length)addPrice({});$('loading').style.display='none';$('card').style.display='block'}catch(e){$('loading').style.display='none';$('error').style.display='block';$('error').textContent=e.message}}$('saveBtn').onclick=async()=>{const get=k=>$('f_'+k)?.value??'';const item={company_name:get('company_name'),product_name:get('product_name'),customer_department:get('customer_department'),customer_name:get('customer_name'),material:get('material'),thickness:get('thickness'),width:get('width'),height:get('height'),color_text:get('color_text'),manufacturing_method:get('manufacturing_method'),delivery_text:get('delivery_text'),person_in_charge:get('person_in_charge'),plate_fee:get('plate_fee'),notes:get('notes'),status:$('status').value,result_date:get('result_date'),won_quantity:get('won_quantity'),won_unit_price:get('won_unit_price'),lost_reason:get('lost_reason'),result_note:get('result_note'),prices:[...document.querySelectorAll('.priceRow')].map(r=>({quantity:r.querySelector('.q').value||null,unit_price:r.querySelector('.u').value||null,amount:r.querySelector('.a').value||null}))};try{$('saveBtn').disabled=true;$('saveBtn').textContent='保存中…';await api({action:'update',id,item});alert('変更を保存しました');history.back()}catch(e){alert(e.message)}finally{$('saveBtn').disabled=false;$('saveBtn').textContent='変更を保存'}};load();</script></body></html>
