<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c2024"><title>見積詳細・承認</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#17212b;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.card{background:#fff;border:1px solid #dce3e8;border-radius:16px;padding:15px;margin:11px 0}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;font-size:14px}.green{background:#18794e;color:#fff}.blue{background:#145ea8;color:#fff}.red{background:#b42318;color:#fff}.gray{background:#e9eef2;color:#24323d}.outline{background:#fff;border:1px solid #cbd5dc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 9px}.field{margin:8px 0;min-width:0}.full,.section{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:800;color:#5b6873;margin-bottom:4px}input,textarea,select{width:100%;padding:10px;border:1px solid #cfd8df;border-radius:10px;font-size:16px;background:#fff}textarea{min-height:76px}.section{font-weight:900;margin:14px 0 3px;padding-top:10px;border-top:1px solid #e5eaee}.priceRow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin:6px 0}.remove{border:0;border-radius:8px;background:#fde2e0;color:#9d2018;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}.flow{border-radius:12px;padding:12px;font-size:14px;font-weight:800;line-height:1.5}.apply{background:#f0ebff;color:#5433a8}.returned{background:#fff1ef;color:#9d2018}.approved{background:#e9f4ff;color:#125a9c}.submitted{background:#effbf5;color:#11623e}.snapshot{background:#f7f8fa;border:1px dashed #cbd5dc;border-radius:11px;padding:11px;font-size:13px;line-height:1.6;margin-top:9px}.note{font-size:13px;margin-top:6px}.error{background:#fff0ef;color:#8a241b}@media(max-width:620px){.grid{grid-template-columns:1fr 1fr}.priceRow{grid-template-columns:1fr 1fr 1fr}.priceRow .remove{grid-column:1/-1;padding:7px}}
</style></head><body><div class="wrap"><div class="top"><h1 style="font-size:22px;margin:5px 0">見積詳細・承認</h1><button class="btn gray" id="backBtn">保管庫へ戻る</button></div><div id="loading" class="card" style="text-align:center;font-weight:900">読み込み中…</div><div id="error" class="card error hidden"></div><div id="flowCard" class="card hidden"></div><div id="card" class="card hidden"><div id="form" class="grid"></div><div class="actions"><button id="saveBtn" class="btn green">変更を保存</button><span id="flowActions"></span><button class="btn gray" id="cancelBtn">戻る</button></div></div></div>
<script>
(function(){'use strict';
const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-ai',AFN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-approval';
const id=Number(new URLSearchParams(location.search).get('id')),$=x=>document.getElementById(x);let data=null;
function back(){location.href='estimate-notebook2.html?v=5'}$('backBtn').onclick=back;$('cancelBtn').onclick=back;
async function api(url,b){let r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),t=await r.text(),j;try{j=JSON.parse(t)}catch{throw Error('サーバーの返答を読み取れませんでした')}if(!r.ok)throw Error(j.error||'処理失敗');return j}
function addField(k,l,v,type='text',full=false){let b=document.createElement('div');b.className='field'+(full?' full':'');let lab=document.createElement('label');lab.textContent=l;b.appendChild(lab);let e=type==='textarea'?document.createElement('textarea'):document.createElement('input');if(e.tagName==='INPUT')e.type=type;e.id='f_'+k;e.value=v??'';b.appendChild(e);$('form').appendChild(b)}
function section(t){let d=document.createElement('div');d.className='section';d.textContent=t;$('form').appendChild(d)}
function addPrice(p={}){let r=document.createElement('div');r.className='priceRow';['quantity','unit_price','amount'].forEach((k,i)=>{let e=document.createElement('input');e.type='number';e.className=['q','u','a'][i];e.placeholder=['数量','単価','金額'][i];e.value=p[k]??'';r.appendChild(e)});let b=document.createElement('button');b.type='button';b.className='remove';b.textContent='行削除';b.onclick=()=>r.remove();r.appendChild(b);$('prices').appendChild(r)}
function flowName(x){return x.workflow_status||'提出済み'}
function snapshotHtml(x){let s=x.submitted_snapshot;if(!s)return'';let ps=Array.isArray(s.estimate_notebook2_prices)?s.estimate_notebook2_prices:[],rows=ps.map(p=>`${p.quantity??''}枚 @${p.unit_price??''}円`).join(' / ');return '<div class="snapshot"><b>申請時の内容</b><br>数量別単価：'+(rows||'なし')+'<br>原版代：'+(s.plate_fee??0)+'円</div>'}
function renderFlow(x){let st=flowName(x),cls=st==='申請中'?'apply':st==='差戻し'?'returned':st==='承認済み'?'approved':'submitted',txt=st;if(st==='申請中')txt='申請中：決裁者の確認待ち';if(st==='差戻し')txt='差戻し：修正して再申請してください';if(st==='承認済み')txt='承認済み：担当者が客先へ見積提出できます';if(st==='提出済み')txt='客先提出済み：回答待ち／受注／失注を管理';$('flowCard').className='card';$('flowCard').innerHTML='<div class="flow '+cls+'">'+txt+'</div>'+(x.approval_note?'<div class="note"><b>承認・差戻しメモ：</b>'+String(x.approval_note)+'</div>':'')+snapshotHtml(x);$('flowCard').classList.remove('hidden');let a='';if(st==='申請中')a='<button class="btn blue" id="approveBtn">承認する</button><button class="btn red" id="returnBtn">差戻す</button>';if(st==='差戻し')a='<button class="btn blue" id="resubmitBtn">再申請する</button>';if(st==='承認済み')a='<button class="btn blue" id="quotedBtn">客先へ提出した</button>';$('flowActions').innerHTML=a;if($('approveBtn'))$('approveBtn').onclick=approve;if($('returnBtn'))$('returnBtn').onclick=returnIt;if($('resubmitBtn'))$('resubmitBtn').onclick=resubmit;if($('quotedBtn'))$('quotedBtn').onclick=quoted}
function render(x){data=x;$('form').innerHTML='';addField('company_name','会社名',x.company_name,'text',true);addField('product_name','図番・製品名',x.product_name,'text',true);addField('customer_department','客先部署',x.customer_department);addField('customer_name','客先名',x.customer_name);addField('material','材質',x.material);addField('thickness','板厚',x.thickness);addField('width','横サイズ',x.width,'number');addField('height','縦サイズ',x.height,'number');addField('color_text','色',x.color_text);addField('manufacturing_method','製作方法',x.manufacturing_method);addField('delivery_text','納期',x.delivery_text);addField('person_in_charge','担当者',x.person_in_charge);section('数量別単価');let pb=document.createElement('div');pb.className='field full';pb.innerHTML='<div id="prices"></div><button type="button" class="btn gray" id="addPrice">＋ 数量行を追加</button>';$('form').appendChild(pb);let ps=(x.estimate_notebook2_prices||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));ps.length?ps.forEach(addPrice):addPrice({});$('addPrice').onclick=()=>addPrice({});addField('plate_fee','原版代',x.plate_fee,'number');addField('notes','備考',x.notes,'textarea',true);
if(flowName(x)==='提出済み'){section('受注・失注結果');let b=document.createElement('div');b.className='field';b.innerHTML='<label>結果</label><select id="status"><option>回答待ち</option><option>受注</option><option>失注</option></select>';$('form').appendChild(b);$('status').value=x.status||'回答待ち';addField('result_date','結果日',x.result_date||'','date');addField('won_quantity','受注数量',x.won_quantity,'number');addField('won_unit_price','受注単価',x.won_unit_price,'number');addField('lost_reason','失注理由',x.lost_reason,'text',true);addField('result_note','理由・結果メモ',x.result_note,'textarea',true)}
renderFlow(x);$('loading').classList.add('hidden');$('card').classList.remove('hidden')}
function val(k){let e=$('f_'+k);return e?e.value:''}
async function save(silent=false){let item={company_name:val('company_name'),product_name:val('product_name'),customer_department:val('customer_department'),customer_name:val('customer_name'),material:val('material'),thickness:val('thickness'),width:val('width'),height:val('height'),color_text:val('color_text'),manufacturing_method:val('manufacturing_method'),delivery_text:val('delivery_text'),person_in_charge:val('person_in_charge'),plate_fee:val('plate_fee'),notes:val('notes'),status:$('status')?$('status').value:(data.status||'回答待ち'),result_date:val('result_date'),won_quantity:val('won_quantity'),won_unit_price:val('won_unit_price'),lost_reason:val('lost_reason'),result_note:val('result_note'),prices:[...document.querySelectorAll('.priceRow')].map(r=>({quantity:r.querySelector('.q').value||null,unit_price:r.querySelector('.u').value||null,amount:r.querySelector('.a').value||null}))};await api(FN,{action:'update',id,item});if(!silent)alert('変更を保存しました')}
$('saveBtn').onclick=async()=>{try{$('saveBtn').disabled=true;await save()}catch(e){alert(e.message)}finally{$('saveBtn').disabled=false}};
async function approve(){try{await save(true);let n=prompt('承認メモ（なければ空欄）','');if(n===null)return;await api(AFN,{action:'approve',id,note:n});alert('承認しました');back()}catch(e){alert(e.message)}}
async function returnIt(){let n=prompt('差戻し理由を入力してください','');if(n===null)return;try{await api(AFN,{action:'return',id,note:n});alert('差戻しました');back()}catch(e){alert(e.message)}}
async function resubmit(){try{await save(true);await api(AFN,{action:'resubmit',id});alert('再申請しました');back()}catch(e){alert(e.message)}}
async function quoted(){if(!confirm('客先へ見積を提出済みにしますか？'))return;try{await api(AFN,{action:'mark_quoted',id});alert('回答待ちへ移しました');back()}catch(e){alert(e.message)}}
(async()=>{try{if(!id)throw Error('案件IDがありません');let j=await api(FN,{action:'get',id});render(j.item)}catch(e){$('loading').classList.add('hidden');$('error').textContent=e.message;$('error').classList.remove('hidden')}})();
})();
</script></body></html>
