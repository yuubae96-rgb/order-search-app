<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>見積一括申請</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f6f8;color:#17212b}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.card{background:#fff;border:1px solid #dce3e8;border-radius:16px;padding:14px;margin:12px 0}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:900}.blue{background:#145ea8;color:#fff}.gray{background:#e9eef2;color:#24323d}.green{background:#18794e;color:#fff}.red{background:#b42318;color:#fff}.progress{padding:14px;border-radius:12px;background:#eef5ff;font-weight:900;margin-top:10px}.item{border-top:1px solid #e8edf0;padding:14px 0}.item:first-child{border-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:900;color:#5c6872;margin-bottom:4px}input,textarea{width:100%;padding:9px;border:1px solid #cfd8df;border-radius:9px;font-size:15px}textarea{min-height:60px}.prices{font-size:13px;line-height:1.6;background:#f8fafb;border-radius:9px;padding:8px}.status{font-size:12px;font-weight:900}.ok{color:#11623e}.ng{color:#b42318}.hidden{display:none!important}.footer{position:sticky;bottom:0;background:rgba(244,246,248,.94);padding:10px 0}.note{font-size:12px;color:#687681;line-height:1.5}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="top"><h1 style="font-size:24px">複数ページPDF 一括見積申請</h1><button class="btn gray" onclick="location.href='estimate-notebook2-core.html?v=4'">TOP保管庫へ戻る</button></div><div class="card"><b>スキャナーで複数枚を1つのPDFにして、そのまま選択してください。</b><div class="note">最大20ページ。AIは1ページずつ順番に読み取ります。途中で失敗しても、読めたページは残ります。</div><input id="pdf" type="file" accept="application/pdf" style="margin-top:10px"><button id="start" class="btn blue" style="margin-top:10px">一括AI読み取り</button><button id="archiveOnly" class="btn gray" style="margin-top:10px;margin-left:8px">原本画像を保管するだけ</button><div id="progress" class="progress hidden"></div></div><div class="card hidden" id="results"><div class="top"><h2 style="margin:0">読取結果</h2><span id="summary"></span></div><div id="items"></div></div><div class="footer hidden" id="footer"><button id="submitAll" class="btn green" style="width:100%">未申請分をまとめて申請</button></div></div><script>const BFN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-batch',FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-ai',AFN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-approval',ARFN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/estimate-notebook2-archive';let rows=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');async function api(url,b){let r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),t=await r.text(),j;try{j=JSON.parse(t)}catch{throw Error('サーバーの返答を読み取れませんでした')}if(!r.ok)throw Error(j.error||'処理失敗');return j}function b64(f){return new Promise((ok,ng)=>{let r=new FileReader;r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ng;r.readAsDataURL(f)})}function operatorName(){try{let o=parent&&parent!==window&&typeof parent.getCurrentOperator==='function'?parent.getCurrentOperator():null;return o&&o.name?String(o.name):''}catch{return''}}function priceText(p){return (p||[]).map(x=>(x.quantity??'')+'枚 @'+(x.unit_price??'')+'円').join(' / ')||'なし'}function render(){let ok=rows.filter(x=>x.parsed).length,done=rows.filter(x=>x.submitted).length;$('summary').textContent=ok+'件読取 / '+done+'件申請済み';$('items').innerHTML=rows.map((r,i)=>'<div class="item"><div class="top"><b>'+r.page+'ページ目</b><span class="status '+(r.error?'ng':'ok')+'">'+(r.error?'読取失敗':r.submitted?'申請済み':'確認待ち')+'</span></div>'+(r.error?'<div class="ng" style="margin:8px 0">'+esc(r.error)+'</div><button class="btn gray" onclick="retry('+i+')">このページだけ再読取</button>':form(r,i))+'</div>').join('');$('results').classList.remove('hidden');$('footer').classList.remove('hidden')}function form(r,i){let p=r.parsed||{};return '<div class="grid" style="margin-top:10px"><div class="full"><label>会社名</label><input data-i="'+i+'" data-k="company_name" value="'+esc(p.company_name)+'"></div><div class="full"><label>図番・製品名</label><input data-i="'+i+'" data-k="product_name" value="'+esc(p.product_name)+'"></div><div><label>材質</label><input data-i="'+i+'" data-k="material" value="'+esc(p.material)+'"></div><div><label>板厚</label><input data-i="'+i+'" data-k="thickness" value="'+esc(p.thickness)+'"></div><div><label>担当者</label><input data-i="'+i+'" data-k="person_in_charge" value="'+esc(p.person_in_charge)+'"></div><div><label>原版代</label><input type="number" data-i="'+i+'" data-k="plate_fee" value="'+esc(p.plate_fee??'')+'"></div><div class="full"><label>数量別単価</label><div class="prices">'+esc(priceText(p.prices))+'</div></div><div class="full"><label>備考</label><textarea data-i="'+i+'" data-k="notes">'+esc(p.notes)+'</textarea></div><div><label>承認希望期限</label><input type="date" data-i="'+i+'" data-k="approval_due_date"></div><div><label>図面・メールなど必要資料</label><input type="file" multiple data-support="'+i+'"></div></div>'}function sync(){document.querySelectorAll('[data-i][data-k]').forEach(e=>{let i=Number(e.dataset.i),k=e.dataset.k;if(k==='approval_due_date')rows[i].approval_due_date=e.value;else rows[i].parsed[k]=e.value})}async function analyzeOne(i){let r=rows[i];try{let j=await api(BFN,{action:'analyze_page',file_name:r.file_name,base64:r.base64});r.parsed=j.parsed;r.source_file_path=j.source_file_path;r.source_file_name=j.source_file_name;r.ai_raw=j.ai_raw;r.error=''}catch(e){r.error=e.message}render()}window.retry=async i=>{await analyzeOne(i)};$('archiveOnly').onclick=async()=>{let f=$('pdf').files[0];if(!f)return alert('PDFを選択してください');if(!confirm('このPDFはAIで読み取らず、原本だけ見積保管庫へ保管しますか？'))return;try{$('archiveOnly').disabled=true;$('archiveOnly').textContent='保管中…';await api(ARFN,{file_name:f.name,mime_type:f.type||'application/pdf',base64:await b64(f),person_in_charge:operatorName()});alert('原本PDFを見積保管庫に保管しました');$('pdf').value=''}catch(e){alert(e.message)}finally{$('archiveOnly').disabled=false;$('archiveOnly').textContent='原本画像を保管するだけ'}};$('start').onclick=async()=>{let f=$('pdf').files[0];if(!f)return alert('PDFを選択してください');try{$('start').disabled=true;$('progress').classList.remove('hidden');$('progress').textContent='PDFをページごとに分割中…';let j=await api(BFN,{action:'split',file_name:f.name,base64:await b64(f)});rows=j.pages.map(x=>({...x,parsed:null,error:'',submitted:false}));render();for(let i=0;i<rows.length;i++){$('progress').textContent='AI読み取り中 '+(i+1)+' / '+rows.length+' ページ';await analyzeOne(i)}$('progress').textContent='読み取り完了：'+rows.filter(x=>x.parsed).length+' / '+rows.length+'ページ'}catch(e){alert(e.message)}finally{$('start').disabled=false}};async function uploadFiles(id,i){let el=document.querySelector('[data-support="'+i+'"]'),fs=[...(el?.files||[])];if(!fs.length)throw Error((i+1)+'ページ目：必要資料を添付してください');for(const f of fs){if(f.size>8*1024*1024)throw Error(f.name+' は8MBを超えています');await api(AFN,{action:'upload_attachment',id,file_name:f.name,mime_type:f.type||'application/octet-stream',file_kind:'承認資料',base64:await b64(f)})}}async function submitOne(i){let r=rows[i];if(!r.parsed||r.submitted)return;let due=r.approval_due_date;if(!due)throw Error((i+1)+'ページ目：承認希望期限を入力してください');let j=await api(FN,{action:'confirm',parsed:r.parsed,source_file_path:r.source_file_path,source_file_name:r.source_file_name,ai_raw:r.ai_raw});await uploadFiles(j.id,i);await api(AFN,{action:'submit_snapshot',id:j.id,approval_due_date:due});r.submitted=true;render()}$('submitAll').onclick=async()=>{sync();let targets=rows.map((r,i)=>({r,i})).filter(x=>x.r.parsed&&!x.r.submitted);if(!targets.length)return alert('申請できる案件がありません');if(!confirm(targets.length+'件をまとめて申請しますか？'))return;try{$('submitAll').disabled=true;for(let n=0;n<targets.length;n++){$('submitAll').textContent='申請中 '+(n+1)+' / '+targets.length;await submitOne(targets[n].i)}alert('一括申請が完了しました')}catch(e){alert(e.message)}finally{$('submitAll').disabled=false;$('submitAll').textContent='未申請分をまとめて申請'}};</script></body></html>
