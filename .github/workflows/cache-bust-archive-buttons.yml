name: Cache bust archive buttons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-archive-buttons.yml'
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[archive-cache-bust]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('estimate-notebook2.html')
          s=p.read_text()
          s=s.replace('estimate-notebook2-core.html?v=20260823-ownerdelete','estimate-notebook2-core.html?v=20260823-archive1')
          s=s.replace('estimate-notebook2-batch.html?v=20260823-1','estimate-notebook2-batch.html?v=20260823-archive1')
          s=s.replace("$('appFrame').src='estimate-notebook2-core.html?v=20260823-ownerdelete'","$('appFrame').src='estimate-notebook2-core.html?v=20260823-archive1'")
          p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "OpenAI"
          git config user.email "actions@users.noreply.github.com"
          git add estimate-notebook2.html
          git commit -m "Cache bust archive-only buttons [archive-cache-bust]"
          git push
