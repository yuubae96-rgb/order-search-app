<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>給与計算下書き</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;margin:0;color:#111827}.w{max-width:780px;margin:auto;padding:22px 16px 48px}.c{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin-bottom:14px}h1,h2{margin:0 0 8px}.m{font-size:13px;color:#64748b;line-height:1.7}.back{display:inline-block;margin-bottom:12px;color:#2563eb;text-decoration:none;font-weight:800}.links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.link{display:block;text-align:center;padding:12px;border-radius:12px;background:#fff;border:1px solid #cbd5e1;color:#111827;text-decoration:none;font-weight:800;font-size:13px}label{display:block;font-size:13px;font-weight:800;margin-top:12px}input,select{width:100%;box-sizing:border-box;padding:12px;margin-top:5px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;background:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:14px;background:#2563eb;color:#fff;font-weight:800;font-size:16px}.status{margin-top:12px;padding:12px;border-radius:12px;background:#f8fafc;white-space:pre-wrap;font-size:13px}.warn{background:#fff7ed;border:1px solid #fdba74;padding:12px;border-radius:12px;font-size:13px;line-height:1.7;white-space:pre-wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{border:1px solid #e2e8f0;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:22px}.money{font-size:20px;font-weight:900}.paybox{background:#eff6ff;border:1px solid #93c5fd;border-radius:14px;padding:14px;margin-top:14px}.payline{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #dbeafe}.payline:last-child{border:0}.minus{color:#b91c1c}.table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}.table th,.table td{border-bottom:1px solid #e2e8f0;padding:8px;text-align:left}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#e2e8f0;font-size:11px}.sat{background:#fef3c7;color:#92400e}.abs{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}@media(max-width:620px){.grid2,.links{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}</style></head><body><div class="w"><a class="back" href="./hr.html">← 勤怠・給与へ戻る</a><div class="c"><h1>給与計算下書き</h1><div class="m">正社員は日給月給、パートは時給として、年間カレンダー・タイムカード・欠務届・給与ルールを照合します。</div><div class="links"><a class="link" href="./attendance-import.html">タイムカード・欠務届</a><a class="link" href="./payroll-rules.html">給与ルール</a><a class="link" href="./employee-pay-settings.html">社員別給与設定</a></div></div><div class="c"><div class="grid2"><div><label>社員</label><select id="employee"></select></div><div><label>支給対象月</label><input id="month" type="month"></div></div><button class="btn" id="calc">この社員の給与下書きを作る</button><div id="status" class="status">社員と月を選んでください。</div></div><div id="result" class="c" style="display:none"><h2 id="title"></h2><div id="period" class="m"></div><div class="stats"><div class="stat"><span>所定出勤日</span><b id="scheduled">0</b></div><div class="stat"><span>実出勤日</span><b id="attended">0</b></div><div class="stat"><span>欠勤等</span><b id="absent">0</b></div></div><div class="stats"><div class="stat"><span>有休</span><b id="paid">0</b></div><div class="stat"><span>土曜70%</span><b id="satabs">0</b></div><div class="stat"><span>皆勤</span><b id="perfect">-</b></div></div><h2 style="margin-top:18px">給与の下書き</h2><div class="paybox"><div class="payline"><span>給与区分</span><b id="wageType">未設定</b></div><div class="payline"><span>基礎給与</span><b id="basePay">-</b></div><div class="payline"><span>通常欠勤控除</span><b class="minus" id="absenceDeduction">-</b></div><div class="payline"><span>遅刻・早退・外出控除</span><b class="minus" id="timeDeduction">-</b></div><div class="payline"><span>土曜70%調整</span><b class="minus" id="satAdjustment">-</b></div><div class="payline"><span>残業・時給分</span><b id="overtimePay">-</b></div><div class="payline"><span>手当合計</span><b id="allowanceTotal">0円</b></div><div class="payline"><span>現在計算できる支給額</span><b class="money" id="provisionalGross">-</b></div></div><div class="m" id="roundingInfo" style="margin-top:8px"></div><h2 style="margin-top:18px">手当</h2><div>食費手当　<span class="money" id="meal">0円</span></div><div>皆勤手当　<span class="money" id="perfectMoney">0円</span></div><div>交通費　<span class="money" id="transport">0円</span></div><div id="warning" class="warn" style="margin-top:14px"></div><h2 style="margin-top:18px">日別確認</h2><div style="overflow-x:auto"><table class="table"><thead><tr><th>日付</th><th>状態</th><th>出勤</th><th>退勤</th></tr></thead><tbody id="daily"></tbody></table></div></div></div><script>const HR='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/hr-direct',CALC='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/payroll-calc';let employees=[];const now=new Date();month.value=now.toISOString().slice(0,7);async function post(url,p){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function yen(n){return n==null?'-':Math.round(Number(n||0)).toLocaleString('ja-JP')+'円'}function minusYen(n){return n==null?'-':'−'+yen(Math.abs(Number(n||0)))}async function load(){try{const j=await post(HR,{action:'list_employees'});employees=j.data||[];employee.innerHTML='<option value="">選択してください</option>'+employees.map(e=>`<option value="${e.id}">${esc(e.name)}（${esc(e.department||'')}・${esc(e.employment_type||'未設定')}）</option>`).join('')}catch(e){status.textContent='社員一覧の取得エラー：'+e.message}}function tagClass(s){if(s.includes('土曜'))return'sat';if(s.includes('欠勤')||s.includes('打刻なし'))return'abs';if(s.includes('出勤')||s.includes('有休'))return'ok';return''}calc.onclick=async()=>{if(!employee.value||!month.value)return alert('社員と支給対象月を選んでください');try{calc.disabled=true;status.textContent='年間カレンダー・勤怠・欠務届・給与ルールを照合しています…';const j=await post(CALC,{action:'calculate',employee_id:Number(employee.value),month:month.value}),d=j.data;result.style.display='block';title.textContent=d.employee.name+' / '+d.month+'支給分';period.textContent=`給与対象期間：${d.period_start} 〜 ${d.period_end}`;scheduled.textContent=d.scheduled_work_days;attended.textContent=d.attendance_days;absent.textContent=d.absence_days;paid.textContent=d.paid_leave_days;satabs.textContent=d.saturday_absence_days;perfect.textContent=d.perfect_attendance_eligible?'対象':'対象外';meal.textContent=yen(d.meal_allowance);perfectMoney.textContent=yen(d.perfect_attendance_allowance);transport.textContent=yen(d.transportation_allowance);allowanceTotal.textContent=yen(d.allowance_total);wageType.textContent=d.wage_type==='daily_monthly'?'日給月給':d.wage_type==='hourly'?'時給':'未設定';basePay.textContent=yen(d.base_pay_reference);absenceDeduction.textContent=minusYen(d.absence_deduction);timeDeduction.textContent=minusYen(d.time_deduction);satAdjustment.textContent=d.saturday_adjustment==null?'-':yen(d.saturday_adjustment);overtimePay.textContent=yen(d.overtime_base_pay);provisionalGross.textContent=yen(d.provisional_gross);roundingInfo.textContent=`通常勤務は8:30〜17:00、昼休み12:00〜12:45。遅刻・早退・外出・残業の端数は${d.time_rounding_minutes||30}分未満切り捨てで計算。`;warning.textContent=d.warning||'';daily.innerHTML=(d.daily||[]).map(x=>`<tr><td>${esc(x.date)}</td><td><span class="tag ${tagClass(x.status)}">${esc(x.status)}</span></td><td>${esc(x.attendance?.clock_in||'-')}</td><td>${esc(x.attendance?.clock_out||'-')}</td></tr>`).join('');status.textContent='給与計算の下書きを作成して保存しました。';result.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){result.style.display='none';status.textContent='計算できません：'+e.message}finally{calc.disabled=false}};load();</script></body></html>
