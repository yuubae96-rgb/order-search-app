<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>タイムカード・欠務届 一括読取</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;margin:0;color:#111827}.w{max-width:820px;margin:auto;padding:22px 16px 48px}.c{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin-bottom:14px}h1,h2,h3{margin:0 0 8px}.m{font-size:13px;color:#64748b;line-height:1.7}.back{display:inline-block;margin-bottom:12px;color:#2563eb;text-decoration:none;font-weight:800}label{display:block;font-size:13px;font-weight:800;margin-top:12px}input,select{width:100%;box-sizing:border-box;padding:12px;margin-top:5px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;background:#fff}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:14px;background:#111827;color:#fff;font-weight:800;font-size:16px}.blue{background:#2563eb}.green{background:#0f766e}.orange{background:#b45309}.gray{background:#475569}.status{margin-top:10px;padding:10px;border-radius:10px;background:#f8fafc;font-size:13px;white-space:pre-wrap}.period{background:#eff6ff;border:1px solid #93c5fd;border-radius:12px;padding:12px;margin-top:10px;font-weight:800}.item{border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-top:10px}.item.ok{border-color:#86efac;background:#f0fdf4}.item.warn{border:2px solid #f59e0b;background:#fffbeb}.item.done{opacity:.65}.itemhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:18px;font-weight:900}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#e2e8f0}.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.mini{font-size:12px;color:#475569;margin-top:8px;line-height:1.7}.rows{margin-top:8px;border-top:1px solid #e2e8f0;padding-top:8px;font-size:12px;max-height:160px;overflow:auto}.row{display:grid;grid-template-columns:110px 1fr 1fr;gap:8px;padding:5px 0;border-bottom:1px solid #f1f5f9}.row4{grid-template-columns:110px 1fr 1fr 1fr}.topnote{background:#fff7ed;border:1px solid #fdba74;border-radius:12px;padding:12px;font-size:13px;line-height:1.7}.count{font-weight:900;color:#2563eb}.hide{display:none}@media(max-width:620px){.itemhead{display:block}.row,.row4{grid-template-columns:1fr}.itemhead select{margin-top:10px}}</style></head><body><div class="w"><a class="back" href="./hr.html">← 勤怠・給与へ戻る</a><div class="c"><h1>タイムカード・欠務届 一括読取</h1><div class="m">スキャナーで保存したPDF・画像をまとめて選びます。社員を先に選ぶ必要はありません。AIが用紙の名前を読み、社員情報と自動で結び付けます。</div></div><div class="c"><label>支給対象月</label><input id="payMonth" type="month"><div id="period" class="period"></div><div class="topnote" style="margin-top:12px">複数ファイルを一度に選べます。さらに、<b>複数人分を1つにまとめた複数ページPDF</b>も社員ごとに分けて読み取ります。名前が曖昧なものだけ手動確認してください。</div></div><div class="c"><h2>1. タイムカードをまとめて読む</h2><input id="timeFiles" type="file" multiple accept="image/*,application/pdf"><button class="btn blue" id="readTimes">選んだタイムカードを一括AI読取</button><div id="timeStatus" class="status">まだ読み取っていません。</div><div id="timeItems"></div><button class="btn green hide" id="confirmAllTimes">社員が確定しているタイムカードを一括確定</button></div><div class="c"><h2>2. 欠務届をまとめて読む</h2><input id="absenceFiles" type="file" multiple accept="image/*,application/pdf"><button class="btn orange" id="readAbsences">選んだ欠務届を一括AI読取</button><div id="absenceStatus" class="status">まだ読み取っていません。</div><div id="absenceItems"></div><button class="btn green hide" id="confirmAllAbsences">社員が確定している欠務届を一括確定</button></div></div><script>const HR='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/hr-direct',AI='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/attendance-ai';let employees=[],timeResults=[],absenceResults=[];const now=new Date();payMonth.value=now.toISOString().slice(0,7);async function post(url,p){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function loadEmployees(){const j=await post(HR,{action:'list_employees'});employees=j.data||[]}function updatePeriod(){const v=payMonth.value;if(!/^\d{4}-\d{2}$/.test(v)){period.textContent='';return}const[y,m]=v.split('-').map(Number),s=new Date(Date.UTC(y,m-2,21)).toISOString().slice(0,10);period.textContent=`給与対象期間：${s} 〜 ${v}-20`}payMonth.onchange=updatePeriod;updatePeriod();async function fileBase64(f){return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)})}function employeeOptions(selected){return '<option value="">社員を選択</option>'+employees.map(e=>`<option value="${e.id}" ${String(selected)===String(e.id)?'selected':''}>${esc(e.name)}（${esc(e.department||'')}・${esc(e.employment_type||'未設定')}）</option>`).join('')}async function analyzeFiles(type,files,statusEl){const all=[];for(let i=0;i<files.length;i++){const f=files[i];if(f.size>18*1024*1024){all.push({error:`${f.name}：18MBを超えています`,file_name:f.name});continue}statusEl.textContent=`${files.length}件中 ${i+1}件目をAI読取中…\n${f.name}`;try{const j=await post(AI,{action:'analyze_batch',document_type:type,payroll_month:payMonth.value,file_name:f.name,mime_type:f.type||'application/octet-stream',base64:await fileBase64(f)});for(const x of(j.items||[]))all.push({...x,file_name:f.name})}catch(e){all.push({error:`${f.name}：${e.message}`,file_name:f.name})}}statusEl.textContent=`読取完了：${all.filter(x=>!x.error).length}人分 / エラー ${all.filter(x=>x.error).length}件`;return all}function detailsHtml(item,type){const p=item.parsed||{};if(type==='timecard'){const rs=p.records||[];return `<div class="mini">読取日数：${rs.length}日</div><div class="rows">${rs.slice(0,40).map(r=>`<div class="row"><span>${esc(r.date)}</span><span>出勤 ${esc(r.clock_in||'-')}</span><span>退勤 ${esc(r.clock_out||'-')}</span></div>`).join('')}</div>`}const es=p.events||[];return `<div class="mini">届出件数：${es.length}件</div><div class="rows">${es.slice(0,40).map(r=>`<div class="row row4"><span>${esc(r.date)}</span><span>${esc(r.type||'-')}</span><span>${esc(r.start_time||'-')}</span><span>${esc(r.end_time||'-')}</span></div>`).join('')}</div>`}function renderResults(results,container,type){container.innerHTML='';results.forEach((x,i)=>{if(x.error){const d=document.createElement('div');d.className='item warn';d.textContent=x.error;container.appendChild(d);return}const m=x.employee_match||{},eid=m.employee?.id||'';const d=document.createElement('div');d.className='item '+(eid?'ok':'warn');d.id=`${type}_${i}`;d.innerHTML=`<div class="itemhead"><div><div class="name">${esc(m.read_name||'名前を読めませんでした')}</div><span class="badge ${eid?'ok':'warn'}">${eid?'社員自動照合済み':'要確認'}</span><div class="mini">元ファイル：${esc(x.file_name||'')}</div></div><div style="min-width:270px"><label>この書類の社員</label><select data-i="${i}">${employeeOptions(eid)}</select></div></div>${detailsHtml(x,type)}<button class="btn gray" data-confirm="${i}">この1人分を確定</button><div class="mini" id="msg_${type}_${i}"></div>`;container.appendChild(d)});container.querySelectorAll('select[data-i]').forEach(s=>s.onchange=()=>{const x=results[Number(s.dataset.i)];x.manual_employee_id=s.value?Number(s.value):null;document.getElementById(`${type}_${s.dataset.i}`).className='item '+(s.value?'ok':'warn')});container.querySelectorAll('button[data-confirm]').forEach(b=>b.onclick=()=>confirmOne(results,Number(b.dataset.confirm),type,b));const has=results.some(x=>!x.error);(type==='timecard'?confirmAllTimes:confirmAllAbsences).classList.toggle('hide',!has)}async function confirmOne(results,i,type,btn){const x=results[i];if(!x||x.error)return;const select=document.querySelector(`#${type}_${i} select[data-i="${i}"]`);const eid=Number(x.manual_employee_id||select?.value||x.employee_match?.employee?.id||0);if(!eid)return alert('社員を選んでください');try{btn.disabled=true;await post(AI,{action:'confirm',document_id:x.document.id,employee_id:eid,document_type:type,parsed:x.parsed});x.confirmed=true;document.getElementById(`${type}_${i}`).classList.add('done');document.getElementById(`msg_${type}_${i}`).textContent='確定済み';}catch(e){alert('確定エラー：'+e.message)}finally{btn.disabled=false}}async function confirmAll(results,type,button){const targets=results.map((x,i)=>({x,i})).filter(({x,i})=>{if(x.error||x.confirmed)return false;const s=document.querySelector(`#${type}_${i} select[data-i="${i}"]`);return Number(x.manual_employee_id||s?.value||x.employee_match?.employee?.id||0)>0});if(!targets.length)return alert('確定できる書類がありません');button.disabled=true;let ok=0,ng=0;for(const{ x,i }of targets){const s=document.querySelector(`#${type}_${i} select[data-i="${i}"]`),eid=Number(x.manual_employee_id||s?.value||x.employee_match?.employee?.id||0);try{await post(AI,{action:'confirm',document_id:x.document.id,employee_id:eid,document_type:type,parsed:x.parsed});x.confirmed=true;document.getElementById(`${type}_${i}`).classList.add('done');document.getElementById(`msg_${type}_${i}`).textContent='確定済み';ok++}catch(e){document.getElementById(`msg_${type}_${i}`).textContent='確定エラー：'+e.message;ng++}}button.disabled=false;alert(`${ok}人分を確定しました${ng?`（${ng}件エラー）`:''}`)}readTimes.onclick=async()=>{const fs=[...timeFiles.files];if(!fs.length)return alert('タイムカードのPDF・画像を選んでください');readTimes.disabled=true;timeResults=await analyzeFiles('timecard',fs,timeStatus);renderResults(timeResults,timeItems,'timecard');readTimes.disabled=false};readAbsences.onclick=async()=>{const fs=[...absenceFiles.files];if(!fs.length)return alert('欠務届のPDF・画像を選んでください');readAbsences.disabled=true;absenceResults=await analyzeFiles('absence_report',fs,absenceStatus);renderResults(absenceResults,absenceItems,'absence_report');readAbsences.disabled=false};confirmAllTimes.onclick=()=>confirmAll(timeResults,'timecard',confirmAllTimes);confirmAllAbsences.onclick=()=>confirmAll(absenceResults,'absence_report',confirmAllAbsences);loadEmployees();</script></body></html>
