<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>タイムカード・欠務届 AI読取</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;margin:0;color:#111827}.w{max-width:760px;margin:auto;padding:22px 16px 48px}.c{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin-bottom:14px}h1,h2{margin:0 0 8px}.m{font-size:13px;color:#64748b;line-height:1.7}.back{display:inline-block;margin-bottom:12px;color:#2563eb;text-decoration:none;font-weight:800}label{display:block;font-size:13px;font-weight:800;margin-top:12px}input,select{width:100%;box-sizing:border-box;padding:12px;margin-top:5px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;background:#fff}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:14px;background:#111827;color:#fff;font-weight:800;font-size:16px}.blue{background:#2563eb}.green{background:#0f766e}.orange{background:#b45309}.status{margin-top:10px;padding:10px;border-radius:10px;background:#f8fafc;font-size:13px;white-space:pre-wrap}.period{background:#eff6ff;border:1px solid #93c5fd;border-radius:12px;padding:12px;margin-top:10px;font-weight:800}.review{margin-top:14px}.row{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:8px;background:#fff}.row.uncertain{border:2px solid #f59e0b}.row-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}.row-grid4{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:8px}.small{font-size:12px;color:#64748b}.hide{display:none}.match{margin-top:12px;padding:12px;border-radius:12px;border:1px solid #cbd5e1;background:#f8fafc}.match.ok{background:#ecfdf5;border-color:#86efac}.match.warn{background:#fff7ed;border-color:#fdba74}.payinfo{margin-top:8px;font-size:13px;line-height:1.7}@media(max-width:620px){.row-grid,.row-grid4{grid-template-columns:1fr}}</style></head><body><div class="w"><a class="back" href="./hr.html">← 勤怠・給与へ戻る</a><div class="c"><h1>タイムカード・欠務届 AI読取</h1><div class="m">タイムカードや欠務届に書かれた氏名をAIが読み、社員マスターと自動照合します。本人が特定できない場合だけ手動で社員を選びます。</div></div><div class="c"><label>支給対象月</label><input id="payMonth" type="month"><div id="period" class="period"></div></div><div class="c"><h2>1. タイムカード</h2><div class="m">写真またはPDFを選びます。氏名・日付・出勤・退勤を読み取ります。</div><input id="timeFile" type="file" accept="image/*,application/pdf"><button class="btn blue" id="readTime">タイムカードをAIで読む</button><div id="timeStatus" class="status">まだ読み取っていません。</div><div id="timeMatch"></div><div id="timeReview" class="review"></div><button class="btn green hide" id="confirmTime">このタイムカードを確定</button></div><div class="c"><h2>2. 欠務届</h2><div class="m">欠務届も氏名を自動照合します。欠勤・有休・遅刻・早退・外出などを読み取ります。</div><input id="absenceFile" type="file" accept="image/*,application/pdf"><button class="btn orange" id="readAbsence">欠務届をAIで読む</button><div id="absenceStatus" class="status">まだ読み取っていません。</div><div id="absenceMatch"></div><div id="absenceReview" class="review"></div><button class="btn green hide" id="confirmAbsence">この欠務届を確定</button></div></div><script>
const HR='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/hr-direct',AI='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/attendance-ai';let employees=[],timeDoc=null,timeParsed=null,timeEmployeeId=null,absenceDoc=null,absenceParsed=null,absenceEmployeeId=null;const now=new Date();payMonth.value=now.toISOString().slice(0,7);async function post(url,p){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j}async function loadEmployees(){const j=await post(HR,{action:'list_employees'});employees=j.data||[]}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function updatePeriod(){const v=payMonth.value;if(!/^\d{4}-\d{2}$/.test(v)){period.textContent='';return}const[y,m]=v.split('-').map(Number),s=new Date(Date.UTC(y,m-2,21)).toISOString().slice(0,10),e=v+'-20';period.textContent=`給与対象期間：${s} 〜 ${e}`}payMonth.onchange=updatePeriod;updatePeriod();async function fileBase64(f){return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)})}function empSelect(id,current){return `<select id="${id}"><option value="">社員を選択してください</option>${employees.map(e=>`<option value="${e.id}" ${String(e.id)===String(current)?'selected':''}>${esc(e.name)}（${esc(e.department||'')}・${esc(e.employment_type||'未設定')}）</option>`).join('')}</select>`}function payText(e){if(!e)return'';const type=e.employment_type==='正社員'?'日給月給':e.employment_type==='パート'?'時給':e.wage_type==='hourly'?'時給':e.wage_type==='daily_monthly'?'日給月給':'未設定';const amount=type==='時給'?(e.hourly_base?`時給 ${Number(e.hourly_base).toLocaleString()}円`:'時給未登録'):(e.monthly_salary?`月額 ${Number(e.monthly_salary).toLocaleString()}円`:'月額未登録');return `${type} / ${amount} / 交通費 ${Number(e.transportation_allowance||0).toLocaleString()}円`}function renderMatch(target,j,kind){const m=j.employee_match||{},isTime=kind==='time',matched=m.status==='matched'&&m.employee;if(isTime)timeEmployeeId=matched?m.employee.id:null;else absenceEmployeeId=matched?m.employee.id:null;if(matched){target.innerHTML=`<div class="match ok"><b>本人を自動特定しました：${esc(m.employee.name)}</b><div class="payinfo">${esc(payText(m.employee))}</div><div class="m">AI読取名：${esc(m.read_name)}</div></div>`}else{target.innerHTML=`<div class="match warn"><b>⚠️ 社員を自動特定できませんでした</b><div class="m">AI読取名：${esc(m.read_name||'読み取れず')}</div><label>この書類は誰のものですか？</label>${empSelect(kind+'Emp','')}</div>`;document.getElementById(kind+'Emp').onchange=e=>{const id=Number(e.target.value)||null;if(isTime)timeEmployeeId=id;else absenceEmployeeId=id;const emp=employees.find(x=>x.id===id);if(emp){const d=document.createElement('div');d.className='payinfo';d.textContent=payText(emp);e.target.parentElement.appendChild(d)}}}if(isTime)confirmTime.classList.toggle('hide',!timeEmployeeId||!(timeParsed?.records||[]).length);else confirmAbsence.classList.toggle('hide',!absenceEmployeeId||!(absenceParsed?.events||[]).length)}async function analyze(type,f,statusEl,matchEl){if(!f)return alert(type==='timecard'?'タイムカードを選んでください':'欠務届を選んでください');if(f.size>9*1024*1024)return alert('9MB以下のファイルにしてください');statusEl.textContent='AIが氏名と内容を読み取っています…';const j=await post(AI,{action:'analyze',document_type:type,payroll_month:payMonth.value,file_name:f.name,mime_type:f.type||'application/octet-stream',base64:await fileBase64(f)});statusEl.textContent=`読み取り完了。対象期間 ${j.start}〜${j.end}。黄色枠は要確認です。`;renderMatch(matchEl,j,type==='timecard'?'time':'absence');return j}function renderTime(){timeReview.innerHTML='';const rs=timeParsed?.records||[];rs.forEach((r,i)=>{const d=document.createElement('div');d.className='row '+(r.uncertain?'uncertain':'');d.innerHTML=`<div class="row-grid"><div><label>日付</label><input data-i="${i}" data-k="date" type="date" value="${r.date||''}"></div><div><label>出勤</label><input data-i="${i}" data-k="clock_in" type="time" value="${r.clock_in||''}"></div><div><label>退勤</label><input data-i="${i}" data-k="clock_out" type="time" value="${r.clock_out||''}"></div></div><div class="small">${esc(r.note||'')}</div>`;timeReview.appendChild(d)});timeReview.querySelectorAll('input').forEach(x=>x.onchange=()=>{timeParsed.records[Number(x.dataset.i)][x.dataset.k]=x.value});confirmTime.classList.toggle('hide',!timeEmployeeId||!rs.length)}function renderAbsence(){absenceReview.innerHTML='';const rs=absenceParsed?.events||[];rs.forEach((r,i)=>{const d=document.createElement('div');d.className='row '+(r.uncertain?'uncertain':'');d.innerHTML=`<div class="row-grid4"><div><label>日付</label><input data-i="${i}" data-k="date" type="date" value="${r.date||''}"></div><div><label>種類</label><select data-i="${i}" data-k="type">${['欠勤','有休','遅刻','早退','外出','その他'].map(x=>`<option ${r.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>開始</label><input data-i="${i}" data-k="start_time" type="time" value="${r.start_time||''}"></div><div><label>終了</label><input data-i="${i}" data-k="end_time" type="time" value="${r.end_time||''}"></div></div><label>メモ</label><input data-i="${i}" data-k="note" value="${esc(r.note||'')}">`;absenceReview.appendChild(d)});absenceReview.querySelectorAll('input,select').forEach(x=>x.onchange=()=>{absenceParsed.events[Number(x.dataset.i)][x.dataset.k]=x.value||null});confirmAbsence.classList.toggle('hide',!absenceEmployeeId||!rs.length)}readTime.onclick=async()=>{try{readTime.disabled=true;timeEmployeeId=null;const j=await analyze('timecard',timeFile.files[0],timeStatus,timeMatch);if(j){timeDoc=j.document;timeParsed=j.parsed;renderTime();renderMatch(timeMatch,j,'time')}}catch(e){timeStatus.textContent='読み取りエラー：'+e.message}finally{readTime.disabled=false}};readAbsence.onclick=async()=>{try{readAbsence.disabled=true;absenceEmployeeId=null;const j=await analyze('absence_report',absenceFile.files[0],absenceStatus,absenceMatch);if(j){absenceDoc=j.document;absenceParsed=j.parsed;renderAbsence();renderMatch(absenceMatch,j,'absence')}}catch(e){absenceStatus.textContent='読み取りエラー：'+e.message}finally{readAbsence.disabled=false}};confirmTime.onclick=async()=>{if(!timeEmployeeId)return alert('社員を確定してください');try{confirmTime.disabled=true;await post(AI,{action:'confirm',document_id:timeDoc.id,employee_id:timeEmployeeId,document_type:'timecard',parsed:timeParsed});const e=employees.find(x=>x.id===timeEmployeeId);timeStatus.textContent=`${e?.name||''}さんのタイムカードを確定し、勤怠実績へ反映しました。`;alert('タイムカードを確定しました')}catch(e){alert('確定エラー：'+e.message)}finally{confirmTime.disabled=false}};confirmAbsence.onclick=async()=>{if(!absenceEmployeeId)return alert('社員を確定してください');try{confirmAbsence.disabled=true;await post(AI,{action:'confirm',document_id:absenceDoc.id,employee_id:absenceEmployeeId,document_type:'absence_report',parsed:absenceParsed});const e=employees.find(x=>x.id===absenceEmployeeId);absenceStatus.textContent=`${e?.name||''}さんの欠務届を確定し、欠務データへ反映しました。`;alert('欠務届を確定しました')}catch(e){alert('確定エラー：'+e.message)}finally{confirmAbsence.disabled=false}};loadEmployees();
</script></body></html>
