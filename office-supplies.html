<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>事務用品在庫</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;margin:0;color:#111827}.w{max-width:650px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px 40px}.c{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;margin-bottom:12px}h1,h2{margin:0 0 8px}.m{font-size:13px;color:#64748b;line-height:1.7}.row{padding:11px 0;border-bottom:1px solid #e2e8f0}.row:last-child{border-bottom:0}.low{color:#b91c1c;font-weight:900}input,select{width:100%;box-sizing:border-box;padding:12px;margin-top:7px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;border:0;border-radius:11px;padding:13px;background:#111827;color:#fff;font-weight:800;margin-top:10px}.blue{background:#2563eb}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./standalone-auth.js"></script></head><body><div class="w"><div class="c"><div style="font-size:12px;font-weight:800;color:#64748b">OFFICE</div><h1>事務用品在庫</h1><div class="m">コピー用紙・トナー・封筒・梱包テープなどを管理します。</div><div id="list"></div></div><div class="c"><h2>品目登録</h2><input id="name" placeholder="品名"><div class="grid"><input id="stock" type="number" placeholder="現在庫"><input id="reorder" type="number" placeholder="発注点"></div><input id="price" type="number" placeholder="単価"><button class="btn" id="add">登録</button></div><div class="c"><h2>入庫・使用</h2><select id="item"></select><div class="grid"><button class="btn blue" id="inBtn">入庫</button><button class="btn" id="outBtn">使用</button></div><input id="qty" type="number" placeholder="数量"><button class="btn" id="save">登録する</button></div></div><script>
const db=supabase.createClient('https://vnnvuxccazkdzwqjmntz.supabase.co','sb_publishable_xG-tuBgxFGntT1vlbZzuVQ_AZ2Zl8QL');let type='out';async function load(){const {data}=await db.from('office_supplies').select('*').eq('active',true).order('name');const rows=data||[];list.innerHTML=rows.length?rows.map(x=>`<div class="row"><b>${x.name}</b><div class="${Number(x.current_stock)<=Number(x.reorder_point)?'low':'m'}">現在 ${x.current_stock}${x.unit||'個'} ／ 発注点 ${x.reorder_point}</div></div>`).join(''):'<div class="m">まだ登録がありません。</div>';item.innerHTML='<option value="">選択してください</option>';rows.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;item.appendChild(o)})}load();add.onclick=async()=>{if(!name.value)return;const {error}=await db.from('office_supplies').insert({name:name.value,current_stock:Number(stock.value||0),reorder_point:Number(reorder.value||0),unit_price:Number(price.value||0)});alert(error?'エラー：'+error.message:'登録しました');if(!error){name.value=stock.value=reorder.value=price.value='';load()}};inBtn.onclick=()=>{type='in';inBtn.style.opacity='1';outBtn.style.opacity='.55'};outBtn.onclick=()=>{type='out';outBtn.style.opacity='1';inBtn.style.opacity='.55'};save.onclick=async()=>{if(!item.value||!qty.value)return alert('品目と数量を選んでください');const {error}=await db.from('office_supply_movements').insert({supply_id:Number(item.value),movement_type:type,quantity:Number(qty.value)});alert(error?'エラー：'+error.message:(type==='in'?'入庫':'使用')+'を登録しました');if(!error){qty.value='';load()}};
</script></body></html>
